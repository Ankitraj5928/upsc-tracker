<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Track your day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --paper:#efe7d8; --card:#faf6ec; --card-2:#f3ecdd;
    --ink:#23201a; --ink-soft:#6f675a; --ink-faint:#a59c8b;
    --accent:#b4521f; --accent-deep:#8a3d15; --gold:#a9831f;
    --green:#3f7d3a; --green-soft:#e3efdc; --red:#a8331f; --red-soft:#f3ddd6;
    --line:rgba(35,32,26,.14); --line-soft:rgba(35,32,26,.08);
    --surface-hi:#ffffff; --gold-soft:#f6edcf; --star-bg:#fff7e6;
    --shadow:0 1px 2px rgba(35,32,26,.06), 0 8px 24px -12px rgba(35,32,26,.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Hanken Grotesk',sans-serif; color:var(--ink); line-height:1.45;
    background:var(--paper);
    min-height:100vh; padding-bottom:64px; -webkit-font-smoothing:antialiased; transition:background .25s,color .25s;
  }
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}

  .topbar{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line);}
  .topbar-inner{max-width:1080px;margin:0 auto;padding:16px 20px 0;}
  .brand{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .brand h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(22px,3.4vw,30px);letter-spacing:-.01em;margin:0;line-height:1;}
  .brand h1 .dot{color:var(--accent);}
  .brand .sub{font-size:12.5px;color:var(--ink-soft);letter-spacing:.14em;text-transform:uppercase;margin-top:6px;}
  .brand .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
  .icon-btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px;transition:.18s;}
  .icon-btn:hover{color:var(--ink);border-color:var(--ink-soft);transform:translateY(-1px);}

  .cloud-chip{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);}
  .cloud-chip .dotled{width:8px;height:8px;border-radius:50%;background:var(--ink-faint);flex:0 0 auto;}
  .cloud-chip.synced{color:var(--green);border-color:transparent;background:var(--green-soft);}
  .cloud-chip.synced .dotled{background:var(--green);}
  .cloud-chip.saving .dotled{background:var(--gold);animation:pulse 1s infinite;}
  .cloud-chip.saving{color:var(--gold);}
  .cloud-chip.error{color:var(--red);background:var(--red-soft);border-color:transparent;}
  .cloud-chip.error .dotled{background:var(--red);}
  @keyframes pulse{50%{opacity:.25;}}

  .tabs{max-width:1080px;margin:0 auto;padding:14px 12px 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{border:none;background:transparent;white-space:nowrap;padding:10px 16px 14px;font-size:14.5px;font-weight:600;color:var(--ink-soft);border-bottom:2.5px solid transparent;transition:.16s;border-radius:6px 6px 0 0;}
  .tab:hover{color:var(--ink);background:rgba(35,32,26,.035);}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);}

  .wrap{max-width:1080px;margin:0 auto;padding:26px 20px 0;}
  .view{display:none;animation:rise .35s cubic-bezier(.2,.7,.3,1);}
  .view.active{display:block;}
  @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
  .section-head h2{font-family:'Fraunces',serif;font-weight:600;font-size:24px;margin:0;letter-spacing:-.01em;}
  .section-head p{margin:4px 0 0;color:var(--ink-soft);font-size:13.5px;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);}
  .grid{display:grid;gap:16px;}
  @media(min-width:760px){.g-2{grid-template-columns:1fr 1fr;}.g-3{grid-template-columns:repeat(3,1fr);}.g-4{grid-template-columns:repeat(4,1fr);}}

  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
  .stat .label{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;}
  .stat .value{font-family:'Fraunces',serif;font-size:34px;font-weight:600;line-height:1.1;margin-top:6px;}
  .stat .value small{font-size:15px;color:var(--ink-soft);font-family:'Hanken Grotesk';font-weight:600;}
  .stat .foot{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .stat.accent{background:linear-gradient(160deg,var(--accent),var(--accent-deep));color:#fff;border-color:transparent;}
  .stat.accent .label{color:rgba(251,238,222,.8);}
  .stat.accent .foot{color:rgba(251,238,222,.78);}

  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:12px;font-weight:600;color:var(--ink-soft);letter-spacing:.02em;}
  input[type=text],input[type=date],input[type=number],textarea,select{width:100%;border:1px solid var(--line);background:var(--card-2);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink);transition:.15s;}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);background:var(--surface-hi);box-shadow:0 0 0 3px rgba(180,82,31,.12);}
  textarea{resize:vertical;min-height:46px;}

  .btn{border:none;background:var(--accent);color:#fff;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;transition:.16s;box-shadow:0 6px 16px -8px rgba(180,82,31,.7);}
  .btn:hover{background:var(--accent-deep);transform:translateY(-1px);}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none;}
  .btn.ghost:hover{border-color:var(--ink-soft);}
  .btn.sm{padding:7px 12px;font-size:13px;}
  .btn.block{width:100%;justify-content:center;}
  .del{background:none;border:none;color:var(--ink-faint);font-size:18px;line-height:1;padding:4px 6px;border-radius:8px;transition:.15s;}
  .del:hover{color:var(--red);background:var(--red-soft);}

  .date-nav{display:flex;align-items:center;gap:10px;}
  .date-nav .arrow{border:1px solid var(--line);background:var(--card);border-radius:10px;width:38px;height:38px;font-size:18px;color:var(--ink-soft);display:grid;place-items:center;}
  .date-nav .arrow:hover{color:var(--ink);border-color:var(--ink-soft);}
  .date-nav input[type=date],.date-nav input[type=month]{height:38px;padding:0 10px;}

  .task-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line-soft);}
  .task-row:last-child{border-bottom:none;}
  .chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:0 0 auto;display:grid;place-items:center;transition:.16s;background:var(--card-2);}
  .chk.on{background:var(--green);border-color:var(--green);}
  .chk.on::after{content:"✓";color:#fff;font-size:14px;font-weight:700;}
  .task-row .name{flex:1;font-size:15px;font-weight:500;}
  .task-row.done .name{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--ink-faint);}

  .hour-row{display:flex;gap:10px;align-items:center;margin-bottom:10px;}
  .hour-row select{flex:1;}
  .hour-row input{width:96px;}

  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--card-2);border:1px solid var(--line);color:var(--ink-soft);}
  .pill.green{background:var(--green-soft);color:var(--green);border-color:transparent;}
  .pill.red{background:var(--red-soft);color:var(--red);border-color:transparent;}
  .pill.gold{background:var(--gold-soft);color:var(--gold);border-color:transparent;}

  .target-row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line-soft);}
  .target-row:last-child{border-bottom:none;}
  .target-row .meta{flex:1;}
  .target-row .meta .t-title{font-weight:600;font-size:15px;}
  .target-row.done .t-title{text-decoration:line-through;color:var(--ink-soft);}
  .target-row .meta .t-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

  .progress{height:9px;border-radius:999px;background:var(--card-2);overflow:hidden;border:1px solid var(--line-soft);}
  .progress > span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:999px;transition:width .5s cubic-bezier(.2,.7,.3,1);}

  .bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:8px;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;}
  .bar{width:100%;max-width:34px;background:linear-gradient(180deg,var(--accent),var(--gold));border-radius:6px 6px 3px 3px;min-height:3px;transition:height .5s cubic-bezier(.2,.7,.3,1);position:relative;}
  .bar .v{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--ink-soft);}
  .bar-col .d{font-size:11px;color:var(--ink-soft);font-weight:600;}
  .bar-col.today .d{color:var(--accent);}

  .series-card{margin-bottom:16px;}
  .series-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
  .series-head .name{font-family:'Fraunces',serif;font-size:19px;font-weight:600;}

  /* ── Test Series tab ── */
  .ts-phase-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .ts-phase-btn{padding:9px 16px;border-radius:20px;font-size:13.5px;font-weight:700;border:2px solid var(--line);background:var(--card-2);color:var(--ink-soft);cursor:pointer;transition:all .15s;}
  .ts-phase-btn.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .ts-paper-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none;}
  .ts-paper-row::-webkit-scrollbar{display:none;}
  .ts-paper-btn{padding:6px 14px;border-radius:16px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--card-2);color:var(--ink-soft);cursor:pointer;white-space:nowrap;transition:all .15s;}
  .ts-paper-btn.on{background:var(--accent);color:#fff;border-color:var(--accent);opacity:.9;}
  .ts-body{margin-top:4px;}
  .ts-empty{padding:24px 16px;text-align:center;color:var(--ink-soft);font-size:14px;line-height:1.6;background:var(--card-2);border-radius:12px;border:1px dashed var(--line);}
  .ts-act-row{display:flex;align-items:center;gap:10px;margin:0 0 14px;}
  .ts-cnt{font-size:13px;color:var(--ink-soft);}
  .ts-list{display:flex;flex-direction:column;gap:10px;}
  .ts-card{background:var(--card-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;}
  .ts-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .ts-card-left{display:flex;align-items:center;flex-wrap:wrap;gap:5px;}
  .ts-card-right{display:flex;align-items:center;gap:8px;}
  .ts-no{font-weight:700;font-size:14px;color:var(--ink);}
  .ts-code{font-size:11.5px;color:var(--ink-faint);background:var(--line-soft);padding:1px 6px;border-radius:5px;}
  .ts-type{font-size:11px;background:var(--line-soft);padding:2px 7px;border-radius:6px;color:var(--ink-soft);}
  .ts-date{font-size:12px;color:var(--ink-soft);}
  .ts-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:2px;}
  .ts-sc{font-family:'Fraunces',serif;font-size:22px;font-weight:700;line-height:1;}
  .ts-sc small{font-family:inherit;font-size:13px;color:var(--ink-soft);font-weight:400;}
  .ts-chip{font-size:12px;background:var(--line-soft);padding:2px 8px;border-radius:8px;color:var(--ink-soft);}
  .ts-air{background:var(--accent-soft,#fdf0ea);color:var(--accent);}
  .ts-ratings{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;}
  .ts-notes{font-size:12.5px;color:var(--ink-soft);margin-top:8px;padding-top:8px;border-top:1px solid var(--line-soft);line-height:1.5;}
  .ts-syl{font-size:12.5px;color:var(--ink-soft);margin-top:8px;line-height:1.5;}
  .ts-syl-tag{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--accent);background:var(--accent-soft,#fdf0ea);padding:1px 7px;border-radius:6px;margin-right:5px;}
  .up-next{background:var(--accent);color:#fff;border-radius:14px;padding:16px 18px;margin-bottom:14px;text-align:center;}
  .up-next-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.6px;opacity:.85;}
  .up-next-days{font-family:'Fraunces',serif;font-size:32px;font-weight:700;line-height:1.1;margin:2px 0;}
  .up-next-meta{font-size:12.5px;opacity:.92;}
  .up-countdown{font-weight:700;color:var(--accent);font-size:14px;}
  .ts-card-past{opacity:.6;}
  .ts-essays{display:flex;flex-direction:column;gap:4px;margin-top:6px;}
  .ts-ess{font-size:12.5px;color:var(--ink-soft);}
  .ts-ess b{color:var(--ink);font-weight:700;}
  .ts-live{margin:10px 0 2px;padding:10px 12px;background:var(--green-soft,#f0faf4);border-radius:10px;border:1px solid var(--line);}

  /* ── Test Suite dashboard widget ── */
  .ts-wg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
  @media(min-width:480px){.ts-wg-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));}}
  .ts-wg-cell{background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:9px 8px;text-align:center;cursor:pointer;transition:border-color .15s;}
  .ts-wg-cell:hover{border-color:var(--accent);}
  .ts-wg-lbl{font-size:10.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.3px;}
  .ts-wg-val{font-family:'Fraunces',serif;font-size:15px;font-weight:700;color:var(--ink);line-height:1.2;margin:3px 0;}
  .ts-wg-sub{font-size:10px;color:var(--ink-faint);}
  .ts-det-cell{cursor:pointer;transition:background .12s;}
  .ts-det-cell:hover{background:var(--line-soft)!important;border-radius:10px;}
  table{width:100%;border-collapse:collapse;margin-top:10px;}
  th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600;}
  td{padding:10px;border-bottom:1px solid var(--line-soft);font-size:13.5px;vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .score-tag{font-weight:700;font-family:'Fraunces',serif;}
  .empty{text-align:center;color:var(--ink-faint);font-size:14px;padding:26px 10px;font-style:italic;}
  .add-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:4px;}
  .add-bar .field{flex:1;min-width:140px;}
  .row-flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .mini-note{font-size:12px;color:var(--ink-soft);background:var(--card-2);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;}

  .modal-bg{position:fixed;inset:0;background:rgba(35,32,26,.45);backdrop-filter:blur(3px);display:none;place-items:center;z-index:80;padding:18px;}
  .modal-bg.show{display:grid;}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:26px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);}
  .modal h3{font-family:'Fraunces',serif;font-size:22px;margin:0 0 4px;}
  .modal .lead{color:var(--ink-soft);font-size:13.5px;margin:0 0 18px;}
  .steps{counter-reset:s;list-style:none;padding:0;margin:0 0 18px;}
  .steps li{counter-increment:s;position:relative;padding:0 0 14px 38px;font-size:13.5px;color:var(--ink);}
  .steps li::before{content:counter(s);position:absolute;left:0;top:-2px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;}
  .steps li b{font-weight:700;}
  .steps code{background:var(--card-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12.5px;word-break:break-all;}
  .uri-box{display:flex;gap:8px;align-items:center;background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 12px;font-size:12.5px;word-break:break-all;margin-top:6px;}
  .uri-box code{flex:1;background:none;border:none;padding:0;}
  .modal-close{position:relative;float:right;margin:-8px -8px 0 0;}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#f3ecdd;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);opacity:0;transition:.28s;z-index:90;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---- custom-tab additions ---- */
  .linkbtn{background:none;border:none;color:var(--accent);font-size:11px;font-weight:700;padding:0 0 0 4px;text-decoration:underline;letter-spacing:0;text-transform:none;}
  .picker-grid{display:grid;gap:12px;grid-template-columns:1fr;margin-top:6px;}
  @media(min-width:520px){.picker-grid{grid-template-columns:1fr 1fr;}}
  .pick{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--card-2);border-radius:14px;padding:13px 14px;transition:.16s;width:100%;}
  .pick:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow);background:var(--surface-hi);}
  .pick .ic{font-size:22px;line-height:1.1;flex:0 0 auto;width:30px;text-align:center;}
  .pick .nm{font-weight:700;font-size:14.5px;}
  .pick .ds{font-size:12px;color:var(--ink-soft);margin-top:2px;}

  .ctab-head .row-flex{flex-wrap:wrap;}
  .big-progress{height:11px;}
  .mono-time{font-family:'Fraunces',serif;font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:.01em;}

  .timer-display{text-align:center;padding:14px 0 6px;}
  .timer-display .clock{font-size:clamp(54px,13vw,84px);line-height:1;}
  .timer-display .mode{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;margin-bottom:6px;}
  .timer-ctrls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px;}
  .ring-wrap{display:grid;place-items:center;position:relative;}
  .ring-wrap .ring-label{position:absolute;text-align:center;max-width:78%;display:flex;flex-direction:column;align-items:center;}
  .ring-wrap .ring-label .clock{font-size:30px;line-height:1.05;}
  .ring-wrap .ring-label .mode{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;margin-bottom:3px;}

  .counter-card{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line-soft);}
  .counter-card:last-child{border-bottom:none;}
  .counter-card .cval{font-family:'Fraunces',serif;font-size:30px;font-weight:600;min-width:52px;text-align:center;}
  .stepper{display:flex;align-items:center;gap:8px;}
  .stepper button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card-2);font-size:20px;color:var(--ink);display:grid;place-items:center;transition:.14s;}
  .stepper button:hover{border-color:var(--accent);color:var(--accent);}

  .xgrid-wrap{overflow-x:auto;}
  table.xgrid{width:100%;border-collapse:collapse;min-width:420px;}
  table.xgrid th,table.xgrid td{padding:9px 10px;border-bottom:1px solid var(--line-soft);font-size:13.5px;}
  table.xgrid th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);text-align:center;}
  table.xgrid th:first-child,table.xgrid td:first-child{text-align:left;font-weight:600;}
  table.xgrid td{text-align:center;}
  .xcell{width:24px;height:24px;border-radius:6px;border:2px solid var(--line);display:inline-grid;place-items:center;background:var(--card-2);transition:.14s;cursor:pointer;}
  .xcell.on{background:var(--green);border-color:var(--green);}
  .xcell.on::after{content:"✓";color:#fff;font-size:13px;font-weight:700;}

  .note-card{background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;}
  .note-card input.note-title{font-weight:700;border:none;background:none;padding:4px 0;font-size:15px;}
  .note-card input.note-title:focus{box-shadow:none;border-bottom:1px solid var(--accent);}
  .note-card textarea{background:var(--surface-hi);}

  /* ---- side menu / hamburger ---- */
  .topbar-inner{padding:12px 16px;}
  .brand{align-items:center;}
  .brand-left{display:flex;align-items:center;gap:12px;min-width:0;}
  .menu-btn{border:1px solid var(--line);background:var(--card);border-radius:11px;width:42px;height:42px;font-size:20px;color:var(--ink);display:grid;place-items:center;flex:0 0 auto;transition:.16s;}
  .menu-btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px);}
  .brand-home{background:none;border:none;padding:0;text-align:left;cursor:pointer;min-width:0;}
  .brand-home:hover h1{color:var(--accent-deep);}

  .drawer-bg{position:fixed;inset:0;background:rgba(35,32,26,.42);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;}
  .drawer-bg.show{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;left:0;height:100%;width:296px;max-width:84vw;background:var(--card);border-right:1px solid var(--line);box-shadow:0 0 60px -10px rgba(35,32,26,.4);transform:translateX(-104%);transition:transform .28s cubic-bezier(.2,.7,.3,1);z-index:70;display:flex;flex-direction:column;}
  .drawer.open{transform:translateX(0);}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 12px;border-bottom:1px solid var(--line-soft);}
  .drawer-title{font-family:'Fraunces',serif;font-size:20px;font-weight:600;}
  .drawer-hint{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .drawer-nav{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;}
  .m-row{display:flex;align-items:center;gap:6px;border-radius:12px;transition:.14s;}
  .m-row:hover{background:rgba(35,32,26,.04);}
  .m-row.active{background:var(--gold-soft);}
  .m-row.active .m-label{color:var(--accent);font-weight:700;}
  .m-item{flex:1;display:flex;align-items:center;gap:12px;background:none;border:none;padding:12px 12px;text-align:left;color:var(--ink);min-width:0;}
  .m-ic{width:24px;text-align:center;font-size:17px;flex:0 0 auto;color:var(--ink-soft);}
  .m-row.active .m-ic{color:var(--accent);}
  .m-label{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .m-del{flex:0 0 auto;border:none;background:none;color:var(--ink-faint);font-size:20px;line-height:1;width:34px;height:34px;border-radius:9px;margin-right:6px;transition:.14s;}
  .m-del:hover{color:var(--red);background:var(--red-soft);}
  .drawer-foot{padding:14px 8px 6px;margin-top:6px;border-top:1px solid var(--line-soft);}
  .m-hidden{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);}
  .m-hid-h{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin:0 4px 8px;}
  .m-restore{display:block;width:100%;text-align:left;background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;transition:.14s;}
  .m-restore:hover{border-color:var(--green);color:var(--green);}

  /* ---- dashboard ---- */
  .greet{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .greet-hi{font-family:'Fraunces',serif;font-size:22px;font-weight:600;}
  .greet-date{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .cust-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip-toggle{border:1px solid var(--line);background:var(--card-2);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink-soft);transition:.14s;}
  .chip-toggle:hover{border-color:var(--ink-soft);}
  .chip-toggle.on{background:var(--green-soft);color:var(--green);border-color:transparent;}
  .countdown{background:linear-gradient(155deg,var(--accent),var(--accent-deep));color:#fff;border-color:transparent;}
  .countdown.empty-cd{background:var(--card);color:var(--ink);border:1px solid var(--line);}
  .cd-label{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;opacity:.85;}
  .cd-edit{background:rgba(255,255,255,.16);border:none;color:inherit;font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;}
  .empty-cd .cd-edit{background:var(--card-2);color:var(--ink-soft);}
  .cd-main{display:flex;align-items:baseline;gap:10px;margin-top:6px;}
  .cd-days{font-family:'Fraunces',serif;font-size:clamp(46px,12vw,68px);font-weight:600;line-height:1;}
  .cd-unit{font-size:15px;font-weight:600;opacity:.85;}
  .cd-name{font-size:14px;font-weight:600;margin-top:4px;opacity:.92;}
  .cd-others{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;}
  .cd-others .pill{background:rgba(255,255,255,.16);color:#fbeede;border-color:transparent;}
  .cd-empty-text{font-size:13.5px;color:var(--ink-soft);margin-top:4px;}
  .cd-editor{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.22);}
  .empty-cd .cd-editor{border-top-color:var(--line-soft);}
  .countdown .cd-editor label{color:rgba(251,238,222,.85);}
  .countdown .cd-editor input{background:rgba(255,255,255,.94);color:var(--ink);border-color:transparent;}
  .empty-cd .cd-editor input{background:var(--card-2);color:var(--ink);border:1px solid var(--line);}
  .cd-list{margin-top:12px;display:flex;flex-direction:column;gap:6px;}
  .cd-list-row{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:600;background:rgba(255,255,255,.12);border-radius:9px;padding:7px 10px;}
  .empty-cd .cd-list-row{background:var(--card-2);}
  .countdown .cd-list-row .del{color:rgba(251,238,222,.7);}
  .countdown .cd-list-row .del:hover{color:#fff;background:rgba(255,255,255,.18);}

  .qa-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  @media(min-width:560px){.qa-grid{grid-template-columns:repeat(4,1fr);}}
  .qa{display:flex;flex-direction:column;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 8px;font-size:13px;font-weight:600;color:var(--ink);box-shadow:var(--shadow);transition:.16s;}
  .qa:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px);}
  .qa-ic{font-size:22px;}

  .dl-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line-soft);cursor:pointer;border-radius:8px;transition:.14s;}
  .dl-row:last-of-type{border-bottom:none;}
  .dl-row:hover{background:rgba(35,32,26,.035);}
  .dl-meta{min-width:0;}
  .dl-title{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dl-src{font-size:11.5px;color:var(--ink-faint);margin-top:2px;text-transform:uppercase;letter-spacing:.06em;}
  .dl-more{font-size:12.5px;color:var(--ink-soft);padding:8px 4px 0;}

  .task-row .dt-text{flex:1;border:none;background:transparent;font-size:15px;font-weight:500;padding:6px 0;min-width:0;color:var(--ink);}
  .task-row .dt-text:focus{box-shadow:none;border-bottom:1px solid var(--accent);}
  .task-row.done .dt-text{text-decoration:line-through;color:var(--ink-faint);}

  /* ---- dashboard grid + new widgets ---- */
  .dash-grid{display:grid;grid-template-columns:1fr;gap:16px;}
  .dw{grid-column:1/-1;min-width:0;}
  @media(min-width:380px){ .dash-grid{grid-template-columns:1fr 1fr;} .dw.full{grid-column:1/-1;} .dw.half{grid-column:span 1;} }
  .dw .stat,.dw .card,.dw .qa-grid{height:100%;}

  /* arrange mode */
  .arrange-banner{position:sticky;top:8px;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent);color:#fff;border-radius:12px;padding:10px 14px;margin-bottom:16px;box-shadow:var(--shadow);}
  .arrange-banner .ab-txt{font-size:12.5px;font-weight:700;}
  .arrange-banner .btn{background:var(--surface-hi);color:var(--accent);box-shadow:none;}
  .arranging-grid{position:relative;}
  .dw.arranging{position:relative;touch-action:none;-webkit-user-select:none;user-select:none;transition:transform .04s;}
  .dw.arranging .dw-body{pointer-events:none;}
  .dw-shield{position:absolute;inset:0;z-index:2;border:2px dashed var(--accent);border-radius:16px;background:rgba(180,82,31,.05);cursor:grab;}
  .dw.arranging.dragging{z-index:50;}
  .dw.arranging.dragging .dw-shield{cursor:grabbing;background:rgba(180,82,31,.1);}
  .dw.arranging.drop-target .dw-shield{border-style:solid;background:rgba(180,82,31,.16);}
  .dw-bar{position:absolute;top:7px;left:7px;right:7px;z-index:3;display:flex;align-items:center;gap:7px;pointer-events:none;}
  .dw-grip{font-size:15px;color:var(--accent);background:var(--surface-hi);border-radius:8px;padding:1px 6px;box-shadow:var(--shadow);}
  .dw-name{font-size:10.5px;font-weight:800;color:var(--accent);background:var(--surface-hi);border-radius:8px;padding:3px 8px;box-shadow:var(--shadow);text-transform:uppercase;letter-spacing:.05em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dw-size{margin-left:auto;pointer-events:auto;background:var(--surface-hi);color:var(--accent);border:none;border-radius:8px;min-width:34px;height:30px;font-size:15px;font-weight:700;box-shadow:var(--shadow);}

  .star-card{position:relative;border:1px solid var(--accent);background:linear-gradient(180deg,var(--star-bg),var(--card));box-shadow:0 4px 16px -8px rgba(180,82,31,.35);}
  .star-label{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:800;color:var(--accent);}
  .star{color:var(--accent);}
  .focus-input{font-family:'Fraunces',serif;font-size:18px;font-weight:600;border:none;background:transparent;padding:10px 0 4px;margin-top:4px;}
  .focus-input:focus{box-shadow:none;border-bottom:2px solid var(--accent);}
  .focus-input::placeholder{font-weight:500;color:var(--ink-faint);}
  .mit-row{display:flex;align-items:center;gap:12px;padding:7px 0;}
  .mit-input{border:none;background:transparent;font-size:15px;font-weight:500;padding:6px 0;border-bottom:1px solid var(--line-soft);}
  .mit-input:focus{box-shadow:none;border-bottom:1px solid var(--accent);}
  .mit-row.done .mit-input{text-decoration:line-through;color:var(--ink-faint);}

  .heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .heat-cell{aspect-ratio:1;border-radius:5px;background:var(--card-2);border:1px solid var(--line-soft);}
  .heat-cell.lvl1{background:#dcefd9;border-color:transparent;}
  .heat-cell.lvl2{background:#a8e0a0;border-color:transparent;}
  .heat-cell.lvl3{background:#5fb85a;border-color:transparent;}
  .heat-cell.lvl4{background:#2f8f3a;border-color:transparent;}

  .sticky-wrap{display:grid;grid-template-columns:repeat(auto-fill,168px);gap:16px;justify-content:flex-start;}
  .sticky{width:168px;aspect-ratio:1/1;border-radius:4px;padding:13px;box-shadow:2px 4px 10px -4px rgba(35,32,26,.45);display:flex;flex-direction:column;transform:rotate(-.7deg);}
  .sticky:nth-child(even){transform:rotate(.7deg);}
  .sticky.s-yellow{background:#fdf0b0;} .sticky.s-green{background:#cdeecb;} .sticky.s-pink{background:#fbd3de;} .sticky.s-blue{background:#cfe4fb;}
  .sticky-text{flex:1;background:transparent;border:none;resize:none;font-size:14px;line-height:1.45;color:#42382a;font-family:inherit;}
  .sticky-text:focus{box-shadow:none;}
  .sticky-foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px;}
  .sticky-colors{display:flex;gap:5px;}
  .sc{width:16px;height:16px;border-radius:50%;cursor:pointer;border:2px solid rgba(0,0,0,.12);}
  .sc.on{border-color:rgba(0,0,0,.5);}
  .sc-yellow{background:#f5d63d;} .sc-green{background:#7ccf73;} .sc-pink{background:#f490ab;} .sc-blue{background:#7fb6f2;}
  .sticky .del{color:rgba(66,56,42,.5);} .sticky .del:hover{color:#42382a;background:rgba(0,0,0,.08);}

  .cust-list{display:flex;flex-direction:column;gap:8px;}
  .cust-row{display:flex;align-items:center;gap:10px;background:var(--card-2);border:1px solid var(--line);border-radius:11px;padding:8px 10px;}
  .cust-ord{display:flex;flex-direction:column;gap:3px;}
  .cust-ord button{width:30px;height:22px;border:1px solid var(--line);background:var(--card);border-radius:7px;font-size:13px;line-height:1;color:var(--ink-soft);display:grid;place-items:center;}
  .cust-ord button:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
  .cust-ord button:disabled{opacity:.32;}
  .cust-name{flex:1;font-weight:600;font-size:14.5px;min-width:0;}
  .cust-rm{border:none;background:none;color:var(--ink-faint);font-size:18px;width:34px;height:34px;border-radius:9px;}
  .cust-rm:hover{color:var(--red);background:var(--red-soft);}
  .cust-avail{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);}
  .chip-toggle.star-chip{border-color:var(--accent);color:var(--accent);background:var(--star-bg);}
  /* ---- master settings ---- */
  .set-sec{padding:16px 0;border-top:1px solid var(--line-soft);}
  .set-sec:first-of-type{border-top:none;padding-top:6px;}
  .set-h{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--ink-soft);margin-bottom:10px;}
  .set-lab{font-size:12px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:8px;}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .seg-btn{background:var(--card-2);border:none;padding:9px 18px;font-size:13px;font-weight:700;color:var(--ink-soft);}
  .seg-btn.on{background:var(--accent);color:#fff;}
  .theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:8px;}
  .theme-swatch{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--card-2);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;color:var(--ink);}
  .theme-swatch.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;}
  .tsw-dot{width:18px;height:18px;border-radius:50%;flex:0 0 auto;border:1px solid rgba(0,0,0,.12);}
  .set-btns{display:flex;gap:8px;flex-wrap:wrap;}

  /* ---- dark mode: full palette is applied inline by applyTheme(); only paper-stickies need fixed dark text ---- */
  html.dark input:focus,html.dark textarea:focus,html.dark select:focus{box-shadow:0 0 0 3px rgba(255,255,255,.07);}
  html.dark .sticky-text{color:#2c2618;}
  html.dark .sticky-text::placeholder{color:rgba(44,38,24,.5);}

  /* ---- motivation quote widget ---- */
  .quote-text{font-family:'Fraunces',serif;font-style:italic;font-size:19px;line-height:1.5;margin:14px 0 10px;color:var(--ink);}
  .quote-meta{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:8px;}
  .qw-btn{border:1px solid var(--line);background:var(--card-2);border-radius:9px;width:34px;height:32px;font-size:15px;color:var(--ink-soft);transition:.14s;}
  .qw-btn:hover{border-color:var(--accent);color:var(--accent);}

  /* ---- photo notes widget ---- */
  .pn-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  .pn-card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card-2);display:flex;flex-direction:column;}
  .pn-img{width:100%;height:130px;object-fit:cover;display:block;background:var(--line-soft);}
  .pn-cap{border:none;background:transparent;resize:none;font-size:13px;line-height:1.4;padding:8px 10px;min-height:40px;color:var(--ink);font-family:inherit;}
  .pn-cap:focus{box-shadow:none;}
  .pn-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 10px 8px;border-top:1px solid var(--line-soft);}
  .pn-date{font-size:11px;color:var(--ink-faint);}
  .pn-foot .linkbtn{font-size:11.5px;padding:0;}
  .pn-foot .del{position:static;width:26px;height:26px;font-size:16px;}

  /* ---- rich notes (image + link) ---- */
  .nt-imgwrap{position:relative;margin-top:10px;}
  .nt-img{width:100%;max-height:200px;object-fit:cover;border-radius:10px;display:block;border:1px solid var(--line);}
  .nt-imgdel{position:absolute;top:6px;right:6px;border:none;background:rgba(0,0,0,.55);color:#fff;border-radius:8px;width:26px;height:26px;font-size:15px;line-height:1;}
  .nt-linkrow{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .nt-link{flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .nt-linkdel{border:1px solid var(--line);background:var(--card-2);color:var(--ink-soft);border-radius:8px;width:24px;height:24px;font-size:14px;line-height:1;flex:0 0 auto;}
  .nt-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}

  /* ---- hours detail modal ---- */
  .hours-hint{font-size:11.5px;color:var(--ink-faint);text-align:right;margin-top:8px;}
  .hd-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin:8px 0 4px;}
  .hd-stat{background:var(--card-2);border:1px solid var(--line-soft);border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:3px;}
  .hd-stat span{font-size:11px;color:var(--ink-soft);}
  .hd-stat b{font-family:'Fraunces',serif;font-size:18px;}
  .hd-h{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);margin:16px 0 8px;font-weight:800;}
  .hd-list{display:flex;flex-direction:column;gap:7px;}
  .hd-row{display:flex;align-items:center;gap:10px;}
  .hd-lab{font-size:13px;width:90px;flex:0 0 auto;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hd-track{flex:1;height:8px;background:var(--line-soft);border-radius:5px;overflow:hidden;}
  .hd-track span{display:block;height:100%;background:var(--accent);border-radius:5px;}
  .hd-val{font-size:12.5px;font-weight:600;width:38px;text-align:right;flex:0 0 auto;color:var(--ink-soft);}

  /* keep the Add button on its own full-width row on phones so it never overlaps inputs */
  @media(max-width:540px){ .add-bar .btn{flex:1 1 100%;width:100%;} }

  /* ---- timer auto-log row ---- */
  .autolog-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line-soft);}
  .al-toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);font-weight:600;cursor:pointer;}
  .al-toggle input{width:16px;height:16px;accent-color:var(--accent);}
  .al-subj{max-width:200px;}

  /* ---- weekly review ---- */
  .wr-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;}
  .wr-mini>div{background:var(--card-2);border:1px solid var(--line-soft);border-radius:10px;padding:10px 6px;}
  .wr-mini b{font-family:'Fraunces',serif;font-size:20px;display:block;}
  .wr-mini span{font-size:11px;color:var(--ink-soft);}
  .wr-hi{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;}
  .wr-hi li{font-size:13.5px;line-height:1.45;color:var(--ink);}
  .wr-note{width:100%;min-height:110px;margin-top:4px;}

  /* ---- momentum (merged) widget ---- */
  .mo-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;}
  .mo-stats>div{background:var(--card-2);border:1px solid var(--line-soft);border-radius:10px;padding:10px 6px;}
  .mo-stats b{font-family:'Fraunces',serif;font-size:22px;display:block;line-height:1.1;}
  .mo-stats span{font-size:11px;color:var(--ink-soft);}
  .heat-lg{gap:5px;}
  .heat-legend{display:flex;align-items:center;justify-content:flex-end;gap:5px;font-size:11px;color:var(--ink-soft);margin-top:8px;}

  function todayStr(d){ d=d||new Date(); const tz=d.getTimezoneOffset()*60000; return new Date(d-tz).toISOString().slice(0,10); }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function fmtDate(str){ if(!str)return''; const d=new Date(str+'T00:00:00'); return d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}); }
  function fmtDateShort(str){ const d=new Date(str+'T00:00:00'); return d.toLocaleDateString(undefined,{day:'numeric',month:'short'}); }
  function weekday(str){ return new Date(str+'T00:00:00').toLocaleDateString(undefined,{weekday:'short'}); }
  function addDays(str,n){ const d=new Date(str+'T00:00:00'); d.setDate(d.getDate()+n); return todayStr(d); }
  function weekStart(dateStr){ const d=new Date((dateStr||todayStr())+'T00:00:00'); const off=(d.getDay()+6)%7; d.setDate(d.getDate()-off); return todayStr(d); }
  function shiftMonth(key,delta){ const p=key.split('-'); const d=new Date(+p[0],(+p[1]-1)+delta,1); return todayStr(d).slice(0,7); }
  function monthEnd(key){ const p=key.split('-'); const d=new Date(+p[0],+p[1],0); return todayStr(d); }
  function periodMap(kind){ return kind==='weekly'?S.weeks:S.months; }
  function getBucket(kind,key,create){ const m=periodMap(kind); if(!m[key]){ if(!create) return {tasks:[]}; m[key]={tasks:[]}; } return m[key]; }
  function dayObj(date){ if(!S.days[date]) S.days[date]={checks:{},hours:[],note:'',tasks:[]}; return S.days[date]; }
  function dayTasks(o){ if(!Array.isArray(o.tasks)) o.tasks=[]; return o.tasks; }
  function dayTaskStats(date){ const o=S.days[date]; if(!o) return {done:0,tot:0}; if(Array.isArray(o.tasks)) return {done:o.tasks.filter(x=>x.done).length,tot:o.tasks.length}; const ch=o.checks||{}; const ks=Object.keys(ch); return {done:ks.filter(k=>ch[k]).length,tot:ks.length}; }
  function dayHours(date){ const o=S.days[date]; if(!o)return 0; return (o.hours||[]).reduce((a,b)=>a+(parseFloat(b.h)||0),0); }
  function dayActive(date){ const o=S.days[date]; if(!o)return false; if(dayHours(date)>0) return true; if(Array.isArray(o.tasks)) return o.tasks.some(x=>x.done); return Object.values(o.checks||{}).some(Boolean); }
  let toastTimer;
  function toast(msg){ let t=document.querySelector('.toast'); if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t);} t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1900); }

  /* ===================== PERSISTENCE ===================== */
  function persistLocal(){ try{ localStorage.setItem(STATE_KEY,JSON.stringify(S)); }catch(e){} }
  function persist(){ persistLocal(); scheduleCloudSave(); }
  function scheduleCloudSave(){ if(!cloud.connected) return; clearTimeout(cloud.saveTimer); setSyncStatus('saving'); cloud.saveTimer=setTimeout(cloudSave,1100); }

  /* ===================== GOOGLE IDENTITY / DRIVE ===================== */
  function gisReady(){ return !!(window.google && google.accounts && google.accounts.oauth2); }
  function whenGisReady(timeout){ timeout=timeout||9000; return new Promise(res=>{ const t0=Date.now(); (function p(){ if(gisReady())return res(true); if(Date.now()-t0>timeout)return res(false); setTimeout(p,150); })(); }); }
  function initTokenClient(){
    if(tokenClient) return;
    tokenClient=google.accounts.oauth2.initTokenClient({
      client_id:cloud.clientId, scope:SCOPE,
      callback:(resp)=>{ if(resp&&resp.access_token){ accessToken=resp.access_token; tokenExpiry=Date.now()+(parseInt(resp.expires_in||3600,10)*1000)-60000; if(pendingResolve)pendingResolve(accessToken); } else { if(pendingReject)pendingReject(new Error('no token')); } pendingResolve=pendingReject=null; },
      error_callback:(err)=>{ if(pendingReject)pendingReject(err||new Error('token error')); pendingResolve=pendingReject=null; }
    });
  }
  function requestToken(interactive){ return new Promise((resolve,reject)=>{ pendingResolve=resolve; pendingReject=reject; try{ tokenClient.requestAccessToken({prompt:interactive?'consent':''}); }catch(e){ pendingResolve=pendingReject=null; reject(e); } }); }
  async function getToken(){ if(accessToken && Date.now()<tokenExpiry) return accessToken; return await requestToken(false); }

  async function findFile(token){
    const url='https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,name)&q='+encodeURIComponent("name='"+FILE_NAME+"'");
    const res=await fetch(url,{headers:{Authorization:'Bearer '+token}});
    if(!res.ok) throw new Error('list '+res.status);
    const j=await res.json(); return (j.files&&j.files[0])?j.files[0].id:null;
  }
  async function cloudLoad(){
    const token=await getToken();
    if(!driveFileId) driveFileId=await findFile(token);
    if(!driveFileId) return null;
    const res=await fetch('https://www.googleapis.com/drive/v3/files/'+driveFileId+'?alt=media',{headers:{Authorization:'Bearer '+token}});
    if(res.status===404){ driveFileId=null; return null; }
    if(!res.ok) throw new Error('get '+res.status);
    const data=await res.json(); return data.state||data;
  }
  async function cloudSave(){
    if(!cloud.connected) return;
    try{
      const token=await getToken();
      const body=JSON.stringify({_app:'upsc-tracker',_v:1,saved:new Date().toISOString(),state:S});
      if(!driveFileId) driveFileId=await findFile(token);
      if(!driveFileId){
        const boundary='upscbnd'+Date.now();
        const meta={name:FILE_NAME,parents:['appDataFolder']};
        const multipart='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+body+'\r\n--'+boundary+'--';
        const res=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'multipart/related; boundary='+boundary},body:multipart});
        if(!res.ok) throw new Error('create '+res.status);
        const j=await res.json(); driveFileId=j.id;
      } else {
        const res=await fetch('https://www.googleapis.com/upload/drive/v3/files/'+driveFileId+'?uploadType=media',{method:'PATCH',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body});
        if(!res.ok){ if(res.status===404){ driveFileId=null; return cloudSave(); } throw new Error('update '+res.status); }
      }
      setSyncStatus('synced');
    }catch(e){ console.warn('drive save',e); setSyncStatus('error'); }
  }

  async function connectDrive(){
    if(!cloud.clientId){ openCloudModal(); return; }
    const ready=gisReady()||await whenGisReady();
    if(!ready){ toast('Google sign-in didn’t load — check connection'); return; }
    try{
      setSyncStatus('saving');
      initTokenClient();
      await requestToken(false);
      cloud.connected=true; localStorage.setItem(CONNECTED_KEY,'1');
      await mergeWithCloud();
      closeCloudModal(); render(); toast('Google Drive connected');
    }catch(e){ console.warn(e); cloud.connected=false; setSyncStatus('error'); toast('Could not connect — check the setup steps'); }
  }
  async function mergeWithCloud(){
    let remote=null;
    try{ remote=await cloudLoad(); }catch(e){ setSyncStatus('error'); return; }
    const remoteHasData=remote&&(Object.keys(remote.days||{}).length||(remote.weekly||[]).length||(remote.monthly||[]).length||Object.keys(remote.weeks||{}).length||Object.keys(remote.months||{}).length||(remote.series||[]).length||(remote.syllabus||[]).length||(remote.customTabs||[]).length);
    const localHasData=(Object.keys(S.days).length||Object.keys(S.weeks).length||Object.keys(S.months).length||S.series.length||S.customTabs.length);
    if(remoteHasData){
      const useCloud=!localHasData||confirm("A backup was found in your Google Drive.\n\nOK = Load it onto this device (replaces local data).\nCancel = Keep this device's data and overwrite the cloud copy.");
      if(useCloud){ S=normalize(remote); persistLocal(); setSyncStatus('synced'); } else { await cloudSave(); }
    } else { await cloudSave(); }
  }
  async function tryAutoConnect(){
    if(!cloud.clientId||localStorage.getItem(CONNECTED_KEY)!=='1') return;
    const ready=await whenGisReady(); if(!ready) return;
    try{
      initTokenClient();
      await requestToken(false);
      cloud.connected=true;
      const remote=await cloudLoad(); if(remote){ S=normalize(remote); persistLocal(); }
      setSyncStatus('synced'); render();
    }catch(e){ console.warn('auto-connect',e); cloud.connected=false; setSyncStatus('local'); }
  }
  function disconnectDrive(){
    try{ if(accessToken&&gisReady()) google.accounts.oauth2.revoke(accessToken,()=>{}); }catch(e){}
    accessToken=null; tokenExpiry=0; driveFileId=null; cloud.connected=false; localStorage.removeItem(CONNECTED_KEY);
    setSyncStatus('local'); render(); toast('Disconnected (local copy kept)');
  }
  function setSyncStatus(s){ cloud.status=s; const chip=document.getElementById('cloud-chip'); if(!chip)return; chip.className='cloud-chip '+(s==='synced'?'synced':s==='saving'?'saving':s==='error'?'error':''); const txt={local:'Local only',saving:'Syncing…',synced:'Drive synced',error:'Sync error'}[s]||'Local only'; chip.innerHTML='<span class="dotled"></span>'+txt; }

  function tabIcon(type){ const t=TAB_TYPES.find(x=>x.type===type); return t?t.icon:'▣'; }

  /* ---- side menu ---- */
  function validTab(id){
    if(id==='dashboard') return true;
    if(BUILTIN_IDS.indexOf(id)>=0) return S.hiddenBuiltins.indexOf(id)<0;
    if(id.indexOf('res:')===0) return S.resourceTabs.some(t=>'res:'+t.id===id);
    if(id.indexOf('custom:')===0) return S.customTabs.some(t=>'custom:'+t.id===id);
    return false;
  }
  function ensureValidActiveTab(){ if(!validTab(activeTab)) activeTab='dashboard'; }
  function applyMenu(){ const d=document.getElementById('drawer'); const bg=document.getElementById('drawer-bg'); if(d) d.classList.toggle('open',menuOpen); if(bg) bg.classList.toggle('show',menuOpen); }
  function closeMenu(){ menuOpen=false; menuManage=false; render(); }
  function menuRow(tabId,icon,label,delKind,delId){
    const active=activeTab===tabId;
    return `<div class="m-row ${active?'active':''}"><button class="m-item" data-go="${tabId}"><span class="m-ic">${icon}</span><span class="m-label">${esc(label)}</span></button>${menuManage?`<button class="m-del" data-delkind="${delKind}" data-delid="${esc(delId)}" title="Delete tab">×</button>`:''}</div>`;
  }
  function menuHTML(){
    const rows=[];
    BUILTINS.forEach(b=>{ if(S.hiddenBuiltins.indexOf(b.id)<0) rows.push(menuRow(b.id,b.icon,b.label,'builtin',b.id)); });
    S.resourceTabs.forEach(t=> rows.push(menuRow('res:'+t.id,'🔗',t.name,'res',t.id)) );
    S.customTabs.forEach(t=> rows.push(menuRow('custom:'+t.id,tabIcon(t.type),t.name,'custom',t.id)) );

  function wireMenu(){
    const d=document.getElementById('drawer'); if(!d) return;
    d.querySelectorAll('.m-item[data-go]').forEach(b=>b.onclick=()=>{ activeTab=b.dataset.go; resFilter='All'; menuOpen=false; menuManage=false; render(); });

    const cz=document.getElementById('m-settings'); if(cz) cz.onclick=()=>{ menuOpen=false; menuManage=false; render(); openSettings(); };

  function deleteTab(kind,id){
    if(kind==='builtin'){
      const b=BUILTINS.find(x=>x.id===id);
      uiConfirm({ title:'Remove tab?', message:`Remove the "${b?b.label:id}" tab from the menu? Your saved data stays — restore it any time from “Edit / delete tabs”.`, okText:'Remove', danger:true, onOk:()=>{ if(S.hiddenBuiltins.indexOf(id)<0) S.hiddenBuiltins.push(id); if(activeTab===id) activeTab='dashboard'; menuOpen=true; menuManage=true; persist(); render(); toast('Tab removed'); } });
    } else if(kind==='res'){
      const t=S.resourceTabs.find(x=>x.id===id); if(!t) return;
      uiConfirm({ title:'Delete tab?', message:`Delete the "${t.name}" tab and all its links?`, okText:'Delete', danger:true, onOk:()=>{ S.resourceTabs=S.resourceTabs.filter(x=>x.id!==id); if(activeTab==='res:'+id) activeTab='dashboard'; menuOpen=true; menuManage=true; persist(); render(); toast('Tab deleted'); } });
    } else if(kind==='custom'){
      const t=S.customTabs.find(x=>x.id===id); if(!t) return;
      uiConfirm({ title:'Delete tab?', message:`Delete the "${t.name}" tab and everything in it?`, okText:'Delete', danger:true, onOk:()=>{ stopRuntime(id); S.customTabs=S.customTabs.filter(x=>x.id!==id); if(activeTab==='custom:'+id) activeTab='dashboard'; menuOpen=true; menuManage=true; persist(); render(); toast('Tab deleted'); } });
    }
  }

  /* ===================== DASHBOARD ===================== */
  function greeting(){ const h=new Date().getHours(); return h<12?'Good morning':h<17?'Good afternoon':'Good evening'; }
  function daysUntil(dateStr){ const a=new Date(todayStr()+'T00:00:00'); const b=new Date(dateStr+'T00:00:00'); return Math.round((b-a)/86400000); }
  function collectDeadlines(){
    const today=todayStr(); const out=[];
    Object.keys(S.weeks).forEach(k=>{ const end=addDays(k,6); S.weeks[k].tasks.forEach(x=>{ if(!x.done) out.push({title:x.text,deadline:end,src:'Weekly',srcTab:'weekly',period:k,overdue:end<today}); }); });
    Object.keys(S.months).forEach(k=>{ const end=monthEnd(k); S.months[k].tasks.forEach(x=>{ if(!x.done) out.push({title:x.text,deadline:end,src:'Monthly',srcTab:'monthly',period:k,overdue:end<today}); }); });
    S.customTabs.filter(t=>t.type==='targets').forEach(t=>t.items.forEach(x=>{ if(!x.done&&x.deadline) out.push({title:x.title,deadline:x.deadline,src:t.name,srcTab:'custom:'+t.id,period:'',overdue:x.deadline<today}); }));
    out.sort((a,b)=>(a.deadline||'').localeCompare(b.deadline||''));
    return out;

  function sizeOfNow(id){ const o=S.dashSizes&&S.dashSizes[id]; if(o==='half'||o==='full') return o; const w=DASH_WIDGETS.find(x=>x.id===id); return w?w.size:'full'; }
  function setWidgetSize(id,size){ if(!S.dashSizes)S.dashSizes={}; S.dashSizes[id]=size; persist(); renderDashboard(); }

  /* ---- drag-to-reorder + pinch/tap-to-resize (arrange mode) ---- */
  let arrMulti=false, arrDrag=null, arrPinch=null;
  function arrDist(t){ const dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY; return Math.hypot(dx,dy); }
  function arrNearest(grid,x,y,id){ let best=null,bd=Infinity; grid.querySelectorAll('.dw').forEach(s=>{ if(s.dataset.w===id) return; const r=s.getBoundingClientRect(); const cx=r.left+r.width/2,cy=r.top+r.height/2; const d=Math.hypot(x-cx,y-cy); if(d<bd){bd=d;best=s;} }); return best; }
  function arrPlace(id,tid,after){ const a=S.dashWidgets.filter(x=>x!==id); let i=a.indexOf(tid); if(i<0)i=a.length-1; a.splice(after?i+1:i,0,id); S.dashWidgets=a; persist(); }
  function arrangeBind(){
    const grid=document.querySelector('#v-dashboard .dash-grid'); if(!grid) return;
    grid.querySelectorAll('.dw.arranging').forEach(dw=>{
      const shield=dw.querySelector('.dw-shield'); const id=dw.dataset.w; if(!shield) return;
      const sb=dw.querySelector('.dw-size'); if(sb) sb.onclick=e=>{ e.stopPropagation(); setWidgetSize(id, sizeOfNow(id)==='full'?'half':'full'); };
      // pinch (two-finger) resize
      shield.ontouchstart=e=>{ if(e.touches.length===2){ arrMulti=true; arrPinch={id,d0:arrDist(e.touches)}; arrDrag=null; if(e.cancelable)e.preventDefault(); } };
      shield.ontouchmove=e=>{ if(arrPinch&&e.touches.length===2){ if(e.cancelable)e.preventDefault(); const r=arrDist(e.touches)/(arrPinch.d0||1); if(r>1.2){ const i=arrPinch.id; arrPinch=null; arrMulti=false; setWidgetSize(i,'full'); toast('Widget enlarged'); } else if(r<0.84){ const i=arrPinch.id; arrPinch=null; arrMulti=false; setWidgetSize(i,'half'); toast('Widget shrunk'); } } };
      shield.ontouchend=e=>{ if(e.touches.length<2){ arrPinch=null; setTimeout(()=>{arrMulti=false;},60); } };
      // drag (pointer) reorder
      shield.onpointerdown=e=>{ if(e.pointerType==='touch'&&arrMulti) return; if(typeof e.button==='number'&&e.button!==0) return; arrBeginDrag(e,dw,id); };
    });
  }
  function arrBeginDrag(e,dw,id){
    arrDrag={dw,id,sx:e.clientX,sy:e.clientY,moved:false,tgt:null};
    const mv=ev=>arrDragMove(ev); const up=ev=>{ arrDragEnd(ev); document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up); document.removeEventListener('pointercancel',up); };
    document.addEventListener('pointermove',mv,{passive:false}); document.addEventListener('pointerup',up); document.addEventListener('pointercancel',up);
  }
  function arrDragMove(e){
    if(!arrDrag) return;
    const dx=e.clientX-arrDrag.sx, dy=e.clientY-arrDrag.sy;
    if(!arrDrag.moved){ if(Math.hypot(dx,dy)<8) return; arrDrag.moved=true; arrDrag.dw.classList.add('dragging'); }
    if(e.cancelable)e.preventDefault();
    arrDrag.dw.style.transform=`translate(${dx}px,${dy}px)`;
    const grid=arrDrag.dw.parentNode; if(!grid) return;
    grid.querySelectorAll('.dw').forEach(s=>s.classList.remove('drop-target'));
    const tgt=arrNearest(grid,e.clientX,e.clientY,arrDrag.id); arrDrag.tgt=tgt; if(tgt) tgt.classList.add('drop-target');
  }
  function arrDragEnd(e){
    if(!arrDrag) return; const {dw,id,moved,tgt}=arrDrag;
    dw.style.transform=''; dw.classList.remove('dragging');
    const grid=dw.parentNode; if(grid) grid.querySelectorAll('.dw').forEach(s=>s.classList.remove('drop-target'));
    if(moved&&tgt){ const r=tgt.getBoundingClientRect(); const after=e.clientY>r.top+r.height/2; arrPlace(id,tgt.dataset.w,after); }
    arrDrag=null; renderDashboard();
  }

  /* ===================== WEEKLY / MONTHLY (per-period task lists) ===================== */
  function renderPeriod(kind){
    const el=document.getElementById('v-'+kind); if(!el)return;
    const isW=kind==='weekly'; const key=isW?curWeek:curMonth;
    const tasks=getBucket(kind,key,false).tasks;
    const done=tasks.filter(x=>x.done).length, tot=tasks.length, pct=tot?Math.round(done/tot*100):0;
    let label, isCur, nav;
    if(isW){ const s=key,e=addDays(key,6); label=`${fmtDateShort(s)} – ${fmtDateShort(e)}, ${new Date(e+'T00:00:00').getFullYear()}`; isCur=key===weekStart(todayStr()); nav=`<input type="date" class="p-date" value="${key}" style="width:auto;">`; }
    else { label=new Date(key+'-01T00:00:00').toLocaleDateString(undefined,{month:'long',year:'numeric'}); isCur=key===todayStr().slice(0,7); nav=`<input type="month" class="p-month" value="${key}" style="width:auto;max-width:160px;">`; }
    el.innerHTML=`
      <div class="section-head"><div><h2>${isW?'Weekly':'Monthly'} Targets</h2><p>${label}${isCur?(isW?' · This week':' · This month'):''}</p></div>
        <div class="date-nav"><button class="arrow p-prev">‹</button>${nav}<button class="arrow p-next">›</button></div></div>
      <div class="card" style="margin-bottom:16px;"><div class="row-flex" style="justify-content:space-between;margin-bottom:12px;"><span style="font-weight:600;">Completion</span><span class="pill ${pct===100&&tot?'green':'gold'}">${done}/${tot}${tot?` · ${pct}%`:''}</span></div>
        <div class="progress" style="margin-bottom:16px;"><span style="width:${pct}%"></span></div>
        <div class="add-bar"><div class="field" style="flex:2;"><label>New ${isW?'weekly':'monthly'} target</label><input type="text" class="p-new" placeholder="${isW?'e.g. Finish Modern History':'e.g. Complete Economy revision'}"></div><button class="btn p-add">Add target</button></div></div>
      <div class="card">${tot?tasks.map(x=>`<div class="task-row ${x.done?'done':''}" data-id="${x.id}"><div class="chk ${x.done?'on':''}"></div><input type="text" class="dt-text" value="${esc(x.text)}"><button class="del dt-del">×</button></div>`).join(''):`<div class="empty" style="padding:18px;">No targets for this ${isW?'week':'month'} yet — add one above.</div>`}</div>`;
    const re=()=>renderPeriod(kind);

    q('.p-prev').onclick=()=>{ if(isW) curWeek=weekStart(addDays(curWeek,-7)); else curMonth=shiftMonth(curMonth,-1); re(); };
    q('.p-next').onclick=()=>{ if(isW) curWeek=weekStart(addDays(curWeek,7)); else curMonth=shiftMonth(curMonth,1); re(); };
    if(isW){ const di=q('.p-date'); if(di) di.onchange=e=>{ if(e.target.value){ curWeek=weekStart(e.target.value); re(); } }; }
    else { const mi=q('.p-month'); if(mi) mi.onchange=e=>{ if(e.target.value){ curMonth=e.target.value; re(); } }; }
    const addT=()=>{ const n=q('.p-new'); const v=n.value.trim(); if(!v){n.focus();return;} getBucket(kind,key,true).tasks.push({id:uid(),text:v,done:false}); persist(); re(); toast('Target added'); };
    q('.p-add').onclick=addT;
    q('.p-new').onkeydown=e=>{ if(e.key==='Enter') addT(); };
    el.querySelectorAll('.task-row').forEach(row=>{ const id=row.dataset.id; const it=tasks.find(x=>x.id===id);
      row.querySelector('.chk').onclick=()=>{ it.done=!it.done; persist(); re(); };
      row.querySelector('.dt-text').onblur=e=>{ it.text=e.target.value; persist(); };
      row.querySelector('.dt-text').onkeydown=e=>{ if(e.key==='Enter') e.target.blur(); };
      row.querySelector('.dt-del').onclick=()=>{ const b=getBucket(kind,key,false); b.tasks=tasks.filter(x=>x.id!==id); if(periodMap(kind)[key]) periodMap(kind)[key].tasks=b.tasks; persist(); re(); };
    });
  }
  function renderWeekly(){ renderPeriod('weekly'); }
  function renderMonthly(){ renderPeriod('monthly'); }

  /* ===================== TEST SERIES (Prelims / Mains / Sociology) ===================== */
  function renderTests(){
    const el=document.getElementById('v-tests');if(!el)return;
    if(!S.testSeries)S.testSeries=blankTestSeries();
    const ph=TS_PHASES.find(p=>p.k===curTestPhase)||TS_PHASES[0];
    if(!ph.papers.includes(curTestPaper))curTestPaper=ph.papers[0];
    const tests=(S.testSeries[curTestPhase]&&S.testSeries[curTestPhase][curTestPaper]&&S.testSeries[curTestPhase][curTestPaper].tests)||[];
    el.innerHTML=`
      <div class="section-head"><div><h2>Test Series</h2><p>Prelims · Mains · Sociology Optional</p></div></div>
      <div class="ts-phase-row">${TS_PHASES.map(p=>`<button class="ts-phase-btn${p.k===curTestPhase?' on':''}" data-phase="${p.k}">${p.l}</button>`).join('')}</div>
      <div class="ts-paper-row">${ph.papers.map(p=>`<button class="ts-paper-btn${p===curTestPaper?' on':''}" data-paper="${p}">${TS_TAB[p]||p}</button>`).join('')}</div>
      <div class="ts-body">
        ${tsSummaryHtml(curTestPhase,curTestPaper,tests)}
        <div class="ts-act-row">
          <button class="btn sm" id="ts-add-btn">+ Log Test</button>
          <span class="ts-cnt">${tests.length} test${tests.length!==1?'s':''} logged</span>
          ${curTestPhase==='prelims'&&curTestPaper==='GS'?`<button class="linkbtn" id="ts-cutoff-btn" style="margin-left:auto;font-size:12px;">⚙ Cutoff: ${S.testSeries.cutoffs.gs}</button>`:''}
        </div>
        ${tsListHtml(curTestPhase,curTestPaper,tests)}
      </div>`;
    el.querySelectorAll('.ts-phase-btn').forEach(b=>b.onclick=()=>{curTestPhase=b.dataset.phase;curTestPaper=TS_PHASES.find(p=>p.k===curTestPhase).papers[0];renderTests();});
    el.querySelectorAll('.ts-paper-btn').forEach(b=>b.onclick=()=>{curTestPaper=b.dataset.paper;renderTests();});
    const ab=document.getElementById('ts-add-btn');if(ab)ab.onclick=()=>tsAddForm(curTestPhase,curTestPaper);
    const cb=document.getElementById('ts-cutoff-btn');if(cb)cb.onclick=()=>uiPrompt({title:'Set GS Cutoff Target',label:'Expected cutoff (/200)',placeholder:'110',value:String(S.testSeries.cutoffs.gs),okText:'Save',onOk:v=>{const n=+v;if(n>0&&n<=200){S.testSeries.cutoffs.gs=n;persist();renderTests();toast('Cutoff updated');}}});
    el.querySelectorAll('.ts-del-btn').forEach(b=>b.onclick=()=>uiConfirm({title:'Remove this entry?',message:'This cannot be undone.',okText:'Delete',danger:true,onOk:()=>{S.testSeries[curTestPhase][curTestPaper].tests.splice(+b.dataset.idx,1);persist();renderTests();}}));
  }

  function tsSummaryHtml(phase,paper,tests){
    if(!tests.length)return`<div class="ts-empty">No tests logged yet — tap <b>+ Log Test</b> to add your first ${TS_LABELS[paper]||paper} entry.</div>`;
    const ts=S.testSeries; const stats=[];
    if(phase==='prelims'&&paper==='GS'){
      const scores=tests.map(t=>tsGSScore(t));
      const avg=Math.round(scores.reduce((a,b)=>a+b,0)/scores.length*10)/10;
      const best=Math.max(...scores);
      const accs=tests.filter(t=>+(t.correct||0)+(+(t.wrong||0))>0).map(t=>tsGSAcc(t));
      const avgAcc=accs.length?Math.round(accs.reduce((a,b)=>a+b,0)/accs.length):0;
      const airs=tests.filter(t=>t.airRank);
      const gap=Math.round((avg-ts.cutoffs.gs)*10)/10;
      stats.push({l:'Avg Score',v:avg+' /200'},{l:'Best Score',v:best+' /200'},{l:'Avg Accuracy',v:avgAcc+'%'},{l:'vs Cutoff',v:(gap>=0?'+':'')+gap,c:gap>=0?'var(--green)':'var(--red)'},{l:'Best AIR',v:airs.length?Math.min(...airs.map(t=>t.airRank)):'—'});
    }else if(phase==='prelims'&&paper==='CSAT'){
      const scores=tests.map(t=>tsCSATScore(t));
      const avg=Math.round(scores.reduce((a,b)=>a+b,0)/scores.length*10)/10;
      const passes=tests.filter(t=>tsCSATScore(t)>=ts.cutoffs.csat).length;
      const airs=tests.filter(t=>t.airRank);
      stats.push({l:'Avg Score',v:avg+' /200'},{l:'Pass Rate',v:Math.round(passes/tests.length*100)+'%'},{l:'Passed',v:passes+' / '+tests.length},{l:'Best',v:Math.max(...scores)+' /200'},{l:'Best AIR',v:airs.length?Math.min(...airs.map(t=>t.airRank)):'—'});
    }else if(phase==='mains'&&paper==='Essay'){
      const selfs=tests.map(t=>(+(t.e1self||0))+(+(t.e2self||0)));
      const evals=tests.filter(t=>t.e1eval||t.e2eval).map(t=>(+(t.e1eval||0))+(+(t.e2eval||0)));
      const avg=Math.round(selfs.reduce((a,b)=>a+b,0)/selfs.length);
      const avgE=evals.length?Math.round(evals.reduce((a,b)=>a+b,0)/evals.length):null;
      const airs=tests.filter(t=>t.airRank);
      stats.push({l:'Avg Self',v:avg+' /250'},{l:'Best',v:Math.max(...selfs)+' /250'},{l:'Avg Eval',v:avgE!=null?avgE+' /250':'—'},{l:'Tests',v:tests.length},{l:'Best AIR',v:airs.length?Math.min(...airs.map(t=>t.airRank)):'—'});
    }else{
      const scores=tests.filter(t=>t.score).map(t=>+(t.score||0));
      const evals=tests.filter(t=>t.evalScore).map(t=>+(t.evalScore||0));
      const avg=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):0;
      const avgE=evals.length?Math.round(evals.reduce((a,b)=>a+b,0)/evals.length):0;
      const pct=avg?Math.round(avg/250*100):0;
      const airs=tests.filter(t=>t.airRank);
      stats.push({l:'Avg Score',v:avg+' /250'},{l:'Avg %',v:pct+'%'},{l:'Best',v:scores.length?Math.max(...scores)+' /250':'—'},{l:'Avg Eval',v:avgE?avgE+' /250':'—'},{l:'Best AIR',v:airs.length?Math.min(...airs.map(t=>t.airRank)):'—'});
    }
    return`<div class="hd-grid" style="margin-bottom:16px;">${stats.map(s=>`<div class="hd-stat"><span>${s.l}</span><b style="${s.c?'color:'+s.c:''}">${s.v}</b></div>`).join('')}</div>`;
  }

  function tsListHtml(phase,paper,tests){
    if(!tests.length)return'';
    const ts=S.testSeries;
    const sorted=tests.map((t,i)=>({t,i})).sort((a,b)=>(b.t.date||'').localeCompare(a.t.date||''));
    return`<div class="ts-list">${sorted.map(({t,i})=>{
      let body='',foot='';
      if(phase==='prelims'&&paper==='GS'){
        const sc=tsGSScore(t),acc=tsGSAcc(t),u=100-(+(t.correct||0))-(+(t.wrong||0));
        const col=sc>=ts.cutoffs.gs?'var(--green)':sc>=ts.cutoffs.gs-20?'var(--gold)':'var(--red)';
        body=`<div class="ts-row"><span class="ts-sc" style="color:${col}">${sc}<small>/200</small></span><span class="ts-chip">${t.correct}✓</span><span class="ts-chip">${t.wrong||0}✗</span><span class="ts-chip">${u}–</span><span class="ts-chip">Acc ${acc}%</span>${t.airRank?`<span class="ts-chip ts-air">AIR ${t.airRank}</span>`:''}</div>`;
      }else if(phase==='prelims'&&paper==='CSAT'){
        const sc=tsCSATScore(t),q=sc>=ts.cutoffs.csat,acc=tsGSAcc(t);
        body=`<div class="ts-row"><span class="ts-sc" style="color:${q?'var(--green)':'var(--red)'}">${sc}<small>/200</small></span><span class="pill ${q?'green':'red'}" style="font-size:11px;">${q?'✓ Qualified':'✗ Not qualified'}</span><span class="ts-chip">Acc ${acc}%</span>${t.airRank?`<span class="ts-chip ts-air">AIR ${t.airRank}</span>`:''}</div>`;
      }else if(phase==='mains'&&paper==='Essay'){
        const tot=(+(t.e1self||0))+(+(t.e2self||0)),etot=(+(t.e1eval||0))+(+(t.e2eval||0));
        body=`<div class="ts-row"><span class="ts-sc">${tot||'—'}<small>/250</small></span>${etot?`<span class="ts-chip">Eval ${etot}/250</span>`:''} ${t.airRank?`<span class="ts-chip ts-air">AIR ${t.airRank}</span>`:''}</div>`;
        foot=(t.e1topic||t.e2topic)?`<div class="ts-essays">${t.e1topic?`<div class="ts-ess"><b>E1</b> ${esc(t.e1topic.slice(0,55))} <span class="ts-chip">${t.e1self||'?'}/125${t.e1eval?' · Eval '+t.e1eval:''}</span></div>`:''} ${t.e2topic?`<div class="ts-ess"><b>E2</b> ${esc(t.e2topic.slice(0,55))} <span class="ts-chip">${t.e2self||'?'}/125${t.e2eval?' · Eval '+t.e2eval:''}</span></div>`:''}</div>`:'';
      }else{
        const sc=+(t.score||0),pct=sc?Math.round(sc/250*100):0;
        const col=pct>=50?'var(--green)':pct>=40?'var(--gold)':'var(--red)';
        body=`<div class="ts-row"><span class="ts-sc" style="color:${col}">${sc||'—'}<small>/250</small></span>${pct?`<span class="ts-chip">${pct}%</span>`:''} ${t.evalScore?`<span class="ts-chip">Eval ${t.evalScore}/250</span>`:''} ${t.airRank?`<span class="ts-chip ts-air">AIR ${t.airRank}</span>`:''}</div>`;
        if(t.introR||t.structR||t.contR||t.conclR){const r=(v,l)=>v?`<span class="ts-chip">${l} ${'★'.repeat(Math.min(5,v))}${'☆'.repeat(5-Math.min(5,v))}</span>`:'';foot=`<div class="ts-ratings">${r(t.introR,'Intro')}${r(t.structR,'Struct')}${r(t.contR,'Content')}${r(t.conclR,'Concl')}</div>`;}
      }
      return`<div class="ts-card"><div class="ts-card-head"><div class="ts-card-left"><span class="ts-no">Test ${t.testNo||'—'}</span>${t.code?`<span class="ts-code">[${esc(t.code)}]</span>`:''} ${t.testType?`<span class="ts-type">${esc(t.testType)}</span>`:''}</div><div class="ts-card-right"><span class="ts-date">${t.date?fmtDateShort(t.date):''}</span><button class="del ts-del-btn" data-idx="${i}">×</button></div></div>${body}${foot}${t.syllabus?`<div class="ts-syl"><span class="ts-syl-tag">Syllabus</span> ${esc(t.syllabus)}</div>`:''}${t.notes?`<div class="ts-notes">${esc(t.notes)}</div>`:''}</div>`;
    }).join('')}</div>`;
  }

  function tsAddForm(phase,paper){

    const types=phase==='prelims'?['Fundamental','Applied','Full Length']:phase==='sociology'?['Fundamental','Advanced','Full Length']:['Fundamental','Advanced Sectional','Full Length'];

          <div class="field"><label>Self marks (/125)</label><input type="number" id="tsf-e1s" min="0" max="125"></div>

          <div class="field"><label>Self marks (/125)</label><input type="number" id="tsf-e2s" min="0" max="125"></div>

      else{entry.score=gn('tsf-score');entry.evalScore=gn('tsf-eval');entry.introR=gn('tsf-intro');entry.structR=gn('tsf-struct');entry.contR=gn('tsf-cont');entry.conclR=gn('tsf-concl');}
      S.testSeries[phase][paper].tests.push(entry);persist();closeUiModal();renderTests();toast('Test logged ✓');
    };

  /* ===================== UPCOMING TESTS ===================== */
  function renderUpcoming(){
    const el=document.getElementById('v-upcoming');if(!el)return;
    if(!S.testSeries)S.testSeries=blankTestSeries();
    if(!Array.isArray(S.testSeries.upcoming))S.testSeries.upcoming=[];
    const ph=TS_PHASES.find(p=>p.k===curTestPhase)||TS_PHASES[0];
    if(!ph.papers.includes(curTestPaper))curTestPaper=ph.papers[0];
    const today=todayStr();
    const all=S.testSeries.upcoming.filter(u=>u.phase===curTestPhase&&u.paper===curTestPaper).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    const upcoming=all.filter(u=>(u.date||'')>=today),past=all.filter(u=>(u.date||'')<today);
    const next=upcoming[0];
    el.innerHTML=`
      <div class="section-head"><div><h2>Upcoming Tests</h2><p>Schedule tests ahead — Prelims · Mains · Sociology</p></div></div>
      <div class="ts-phase-row">${TS_PHASES.map(p=>`<button class="ts-phase-btn${p.k===curTestPhase?' on':''}" data-phase="${p.k}">${p.l}</button>`).join('')}</div>
      <div class="ts-paper-row">${ph.papers.map(p=>`<button class="ts-paper-btn${p===curTestPaper?' on':''}" data-paper="${p}">${TS_TAB[p]||p}</button>`).join('')}</div>
      <div class="ts-body">
        ${next?`<div class="up-next"><div class="up-next-lbl">Next test in</div><div class="up-next-days">${daysUntilLabel(next.date)}</div><div class="up-next-meta">${next.testNo?'Test '+next.testNo+' · ':''}${esc(TS_LABELS[next.paper]||next.paper)} · ${fmtDate(next.date)}</div></div>`:''}
        <div class="ts-act-row"><button class="btn sm" id="up-add-btn">+ Schedule Test</button><span class="ts-cnt">${upcoming.length} upcoming${past.length?' · '+past.length+' passed':''}</span></div>
        ${upcoming.length?`<div class="ts-list">${upcoming.map(u=>upCardHtml(u,false)).join('')}</div>`:`<div class="ts-empty">No tests scheduled for ${TS_LABELS[curTestPaper]||curTestPaper}. Tap <b>+ Schedule Test</b> to add one — or log the dates from your brochure.</div>`}
        ${past.length?`<div class="set-h" style="margin-top:20px;">Passed dates</div><div class="ts-list">${past.map(u=>upCardHtml(u,true)).join('')}</div>`:''}
      </div>`;
    el.querySelectorAll('.ts-phase-btn').forEach(b=>b.onclick=()=>{curTestPhase=b.dataset.phase;curTestPaper=TS_PHASES.find(p=>p.k===curTestPhase).papers[0];renderUpcoming();});
    el.querySelectorAll('.ts-paper-btn').forEach(b=>b.onclick=()=>{curTestPaper=b.dataset.paper;renderUpcoming();});
    const ab=document.getElementById('up-add-btn');if(ab)ab.onclick=()=>upcomingAddForm(curTestPhase,curTestPaper);
    el.querySelectorAll('.up-log-btn').forEach(b=>b.onclick=()=>{const u=S.testSeries.upcoming.find(x=>x.id===b.dataset.id);if(u){curTestPhase=u.phase;curTestPaper=u.paper;goToTests(u.phase,u.paper);setTimeout(()=>tsAddForm(u.phase,u.paper),60);}});
    el.querySelectorAll('.up-del-btn').forEach(b=>b.onclick=()=>{S.testSeries.upcoming=S.testSeries.upcoming.filter(x=>x.id!==b.dataset.id);persist();renderUpcoming();});

  function daysUntilLabel(date){if(!date)return'—';const d=Math.round((new Date(date+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/86400000);if(d<0)return Math.abs(d)+(Math.abs(d)===1?' day ago':' days ago');return d===0?'Today':d===1?'1 day':d+' days';}

  function upCardHtml(u,isPast){

  function normUrl(u){ u=(u||'').trim(); if(!u) return ''; if(!/^https?:\/\//i.test(u)) u='https://'+u; return u; }

        <div class="add-bar">

          <div class="field" style="min-width:150px;"><label>Type <button type="button" id="res-managetypes" class="linkbtn">manage</button></label><select id="res-type">${typeSet.map(t=>`<option>${esc(t)}</option>`).join('')}<option value="__new__">＋ New tag…</option></select></div>
          <button class="btn" id="res-add">Add link</button>

            <div class="meta" style="min-width:0;">
              <a class="t-title res-open" href="${esc(normUrl(it.url))}" target="_blank" rel="noopener noreferrer" style="color:var(--ink);text-decoration:none;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(it.label||it.url)} ↗</a>
              <div class="t-sub"><span style="color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;display:block;">${esc(it.url)}</span></div>
            </div>
            <button class="del res-del">×</button>

      </div>`;

    const typeSel=document.getElementById('res-type');
    typeSel.onchange=()=>{ if(typeSel.value==='__new__'){ typeSel.value=typeSet[0]||''; uiPrompt({ title:'New tag', label:'Tag name', placeholder:'e.g. Optional, Mains, Map, Editorial', okText:'Add tag', onOk:(t)=>{ const nm=(t||'').trim(); if(nm){ if(S.resTypes.indexOf(nm)<0) S.resTypes.push(nm); persist(); resFilter='All'; renderResource(); const sel=document.getElementById('res-type'); if(sel) sel.value=nm; } } }); } };
    document.getElementById('res-managetypes').onclick=()=>{ uiPrompt({ title:'Edit tags', lead:'One tag per line. These appear in the Type dropdown.', multiline:true, value:S.resTypes.join('\n'), okText:'Save tags', onOk:(v)=>{ const list=v.split('\n').map(s=>s.trim()).filter(Boolean); S.resTypes=list.length?list:DEFAULT_RES_TYPES.slice(); persist(); renderResource(); toast('Tags updated'); } }); };

      const lab=document.getElementById('res-label').value.trim();
      const url=normUrl(document.getElementById('res-url').value);

      if(type==='__new__'||!type) type=(typeSet[0]||'Notes');
      if(!url){ document.getElementById('res-url').focus(); toast('Paste a link first'); return; }
      tab.items.unshift({id:uid(),label:lab||url,url,type});

    el.querySelectorAll('.target-row').forEach(row=>{ const id=row.dataset.id; row.querySelector('.res-del').onclick=(e)=>{ e.preventDefault(); e.stopPropagation(); tab.items=tab.items.filter(x=>x.id!==id); persist(); renderResource(); }; });

  /* ===================== CUSTOM TABS ===================== */
  function openUiModal(html){ const b=document.getElementById('ui-modal-body'); b.innerHTML=html; document.getElementById('ui-modal').classList.add('show'); }
  function closeUiModal(){ document.getElementById('ui-modal').classList.remove('show'); }

  /* In-page replacements for window.prompt / window.confirm (those are blocked in sandboxed frames) */
  function uiPrompt(opts){
    opts=opts||{}; const v=opts.value==null?'':String(opts.value);
    const inputHtml=opts.multiline
      ? `<textarea id="uip-input" style="min-height:140px;" placeholder="${esc(opts.placeholder||'')}">${esc(v)}</textarea>`
      : `<input type="text" id="uip-input" value="${esc(v)}" placeholder="${esc(opts.placeholder||'')}">`;
    openUiModal(`<button class="icon-btn modal-close" id="uip-x">✕</button>
      <h3>${esc(opts.title||'')}</h3>${opts.lead?`<p class="lead">${esc(opts.lead)}</p>`:''}
      <div class="field" style="margin:6px 0 18px;">${opts.label?`<label>${esc(opts.label)}</label>`:''}${inputHtml}</div>
      <div class="row-flex" style="justify-content:flex-end;gap:8px;"><button class="btn ghost" id="uip-cancel">Cancel</button><button class="btn" id="uip-ok">${esc(opts.okText||'Save')}</button></div>`);
    const inp=document.getElementById('uip-input');
    setTimeout(()=>{ try{ inp.focus(); }catch(e){} },40);
    const submit=()=>{ const val=inp.value; closeUiModal(); if(opts.onOk) opts.onOk(val); };
    document.getElementById('uip-ok').onclick=submit;
    document.getElementById('uip-x').onclick=closeUiModal;
    document.getElementById('uip-cancel').onclick=closeUiModal;
    if(!opts.multiline) inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } };
  }
  function uiConfirm(opts){
    opts=opts||{};
    openUiModal(`<button class="icon-btn modal-close" id="uic-x">✕</button>
      <h3>${esc(opts.title||'Are you sure?')}</h3><p class="lead">${esc(opts.message||'')}</p>
      <div class="row-flex" style="justify-content:flex-end;gap:8px;"><button class="btn ghost" id="uic-cancel">Cancel</button><button class="btn" id="uic-ok"${opts.danger?' style="background:var(--red);box-shadow:none;"':''}>${esc(opts.okText||'Confirm')}</button></div>`);
    document.getElementById('uic-ok').onclick=()=>{ closeUiModal(); if(opts.onOk) opts.onOk(); };
    document.getElementById('uic-x').onclick=closeUiModal;
    document.getElementById('uic-cancel').onclick=closeUiModal;
  }
