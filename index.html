<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Track your day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --paper:#efe7d8; --card:#faf6ec; --card-2:#f3ecdd;
    --ink:#23201a; --ink-soft:#6f675a; --ink-faint:#a59c8b;
    --accent:#b4521f; --accent-deep:#8a3d15; --gold:#a9831f;
    --green:#3f7d3a; --green-soft:#e3efdc; --red:#a8331f; --red-soft:#f3ddd6;
    --line:rgba(35,32,26,.14); --line-soft:rgba(35,32,26,.08);
    --surface-hi:#ffffff; --gold-soft:#f6edcf; --star-bg:#fff7e6;
    --shadow:0 1px 2px rgba(35,32,26,.06), 0 8px 24px -12px rgba(35,32,26,.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Hanken Grotesk',sans-serif; color:var(--ink); line-height:1.45;
    background:var(--paper);
    min-height:100vh; padding-bottom:64px; -webkit-font-smoothing:antialiased; transition:background .25s,color .25s;
  }
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}

  .topbar{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line);}
  .topbar-inner{max-width:1080px;margin:0 auto;padding:16px 20px 0;}
  .brand{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .brand h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(22px,3.4vw,30px);letter-spacing:-.01em;margin:0;line-height:1;}
  .brand h1 .dot{color:var(--accent);}
  .brand .sub{font-size:12.5px;color:var(--ink-soft);letter-spacing:.14em;text-transform:uppercase;margin-top:6px;}
  .brand .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
  .icon-btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px;transition:.18s;}
  .icon-btn:hover{color:var(--ink);border-color:var(--ink-soft);transform:translateY(-1px);}

  .cloud-chip{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);}
  .cloud-chip .dotled{width:8px;height:8px;border-radius:50%;background:var(--ink-faint);flex:0 0 auto;}
  .cloud-chip.synced{color:var(--green);border-color:transparent;background:var(--green-soft);}
  .cloud-chip.synced .dotled{background:var(--green);}
  .cloud-chip.saving .dotled{background:var(--gold);animation:pulse 1s infinite;}
  .cloud-chip.saving{color:var(--gold);}
  .cloud-chip.error{color:var(--red);background:var(--red-soft);border-color:transparent;}
  .cloud-chip.error .dotled{background:var(--red);}
  @keyframes pulse{50%{opacity:.25;}}

  .tabs{max-width:1080px;margin:0 auto;padding:14px 12px 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{border:none;background:transparent;white-space:nowrap;padding:10px 16px 14px;font-size:14.5px;font-weight:600;color:var(--ink-soft);border-bottom:2.5px solid transparent;transition:.16s;border-radius:6px 6px 0 0;}
  .tab:hover{color:var(--ink);background:rgba(35,32,26,.035);}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);}

  .wrap{max-width:1080px;margin:0 auto;padding:26px 20px 0;}
  .view{display:none;animation:rise .35s cubic-bezier(.2,.7,.3,1);}
  .view.active{display:block;}
  @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
  .section-head h2{font-family:'Fraunces',serif;font-weight:600;font-size:24px;margin:0;letter-spacing:-.01em;}
  .section-head p{margin:4px 0 0;color:var(--ink-soft);font-size:13.5px;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);}
  .grid{display:grid;gap:16px;}
  @media(min-width:760px){.g-2{grid-template-columns:1fr 1fr;}.g-3{grid-template-columns:repeat(3,1fr);}.g-4{grid-template-columns:repeat(4,1fr);}}

  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
  .stat .label{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;}
  .stat .value{font-family:'Fraunces',serif;font-size:34px;font-weight:600;line-height:1.1;margin-top:6px;}
  .stat .value small{font-size:15px;color:var(--ink-soft);font-family:'Hanken Grotesk';font-weight:600;}
  .stat .foot{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .stat.accent{background:linear-gradient(160deg,var(--accent),var(--accent-deep));color:#fff;border-color:transparent;}
  .stat.accent .label{color:rgba(251,238,222,.8);}
  .stat.accent .foot{color:rgba(251,238,222,.78);}

  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:12px;font-weight:600;color:var(--ink-soft);letter-spacing:.02em;}
  input[type=text],input[type=date],input[type=number],textarea,select{width:100%;border:1px solid var(--line);background:var(--card-2);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink);transition:.15s;}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);background:var(--surface-hi);box-shadow:0 0 0 3px rgba(180,82,31,.12);}
  textarea{resize:vertical;min-height:46px;}

  .btn{border:none;background:var(--accent);color:#fff;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;transition:.16s;box-shadow:0 6px 16px -8px rgba(180,82,31,.7);}
  .btn:hover{background:var(--accent-deep);transform:translateY(-1px);}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none;}
  .btn.ghost:hover{border-color:var(--ink-soft);}
  .btn.sm{padding:7px 12px;font-size:13px;}
  .btn.block{width:100%;justify-content:center;}
  .del{background:none;border:none;color:var(--ink-faint);font-size:18px;line-height:1;padding:4px 6px;border-radius:8px;transition:.15s;}
  .del:hover{color:var(--red);background:var(--red-soft);}

  .date-nav{display:flex;align-items:center;gap:10px;}
  .date-nav .arrow{border:1px solid var(--line);background:var(--card);border-radius:10px;width:38px;height:38px;font-size:18px;color:var(--ink-soft);display:grid;place-items:center;}
  .date-nav .arrow:hover{color:var(--ink);border-color:var(--ink-soft);}

  .task-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line-soft);}
  .task-row:last-child{border-bottom:none;}
  .chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:0 0 auto;display:grid;place-items:center;transition:.16s;background:var(--card-2);}
  .chk.on{background:var(--green);border-color:var(--green);}
  .chk.on::after{content:"✓";color:#fff;font-size:14px;font-weight:700;}
  .task-row .name{flex:1;font-size:15px;font-weight:500;}
  .task-row.done .name{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--ink-faint);}

  .hour-row{display:flex;gap:10px;align-items:center;margin-bottom:10px;}
  .hour-row select{flex:1;}
  .hour-row input{width:96px;}

  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--card-2);border:1px solid var(--line);color:var(--ink-soft);}
  .pill.green{background:var(--green-soft);color:var(--green);border-color:transparent;}
  .pill.red{background:var(--red-soft);color:var(--red);border-color:transparent;}
  .pill.gold{background:var(--gold-soft);color:var(--gold);border-color:transparent;}

  .target-row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line-soft);}
  .target-row:last-child{border-bottom:none;}
  .target-row .meta{flex:1;}
  .target-row .meta .t-title{font-weight:600;font-size:15px;}
  .target-row.done .t-title{text-decoration:line-through;color:var(--ink-soft);}
  .target-row .meta .t-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

  .progress{height:9px;border-radius:999px;background:var(--card-2);overflow:hidden;border:1px solid var(--line-soft);}
  .progress > span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:999px;transition:width .5s cubic-bezier(.2,.7,.3,1);}

  .bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:8px;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;}
  .bar{width:100%;max-width:34px;background:linear-gradient(180deg,var(--accent),var(--gold));border-radius:6px 6px 3px 3px;min-height:3px;transition:height .5s cubic-bezier(.2,.7,.3,1);position:relative;}
  .bar .v{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--ink-soft);}
  .bar-col .d{font-size:11px;color:var(--ink-soft);font-weight:600;}
  .bar-col.today .d{color:var(--accent);}

  .series-card{margin-bottom:16px;}
  .series-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
  .series-head .name{font-family:'Fraunces',serif;font-size:19px;font-weight:600;}
  table{width:100%;border-collapse:collapse;margin-top:10px;}
  th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600;}
  td{padding:10px;border-bottom:1px solid var(--line-soft);font-size:13.5px;vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .score-tag{font-weight:700;font-family:'Fraunces',serif;}
  .empty{text-align:center;color:var(--ink-faint);font-size:14px;padding:26px 10px;font-style:italic;}
  .add-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:4px;}
  .add-bar .field{flex:1;min-width:140px;}
  .row-flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .mini-note{font-size:12px;color:var(--ink-soft);background:var(--card-2);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;}

  .modal-bg{position:fixed;inset:0;background:rgba(35,32,26,.45);backdrop-filter:blur(3px);display:none;place-items:center;z-index:80;padding:18px;}
  .modal-bg.show{display:grid;}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:26px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);}
  .modal h3{font-family:'Fraunces',serif;font-size:22px;margin:0 0 4px;}
  .modal .lead{color:var(--ink-soft);font-size:13.5px;margin:0 0 18px;}
  .steps{counter-reset:s;list-style:none;padding:0;margin:0 0 18px;}
  .steps li{counter-increment:s;position:relative;padding:0 0 14px 38px;font-size:13.5px;color:var(--ink);}
  .steps li::before{content:counter(s);position:absolute;left:0;top:-2px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;}
  .steps li b{font-weight:700;}
  .steps code{background:var(--card-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12.5px;word-break:break-all;}
  .uri-box{display:flex;gap:8px;align-items:center;background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 12px;font-size:12.5px;word-break:break-all;margin-top:6px;}
  .uri-box code{flex:1;background:none;border:none;padding:0;}
  .modal-close{position:relative;float:right;margin:-8px -8px 0 0;}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#f3ecdd;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);opacity:0;transition:.28s;z-index:90;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---- custom-tab additions ---- */
  .linkbtn{background:none;border:none;color:var(--accent);font-size:11px;font-weight:700;padding:0 0 0 4px;text-decoration:underline;letter-spacing:0;text-transform:none;}
  .picker-grid{display:grid;gap:12px;grid-template-columns:1fr;margin-top:6px;}
  @media(min-width:520px){.picker-grid{grid-template-columns:1fr 1fr;}}
  .pick{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--card-2);border-radius:14px;padding:13px 14px;transition:.16s;width:100%;}
  .pick:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow);background:var(--surface-hi);}
  .pick .ic{font-size:22px;line-height:1.1;flex:0 0 auto;width:30px;text-align:center;}
  .pick .nm{font-weight:700;font-size:14.5px;}
  .pick .ds{font-size:12px;color:var(--ink-soft);margin-top:2px;}

  .ctab-head .row-flex{flex-wrap:wrap;}
  .big-progress{height:11px;}
  .mono-time{font-family:'Fraunces',serif;font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:.01em;}

  .timer-display{text-align:center;padding:14px 0 6px;}
  .timer-display .clock{font-size:clamp(54px,13vw,84px);line-height:1;}
  .timer-display .mode{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;margin-bottom:6px;}
  .timer-ctrls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px;}
  .ring-wrap{display:grid;place-items:center;position:relative;}
  .ring-wrap .ring-label{position:absolute;text-align:center;max-width:78%;display:flex;flex-direction:column;align-items:center;}
  .ring-wrap .ring-label .clock{font-size:30px;line-height:1.05;}
  .ring-wrap .ring-label .mode{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;margin-bottom:3px;}

  .counter-card{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line-soft);}
  .counter-card:last-child{border-bottom:none;}
  .counter-card .cval{font-family:'Fraunces',serif;font-size:30px;font-weight:600;min-width:52px;text-align:center;}
  .stepper{display:flex;align-items:center;gap:8px;}
  .stepper button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card-2);font-size:20px;color:var(--ink);display:grid;place-items:center;transition:.14s;}
  .stepper button:hover{border-color:var(--accent);color:var(--accent);}

  .xgrid-wrap{overflow-x:auto;}
  table.xgrid{width:100%;border-collapse:collapse;min-width:420px;}
  table.xgrid th,table.xgrid td{padding:9px 10px;border-bottom:1px solid var(--line-soft);font-size:13.5px;}
  table.xgrid th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);text-align:center;}
  table.xgrid th:first-child,table.xgrid td:first-child{text-align:left;font-weight:600;}
  table.xgrid td{text-align:center;}
  .xcell{width:24px;height:24px;border-radius:6px;border:2px solid var(--line);display:inline-grid;place-items:center;background:var(--card-2);transition:.14s;cursor:pointer;}
  .xcell.on{background:var(--green);border-color:var(--green);}
  .xcell.on::after{content:"✓";color:#fff;font-size:13px;font-weight:700;}

  .note-card{background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;}
  .note-card input.note-title{font-weight:700;border:none;background:none;padding:4px 0;font-size:15px;}
  .note-card input.note-title:focus{box-shadow:none;border-bottom:1px solid var(--accent);}
  .note-card textarea{background:var(--surface-hi);}

  /* ---- side menu / hamburger ---- */
  .topbar-inner{padding:12px 16px;}
  .brand{align-items:center;}
  .brand-left{display:flex;align-items:center;gap:12px;min-width:0;}
  .menu-btn{border:1px solid var(--line);background:var(--card);border-radius:11px;width:42px;height:42px;font-size:20px;color:var(--ink);display:grid;place-items:center;flex:0 0 auto;transition:.16s;}
  .menu-btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px);}
  .brand-home{background:none;border:none;padding:0;text-align:left;cursor:pointer;min-width:0;}
  .brand-home:hover h1{color:var(--accent-deep);}

  .drawer-bg{position:fixed;inset:0;background:rgba(35,32,26,.42);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;}
  .drawer-bg.show{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;left:0;height:100%;width:296px;max-width:84vw;background:var(--card);border-right:1px solid var(--line);box-shadow:0 0 60px -10px rgba(35,32,26,.4);transform:translateX(-104%);transition:transform .28s cubic-bezier(.2,.7,.3,1);z-index:70;display:flex;flex-direction:column;}
  .drawer.open{transform:translateX(0);}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 12px;border-bottom:1px solid var(--line-soft);}
  .drawer-title{font-family:'Fraunces',serif;font-size:20px;font-weight:600;}
  .drawer-hint{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .drawer-nav{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;}
  .m-row{display:flex;align-items:center;gap:6px;border-radius:12px;transition:.14s;}
  .m-row:hover{background:rgba(35,32,26,.04);}
  .m-row.active{background:var(--gold-soft);}
  .m-row.active .m-label{color:var(--accent);font-weight:700;}
  .m-item{flex:1;display:flex;align-items:center;gap:12px;background:none;border:none;padding:12px 12px;text-align:left;color:var(--ink);min-width:0;}
  .m-ic{width:24px;text-align:center;font-size:17px;flex:0 0 auto;color:var(--ink-soft);}
  .m-row.active .m-ic{color:var(--accent);}
  .m-label{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .m-del{flex:0 0 auto;border:none;background:none;color:var(--ink-faint);font-size:20px;line-height:1;width:34px;height:34px;border-radius:9px;margin-right:6px;transition:.14s;}
  .m-del:hover{color:var(--red);background:var(--red-soft);}
  .drawer-foot{padding:14px 8px 6px;margin-top:6px;border-top:1px solid var(--line-soft);}
  .m-hidden{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);}
  .m-hid-h{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin:0 4px 8px;}
  .m-restore{display:block;width:100%;text-align:left;background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;transition:.14s;}
  .m-restore:hover{border-color:var(--green);color:var(--green);}

  /* ---- dashboard ---- */
  .greet{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .greet-hi{font-family:'Fraunces',serif;font-size:22px;font-weight:600;}
  .greet-date{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .cust-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip-toggle{border:1px solid var(--line);background:var(--card-2);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink-soft);transition:.14s;}
  .chip-toggle:hover{border-color:var(--ink-soft);}
  .chip-toggle.on{background:var(--green-soft);color:var(--green);border-color:transparent;}
  .countdown{background:linear-gradient(155deg,var(--accent),var(--accent-deep));color:#fff;border-color:transparent;}
  .countdown.empty-cd{background:var(--card);color:var(--ink);border:1px solid var(--line);}
  .cd-label{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;opacity:.85;}
  .cd-edit{background:rgba(255,255,255,.16);border:none;color:inherit;font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;}
  .empty-cd .cd-edit{background:var(--card-2);color:var(--ink-soft);}

  .empty-cd .cd-editor input{background:var(--card-2);color:var(--ink);border:1px solid var(--line);}
  .cd-list{margin-top:12px;display:flex;flex-direction:column;gap:6px;}
  .cd-list-row{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:600;background:rgba(255,255,255,.12);border-radius:9px;padding:7px 10px;}
  .empty-cd .cd-list-row{background:var(--card-2);}
  .countdown .cd-list-row .del{color:rgba(251,238,222,.7);}

  .qa-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}

  .dl-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line-soft);cursor:pointer;border-radius:8px;transition:.14s;}

  .dl-row:hover{background:rgba(35,32,26,.035);}
  .dl-meta{min-width:0;}
  .dl-title{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dl-src{font-size:11.5px;color:var(--ink-faint);margin-top:2px;text-transform:uppercase;letter-spacing:.06em;}

  /* arrange mode */
  .arrange-banner{position:sticky;top:8px;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent);color:#fff;border-radius:12px;padding:10px 14px;margin-bottom:16px;box-shadow:var(--shadow);}
  .arrange-banner .ab-txt{font-size:12.5px;font-weight:700;}
  .arrange-banner .btn{background:var(--surface-hi);color:var(--accent);box-shadow:none;}
  .arranging-grid{position:relative;}
  .dw.arranging{position:relative;touch-action:none;-webkit-user-select:none;user-select:none;transition:transform .04s;}
  .dw.arranging .dw-body{pointer-events:none;}
  .dw-shield{position:absolute;inset:0;z-index:2;border:2px dashed var(--accent);border-radius:16px;background:rgba(180,82,31,.05);cursor:grab;}
  .dw.arranging.dragging{z-index:50;}
  .dw.arranging.dragging .dw-shield{cursor:grabbing;background:rgba(180,82,31,.1);}
  .dw.arranging.drop-target .dw-shield{border-style:solid;background:rgba(180,82,31,.16);}
  .dw-bar{position:absolute;top:7px;left:7px;right:7px;z-index:3;display:flex;align-items:center;gap:7px;pointer-events:none;}
  .dw-grip{font-size:15px;color:var(--accent);background:var(--surface-hi);border-radius:8px;padding:1px 6px;box-shadow:var(--shadow);}
  .dw-name{font-size:10.5px;font-weight:800;color:var(--accent);background:var(--surface-hi);border-radius:8px;padding:3px 8px;box-shadow:var(--shadow);text-transform:uppercase;letter-spacing:.05em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dw-size{margin-left:auto;pointer-events:auto;background:var(--surface-hi);color:var(--accent);border:none;border-radius:8px;min-width:34px;height:30px;font-size:15px;font-weight:700;box-shadow:var(--shadow);}

  .star-card{position:relative;border:1px solid var(--accent);background:linear-gradient(180deg,var(--star-bg),var(--card));box-shadow:0 4px 16px -8px rgba(180,82,31,.35);}
  .star-label{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:800;color:var(--accent);}
  .star{color:var(--accent);}
  .focus-input{font-family:'Fraunces',serif;font-size:18px;font-weight:600;border:none;background:transparent;padding:10px 0 4px;margin-top:4px;}
  .focus-input:focus{box-shadow:none;border-bottom:2px solid var(--accent);}
  .focus-input::placeholder{font-weight:500;color:var(--ink-faint);}
  .mit-row{display:flex;align-items:center;gap:12px;padding:7px 0;}
  .mit-input{border:none;background:transparent;font-size:15px;font-weight:500;padding:6px 0;border-bottom:1px solid var(--line-soft);}
  .mit-input:focus{box-shadow:none;border-bottom:1px solid var(--accent);}
  .mit-row.done .mit-input{text-decoration:line-through;color:var(--ink-faint);}

  .heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .heat-cell{aspect-ratio:1;border-radius:5px;background:var(--card-2);border:1px solid var(--line-soft);}
  .heat-cell.lvl1{background:#dcefd9;border-color:transparent;}
  .heat-cell.lvl2{background:#a8e0a0;border-color:transparent;}
  .heat-cell.lvl3{background:#5fb85a;border-color:transparent;}
  .heat-cell.lvl4{background:#2f8f3a;border-color:transparent;}

  .sticky-wrap{display:grid;grid-template-columns:repeat(auto-fill,168px);gap:16px;justify-content:flex-start;}
  .sticky{width:168px;aspect-ratio:1/1;border-radius:4px;padding:13px;box-shadow:2px 4px 10px -4px rgba(35,32,26,.45);display:flex;flex-direction:column;transform:rotate(-.7deg);}
  .sticky:nth-child(even){transform:rotate(.7deg);}
  .sticky.s-yellow{background:#fdf0b0;} .sticky.s-green{background:#cdeecb;} .sticky.s-pink{background:#fbd3de;} .sticky.s-blue{background:#cfe4fb;}
  .sticky-text{flex:1;background:transparent;border:none;resize:none;font-size:14px;line-height:1.45;color:#42382a;font-family:inherit;}
  .sticky-text:focus{box-shadow:none;}
  .sticky-foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px;}
  .sticky-colors{display:flex;gap:5px;}
  .sc{width:16px;height:16px;border-radius:50%;cursor:pointer;border:2px solid rgba(0,0,0,.12);}
  .sc.on{border-color:rgba(0,0,0,.5);}
  .sc-yellow{background:#f5d63d;} .sc-green{background:#7ccf73;} .sc-pink{background:#f490ab;} .sc-blue{background:#7fb6f2;}
  .sticky .del{color:rgba(66,56,42,.5);} .sticky .del:hover{color:#42382a;background:rgba(0,0,0,.08);}

  .cust-list{display:flex;flex-direction:column;gap:8px;}
  .cust-row{display:flex;align-items:center;gap:10px;background:var(--card-2);border:1px solid var(--line);border-radius:11px;padding:8px 10px;}
  .cust-ord{display:flex;flex-direction:column;gap:3px;}
  .cust-ord button{width:30px;height:22px;border:1px solid var(--line);background:var(--card);border-radius:7px;font-size:13px;line-height:1;color:var(--ink-soft);display:grid;place-items:center;}
  .cust-ord button:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
  .cust-ord button:disabled{opacity:.32;}
  .cust-name{flex:1;font-weight:600;font-size:14.5px;min-width:0;}
  .cust-rm{border:none;background:none;color:var(--ink-faint);font-size:18px;width:34px;height:34px;border-radius:9px;}
  .cust-rm:hover{color:var(--red);background:var(--red-soft);}
  .cust-avail{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);}
  .chip-toggle.star-chip{border-color:var(--accent);color:var(--accent);background:var(--star-bg);}
  /* ---- master settings ---- */
  .set-sec{padding:16px 0;border-top:1px solid var(--line-soft);}
  .set-sec:first-of-type{border-top:none;padding-top:6px;}
  .set-h{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--ink-soft);margin-bottom:10px;}
  .set-lab{font-size:12px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:8px;}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .seg-btn{background:var(--card-2);border:none;padding:9px 18px;font-size:13px;font-weight:700;color:var(--ink-soft);}
  .seg-btn.on{background:var(--accent);color:#fff;}
  .theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:8px;}
  .theme-swatch{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--card-2);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;color:var(--ink);}
  .theme-swatch.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;}
  .tsw-dot{width:18px;height:18px;border-radius:50%;flex:0 0 auto;border:1px solid rgba(0,0,0,.12);}
  .set-btns{display:flex;gap:8px;flex-wrap:wrap;}

  /* ---- dark mode: full palette is applied inline by applyTheme(); only paper-stickies need fixed dark text ---- */
  html.dark input:focus,html.dark textarea:focus,html.dark select:focus{box-shadow:0 0 0 3px rgba(255,255,255,.07);}
  html.dark .sticky-text{color:#2c2618;}
  html.dark .sticky-text::placeholder{color:rgba(44,38,24,.5);}

  /* ---- motivation quote widget ---- */
  .quote-text{font-family:'Fraunces',serif;font-style:italic;font-size:19px;line-height:1.5;margin:14px 0 10px;color:var(--ink);}
  .quote-meta{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:8px;}
  .qw-btn{border:1px solid var(--line);background:var(--card-2);border-radius:9px;width:34px;height:32px;font-size:15px;color:var(--ink-soft);transition:.14s;}
  .qw-btn:hover{border-color:var(--accent);color:var(--accent);}

  /* ---- photo notes widget ---- */
  .pn-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  .pn-card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card-2);display:flex;flex-direction:column;}
  .pn-img{width:100%;height:130px;object-fit:cover;display:block;background:var(--line-soft);}
  .pn-cap{border:none;background:transparent;resize:none;font-size:13px;line-height:1.4;padding:8px 10px;min-height:40px;color:var(--ink);font-family:inherit;}
  .pn-cap:focus{box-shadow:none;}
  .pn-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 10px 8px;border-top:1px solid var(--line-soft);}
  .pn-date{font-size:11px;color:var(--ink-faint);}
  .pn-foot .linkbtn{font-size:11.5px;padding:0;}
  .pn-foot .del{position:static;width:26px;height:26px;font-size:16px;}
</style>
</head>
<body>
<div id="app-root"></div>

<script>
(function(){
  "use strict";

  /* ===================== CONFIG ===================== */
  const STATE_KEY="upsc-tracker-state";
  const CLIENT_KEY="upsc-gdrive-clientid";
  const CONNECTED_KEY="upsc-gdrive-connected";
  const SCOPE="https://www.googleapis.com/auth/drive.appdata";
  const FILE_NAME="upsc-tracker.json";
  const ORIGIN=window.location.origin;

  const DEFAULT_TASKS=["Read Newspaper","Current Affairs Notes","Monthly Magazine","Editorial Analysis","Answer Writing","Revision","PYQ Practice","Optional Subject"];
  const SUBJECTS=["Polity","History","Geography","Economy","Environment","Sci & Tech","Current Affairs","CSAT","Optional","Essay","Ethics (GS4)","Other"];
  const DEFAULT_RES_TYPES=["Notes","Handout","PYQ","Magazine"];

  /* Built-in tabs that live in the side menu (Dashboard is the home view, never listed/deletable) */
  const BUILTINS=[
    {id:'daily',    label:'Daily Tracker',   icon:'✎'},
    {id:'weekly',   label:'Weekly Targets',  icon:'◷'},
    {id:'monthly',  label:'Monthly Targets', icon:'◑'},
    {id:'tests',    label:'Test Series',     icon:'✓'},
    {id:'syllabus', label:'Syllabus',        icon:'▤'}
  ];
  const BUILTIN_IDS=BUILTINS.map(b=>b.id);

  /* Toggleable dashboard widgets. size: 'full' | 'half'. star: emphasized goal-focused widget. */
  const DASH_WIDGETS=[
    {id:'focus',     label:"Today's Focus",       size:'full', star:true},
    {id:'top3',      label:'Top 3 Priorities',    size:'full', star:true},
    {id:'hoursgoal', label:'Daily Hours Goal',    size:'half', star:true},
    {id:'stickies',  label:'Sticky Notes',        size:'full', star:true},
    {id:'quote',     label:'Motivation Quote',    size:'full', star:true},
    {id:'photonotes',label:'Photo Notes',         size:'full', star:true},
    {id:'countdown', label:'Exam countdown',      size:'full'},
    {id:'today',     label:"Today's study",       size:'half'},
    {id:'streak',    label:'Study streak',        size:'half'},
    {id:'calendar',  label:'Consistency calendar',size:'full'},
    {id:'hours7',    label:'Weekly hours chart',  size:'full'},
    {id:'syllabus',  label:'Syllabus progress',   size:'half'},
    {id:'quick',     label:'Quick actions',       size:'full'},
    {id:'deadlines', label:'Deadlines',           size:'full'},
    {id:'latest',    label:'Latest test',         size:'full'}
  ];
  const DASH_WIDGET_IDS=DASH_WIDGETS.map(w=>w.id);
  const DEFAULT_DASH_WIDGETS=['focus','top3','countdown','today','streak','quick','deadlines','latest'];

  /* Catalogue of custom tab types available from the "+ Tab" picker */
  const TAB_TYPES=[
    {type:'resource', name:'Resources / Links',   icon:'🔗', desc:'Save links to notes, PDFs, magazines — with your own tags.'},
    {type:'checklist',name:'Checklist',           icon:'✓',  desc:'A tickable to-do / crosscheck list with a progress bar.'},
    {type:'crosscheck',name:'Crosscheck Grid',    icon:'▦',  desc:'Rows × columns matrix, e.g. Read / Revised / Tested.'},
    {type:'targets',  name:'Targets & Deadlines', icon:'◎',  desc:'Goals with due dates and completion tracking.'},
    {type:'progress', name:'Progress Sliders',    icon:'▰',  desc:'Percent sliders — a progress check sheet for any list.'},
    {type:'counter',  name:'Counters / Habits',   icon:'＃', desc:'Tally counters with optional goals (questions, days…).'},
    {type:'timer',    name:'Timer & Stopwatch',   icon:'⏱', desc:'Countdown timer plus a stopwatch.'},
    {type:'pomodoro', name:'Pomodoro Focus',      icon:'🍅', desc:'Focus / break cycles with rounds and auto-advance.'},
    {type:'notes',    name:'Notes / Scratchpad',  icon:'✎',  desc:'Free-form note cards for anything.'}
  ];

  /* ===================== STATE ===================== */
  function defaultResourceTabs(){ return [{id:'default',name:'Resources',fixed:true,items:[]}]; }
  function normResourceTabs(rt){
    if(!Array.isArray(rt)) return defaultResourceTabs();
    return rt.map(t=>({ id:t.id||uid(), name:t.name||'Resources', fixed:!!t.fixed, items:Array.isArray(t.items)?t.items.map(it=>({id:it.id||uid(),label:it.label||'',url:it.url||'',type:(it.type&&String(it.type).trim())||'Notes'})):[] }));
  }
  const LIGHT_BASE={ ink:'#23201a', inkSoft:'#6f675a', inkFaint:'#a59c8b', line:'rgba(35,32,26,.14)', lineSoft:'rgba(35,32,26,.08)', gold:'#a9831f', green:'#3f7d3a', greenSoft:'#e3efdc', red:'#a8331f', redSoft:'#f3ddd6', shadow:'0 1px 2px rgba(35,32,26,.06), 0 8px 24px -12px rgba(35,32,26,.18)' };
  const DARK_BASE={ ink:'#ece5d6', inkSoft:'#a79d89', inkFaint:'#6e6557', line:'rgba(236,229,214,.16)', lineSoft:'rgba(236,229,214,.08)', gold:'#d3ad55', green:'#5cae54', greenSoft:'rgba(63,125,58,.26)', red:'#e0654f', redSoft:'rgba(168,51,31,.30)', shadow:'0 1px 2px rgba(0,0,0,.5), 0 10px 28px -14px rgba(0,0,0,.7)' };
  const THEMES={
    terracotta:{label:'Terracotta', accent:'#b4521f', deep:'#8a3d15', light:{paper:'#efe7d8',card:'#faf6ec',card2:'#f3ecdd'}, dark:{paper:'#1a1611',card:'#26211a',card2:'#2e2820'}},
    indigo:{label:'Indigo', accent:'#4f46e5', deep:'#3730a3', light:{paper:'#e9eaf3',card:'#f8f8fc',card2:'#edeef7'}, dark:{paper:'#13141c',card:'#1d1e29',card2:'#252634'}},
    forest:{label:'Forest', accent:'#2f8f4e', deep:'#1f6b39', light:{paper:'#e7eee6',card:'#f6faf4',card2:'#eaf1e8'}, dark:{paper:'#101711',card:'#1a231b',card2:'#212c23'}},
    plum:{label:'Plum', accent:'#9333ea', deep:'#6b21a8', light:{paper:'#eee8f3',card:'#faf6fc',card2:'#f0e9f4'}, dark:{paper:'#16111c',card:'#221b29',card2:'#2a2233'}},
    ocean:{label:'Ocean', accent:'#0e7490', deep:'#155e75', light:{paper:'#e4eef0',card:'#f4fafb',card2:'#e7f1f3'}, dark:{paper:'#0f1719',card:'#192325',card2:'#1f2c2f'}},
    rose:{label:'Rose', accent:'#be185d', deep:'#9d174d', light:{paper:'#f1e7eb',card:'#fcf6f8',card2:'#f4eaee'}, dark:{paper:'#1a1015',card:'#271a20',card2:'#2f2028'}},
    slate:{label:'Slate', accent:'#475569', deep:'#334155', light:{paper:'#e9ecef',card:'#f8fafb',card2:'#edf0f3'}, dark:{paper:'#121417',card:'#1c1f24',card2:'#242832'}}
  };
  const QUOTES=[
    "Small, steady hours beat rare bursts of brilliance.",
    "You don't have to be extraordinary today — just consistent.",
    "The syllabus is finite. Your effort, applied daily, is enough.",
    "Revise what you fear most. That's where the marks hide.",
    "One honest hour now beats three distracted ones later.",
    "Discipline is choosing what you want most over what you want now.",
    "Every page you read is a vote for the person you're becoming.",
    "Show up on the dull days — those are the ones that count.",
    "Progress is quiet. Trust the work even when it's invisible.",
    "Don't compare your Day 40 to someone's Day 400.",
    "Rest is part of the plan, not a break from it.",
    "Focus on the next task, not the whole mountain.",
    "Your future self is watching. Make them proud."
  ];
  function hexToRgb(h){ h=(h||'').replace('#',''); if(h.length===3)h=h.split('').map(c=>c+c).join(''); const n=parseInt(h||'0',16); return [(n>>16)&255,(n>>8)&255,n&255]; }
  function rgbToHex(r){ return '#'+r.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }
  function mix(a,b,t){ const A=hexToRgb(a),B=hexToRgb(b); return rgbToHex([A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t]); }
  function blankState(){ return { settings:{tasks:DEFAULT_TASKS.slice()}, appName:'Track your day', theme:{mode:'light',accent:'terracotta'}, days:{}, weekly:[], monthly:[], weeks:{}, months:{}, series:[], syllabus:[], syllabusInit:false, resTypes:DEFAULT_RES_TYPES.slice(), resourceTabs:defaultResourceTabs(), customTabs:[], hiddenBuiltins:[], exams:[], dashWidgets:DEFAULT_DASH_WIDGETS.slice(), hoursGoal:0, dashStickies:[], dashSizes:{}, photoNotes:[], customQuotes:[] }; }
  function normCustomTabs(ct){
    if(!Array.isArray(ct)) return [];
    return ct.map(t=>{
      const base={ id:t.id||uid(), type:t.type, name:t.name||'Tab' };
      switch(t.type){
        case 'checklist': return {...base, items:Array.isArray(t.items)?t.items.map(i=>({id:i.id||uid(),text:i.text||'',done:!!i.done})):[]};
        case 'crosscheck': {
          const cols=Array.isArray(t.cols)&&t.cols.length?t.cols.map(c=>({id:c.id||uid(),name:c.name||'Col'})):[{id:uid(),name:'Read'},{id:uid(),name:'Revised'},{id:uid(),name:'Tested'}];
          return {...base, cols, rows:Array.isArray(t.rows)?t.rows.map(r=>({id:r.id||uid(),name:r.name||'',cells:r.cells&&typeof r.cells==='object'?r.cells:{}})):[]};
        }

  function collectDeadlines(){
    const today=todayStr(); const out=[];
    Object.keys(S.weeks).forEach(k=>{ const end=addDays(k,6); S.weeks[k].tasks.forEach(x=>{ if(!x.done) out.push({title:x.text,deadline:end,src:'Weekly',srcTab:'weekly',period:k,overdue:end<today}); }); });
    Object.keys(S.months).forEach(k=>{ const end=monthEnd(k); S.months[k].tasks.forEach(x=>{ if(!x.done) out.push({title:x.text,deadline:end,src:'Monthly',srcTab:'monthly',period:k,overdue:end<today}); }); });

  function wCalendar(){ const t=todayStr(); const cells=[]; for(let i=27;i>=0;i--){const d=addDays(t,-i);cells.push({d,h:dayHours(d)});} const max=Math.max(2,...cells.map(c=>c.h));

  function wSyllabus(){ const list=S.syllabus||[]; const overall=list.length?Math.round(list.reduce((a,b)=>a+(+b.pct||0),0)/list.length):0; return `<div class="card"><div class="section-head" style="margin-bottom:12px;"><div><h2 style="font-size:18px;">Syllabus</h2></div><span class="pill ${overall>=100?'green':overall>=50?'gold':''}">${overall}%</span></div><div class="progress big-progress"><span style="width:${overall}%"></span></div><div style="font-size:12px;color:var(--ink-soft);margin-top:8px;">${list.length?'across '+list.length+' subjects':'Add subjects in the Syllabus tab.'}</div></div>`; }

  function processImage(file, cb){
    try{ const r=new FileReader();
      r.onload=()=>{ try{ const img=new Image(); img.onload=()=>{ try{ const max=1000; let w=img.width||max,h=img.height||max; if(w>h&&w>max){h=Math.round(h*max/w);w=max;} else if(h>=w&&h>max){w=Math.round(w*max/h);h=max;} const c=document.createElement('canvas'); c.width=w;c.height=h; const ctx=c.getContext&&c.getContext('2d'); if(ctx){ ctx.drawImage(img,0,0,w,h); cb(c.toDataURL('image/jpeg',0.72)); } else cb(r.result); }catch(e){ cb(r.result); } }; img.onerror=()=>cb(r.result); img.src=r.result; }catch(e){ cb(r.result); } };
      r.onerror=()=>cb(''); r.readAsDataURL(file);
    }catch(e){ cb(''); }
  }

  function sizeOfNow(id){ const o=S.dashSizes&&S.dashSizes[id]; if(o==='half'||o==='full') return o; const w=DASH_WIDGETS.find(x=>x.id===id); return w?w.size:'full'; }

  /* ---- drag-to-reorder + pinch/tap-to-resize (arrange mode) ---- */
  let arrMulti=false, arrDrag=null, arrPinch=null;
  function arrDist(t){ const dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY; return Math.hypot(dx,dy); }
  function arrNearest(grid,x,y,id){ let best=null,bd=Infinity; grid.querySelectorAll('.dw').forEach(s=>{ if(s.dataset.w===id) return; const r=s.getBoundingClientRect(); const cx=r.left+r.width/2,cy=r.top+r.height/2; const d=Math.hypot(x-cx,y-cy); if(d<bd){bd=d;best=s;} }); return best; }
  function arrPlace(id,tid,after){ const a=S.dashWidgets.filter(x=>x!==id); let i=a.indexOf(tid); if(i<0)i=a.length-1; a.splice(after?i+1:i,0,id); S.dashWidgets=a; persist(); }
  function arrangeBind(){
    const grid=document.querySelector('#v-dashboard .dash-grid'); if(!grid) return;
    grid.querySelectorAll('.dw.arranging').forEach(dw=>{
      const shield=dw.querySelector('.dw-shield'); const id=dw.dataset.w; if(!shield) return;
      const sb=dw.querySelector('.dw-size'); if(sb) sb.onclick=e=>{ e.stopPropagation(); setWidgetSize(id, sizeOfNow(id)==='full'?'half':'full'); };
      // pinch (two-finger) resize
      shield.ontouchstart=e=>{ if(e.touches.length===2){ arrMulti=true; arrPinch={id,d0:arrDist(e.touches)}; arrDrag=null; if(e.cancelable)e.preventDefault(); } };
      shield.ontouchmove=e=>{ if(arrPinch&&e.touches.length===2){ if(e.cancelable)e.preventDefault(); const r=arrDist(e.touches)/(arrPinch.d0||1); if(r>1.2){ const i=arrPinch.id; arrPinch=null; arrMulti=false; setWidgetSize(i,'full'); toast('Widget enlarged'); } else if(r<0.84){ const i=arrPinch.id; arrPinch=null; arrMulti=false; setWidgetSize(i,'half'); toast('Widget shrunk'); } } };
      shield.ontouchend=e=>{ if(e.touches.length<2){ arrPinch=null; setTimeout(()=>{arrMulti=false;},60); } };
      // drag (pointer) reorder
      shield.onpointerdown=e=>{ if(e.pointerType==='touch'&&arrMulti) return; if(typeof e.button==='number'&&e.button!==0) return; arrBeginDrag(e,dw,id); };
    });
  }
  function arrBeginDrag(e,dw,id){
    arrDrag={dw,id,sx:e.clientX,sy:e.clientY,moved:false,tgt:null};
    const mv=ev=>arrDragMove(ev); const up=ev=>{ arrDragEnd(ev); document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up); document.removeEventListener('pointercancel',up); };
    document.addEventListener('pointermove',mv,{passive:false}); document.addEventListener('pointerup',up); document.addEventListener('pointercancel',up);
  }
  function arrDragMove(e){
    if(!arrDrag) return;
    const dx=e.clientX-arrDrag.sx, dy=e.clientY-arrDrag.sy;
    if(!arrDrag.moved){ if(Math.hypot(dx,dy)<8) return; arrDrag.moved=true; arrDrag.dw.classList.add('dragging'); }
    if(e.cancelable)e.preventDefault();
    arrDrag.dw.style.transform=`translate(${dx}px,${dy}px)`;
    const grid=arrDrag.dw.parentNode; if(!grid) return;
    grid.querySelectorAll('.dw').forEach(s=>s.classList.remove('drop-target'));
    const tgt=arrNearest(grid,e.clientX,e.clientY,arrDrag.id); arrDrag.tgt=tgt; if(tgt) tgt.classList.add('drop-target');
  }
  function arrDragEnd(e){
    if(!arrDrag) return; const {dw,id,moved,tgt}=arrDrag;
    dw.style.transform=''; dw.classList.remove('dragging');
    const grid=dw.parentNode; if(grid) grid.querySelectorAll('.dw').forEach(s=>s.classList.remove('drop-target'));
    if(moved&&tgt){ const r=tgt.getBoundingClientRect(); const after=e.clientY>r.top+r.height/2; arrPlace(id,tgt.dataset.w,after); }
    arrDrag=null; renderDashboard();
  }

    else { label=new Date(key+'-01T00:00:00').toLocaleDateString(undefined,{month:'long',year:'numeric'}); isCur=key===todayStr().slice(0,7); nav=`<input type="month" class="p-month" value="${key}" style="width:auto;">`; }

  function renderSeriesCard(s){
    const valid=s.tests.filter(t=>t.total>0);
    const avg=valid.length?(valid.reduce((a,b)=>a+(b.scored/b.total),0)/valid.length*100):null;
    return `<div class="card series-card" data-series="${s.id}">
      <div class="series-head"><div class="name">${esc(s.name)}</div><div class="row-flex">${avg!=null?`<span class="pill ${avg>=50?'green':avg>=35?'gold':'red'}">Avg ${avg.toFixed(1)}%</span>`:''}<span class="pill">${s.tests.length} test${s.tests.length===1?'':'s'}</span><button class="del series-del">×</button></div></div>
      ${s.tests.length?`<table><thead><tr><th>Test / Syllabus</th><th>Date</th><th style="text-align:center;">Marks</th><th style="text-align:center;">%</th><th>Remarks</th><th></th></tr></thead><tbody>${s.tests.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(t=>{const p=t.total>0?(t.scored/t.total*100):0;const col=p>=50?'var(--green)':p>=35?'var(--gold)':'var(--red)';return `<tr><td style="font-weight:600;">${esc(t.topic)}</td><td style="color:var(--ink-soft);white-space:nowrap;">${fmtDateShort(t.date)}</td><td style="text-align:center;" class="score-tag">${t.scored}<span style="color:var(--ink-faint);">/${t.total}</span></td><td style="text-align:center;color:${col};font-weight:700;">${p.toFixed(0)}%</td><td style="color:var(--ink-soft);">${esc(t.remarks)||'—'}</td><td><button class="del test-del" data-id="${t.id}">×</button></td></tr>`;}).join('')}</tbody></table>`:'<div class="empty" style="padding:14px;">No tests logged in this series yet.</div>'}
      <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line-soft);"><div class="add-bar">
        <div class="field" style="flex:2;min-width:160px;"><label>Test / Syllabus topic</label><input type="text" id="t-topic-${s.id}" placeholder="e.g. Polity – Test 3"></div>
        <div class="field" style="min-width:90px;"><label>Scored</label><input type="number" id="t-scored-${s.id}" step="0.5" placeholder="0"></div>
        <div class="field" style="min-width:90px;"><label>Out of</label><input type="number" id="t-total-${s.id}" step="0.5" placeholder="200"></div>
        <div class="field"><label>Date</label><input type="date" id="t-date-${s.id}"></div>
        <div class="field" style="flex:2;min-width:160px;"><label>Remarks</label><input type="text" id="t-rem-${s.id}" placeholder="weak areas, time mgmt..."></div>
        <button class="btn sm test-add">+ Log test</button>
      </div></div></div>`;
  }

  /* ===================== SYLLABUS ===================== */
  function renderSyllabus(){
    const el=document.getElementById('v-syllabus'); if(!el)return;
    if(!S.syllabus.length&&!S.syllabusInit){ S.syllabusInit=true; S.syllabus=[['GS1 – History, Geography, Society'],['GS2 – Polity, Governance, IR'],['GS3 – Economy, Environment, Sci-Tech, Security'],['GS4 – Ethics'],['CSAT'],['Optional Subject'],['Essay']].map(n=>({id:uid(),name:n[0],pct:0})); persist(); }
    const list=S.syllabus; const overall=list.length?Math.round(list.reduce((a,b)=>a+(+b.pct||0),0)/list.length):0;
    el.innerHTML=`
      <div class="section-head"><div><h2>Syllabus Progress</h2><p>Track how far you've covered each part of the syllabus.</p></div><span class="pill gold">Overall ${overall}%</span></div>
      <div class="card" style="margin-bottom:16px;"><div class="add-bar"><div class="field" style="flex:2;"><label>Add a subject / paper</label><input type="text" id="syl-name" placeholder="e.g. PSIR Paper 1"></div><button class="btn" id="syl-add">Add</button></div></div>
      <div class="card">${list.map(x=>`<div style="padding:14px 4px;border-bottom:1px solid var(--line-soft);" data-syl="${x.id}"><div class="row-flex" style="justify-content:space-between;margin-bottom:8px;"><span style="font-weight:600;font-size:15px;">${esc(x.name)}</span><div class="row-flex"><span class="pill ${x.pct>=100?'green':x.pct>=50?'gold':''}">${x.pct}%</span><button class="del syl-del">×</button></div></div><input type="range" min="0" max="100" step="5" value="${x.pct}" class="syl-range" style="width:100%;accent-color:var(--accent);"></div>`).join('')}</div>`;
    document.getElementById('syl-add').onclick=()=>{ const n=document.getElementById('syl-name'); const name=n.value.trim(); if(!name){n.focus();return;} S.syllabus.push({id:uid(),name,pct:0}); persist(); renderSyllabus(); toast('Subject added'); };
    el.querySelectorAll('[data-syl]').forEach(row=>{ const id=row.dataset.syl; const item=list.find(x=>x.id===id);
      row.querySelector('.syl-range').oninput=e=>{ item.pct=+e.target.value; row.querySelector('.pill').textContent=item.pct+'%'; };
      row.querySelector('.syl-range').onchange=()=>{ persist(); renderSyllabus(); };
      row.querySelector('.syl-del').onclick=()=>{ S.syllabus=list.filter(x=>x.id!==id); persist(); renderSyllabus(); };
    });
  }

  /* ===================== RESOURCES (link tabs) ===================== */
  function typeColor(t){ if(t==='Notes')return'gold'; if(t==='Handout')return'green'; if(t==='PYQ')return'red'; if(t==='Magazine')return''; const pal=['gold','green','red','']; let h=0; const s=String(t||''); for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return pal[h%pal.length]; }
  function normUrl(u){ u=(u||'').trim(); if(!u) return ''; if(!/^https?:\/\//i.test(u)) u='https://'+u; return u; }
  function activeResTab(){ const id=activeTab.slice(4); return S.resourceTabs.find(t=>t.id===id); }

  function renderResource(){
    const el=document.getElementById('v-resource'); if(!el) return;
    if(activeTab.indexOf('res:')!==0) return;
    const tab=activeResTab();
    if(!tab){ activeTab='dashboard'; render(); return; }
    const items=tab.items;
    const typeSet=[]; S.resTypes.forEach(t=>{ if(typeSet.indexOf(t)<0) typeSet.push(t); }); items.forEach(it=>{ if(it.type&&typeSet.indexOf(it.type)<0) typeSet.push(it.type); });
    const shown=items.filter(it=>resFilter==='All'||it.type===resFilter);
    const counts={}; typeSet.forEach(t=>counts[t]=items.filter(x=>x.type===t).length);
    el.innerHTML=`
      <div class="section-head">
        <div><h2>${esc(tab.name)}</h2><p>Paste links to your notes, handouts, PYQs or magazines — tapping one opens it in a new tab.</p></div>
        <div class="row-flex">
          <button class="btn ghost sm" id="res-rename">Rename</button>
          ${tab.fixed?'':'<button class="btn ghost sm" id="res-deltab">Delete tab</button>'}
        </div>
      </div>
      <div class="card" style="margin-bottom:16px;">
        <div class="add-bar">
          <div class="field" style="flex:2;min-width:160px;"><label>Label</label><input type="text" id="res-label" placeholder="e.g. Polity Notes – Laxmikanth Ch.5"></div>
          <div class="field" style="flex:3;min-width:200px;"><label>Link (OneDrive folder / PDF / Drive)</label><input type="text" id="res-url" placeholder="paste link here"></div>
          <div class="field" style="min-width:150px;"><label>Type <button type="button" id="res-managetypes" class="linkbtn">manage</button></label><select id="res-type">${typeSet.map(t=>`<option>${esc(t)}</option>`).join('')}<option value="__new__">＋ New tag…</option></select></div>
          <button class="btn" id="res-add">Add link</button>
        </div>
      </div>
      <div class="card">
        <div class="row-flex" style="margin-bottom:14px;gap:8px;">
          ${['All',...typeSet].map(f=>`<button class="pill ${f===resFilter?(f==='All'?'gold':typeColor(f)||'gold'):''}" data-filter="${esc(f)}" style="cursor:pointer;">${esc(f)}${f!=='All'?` · ${counts[f]||0}`:` · ${items.length}`}</button>`).join('')}
        </div>
        ${shown.length? shown.map(it=>`
          <div class="target-row" data-id="${it.id}">
            <span class="pill ${typeColor(it.type)}" style="min-width:74px;justify-content:center;">${esc(it.type)}</span>
            <div class="meta" style="min-width:0;">
              <a class="t-title res-open" href="${esc(normUrl(it.url))}" target="_blank" rel="noopener noreferrer" style="color:var(--ink);text-decoration:none;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(it.label||it.url)} ↗</a>
              <div class="t-sub"><span style="color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;display:block;">${esc(it.url)}</span></div>
            </div>
            <button class="del res-del">×</button>
          </div>`).join('') : `<div class="empty">No links here yet${resFilter!=='All'?' for '+esc(resFilter):''} — add one above.</div>`}
      </div>`;

    const typeSel=document.getElementById('res-type');
    typeSel.onchange=()=>{ if(typeSel.value==='__new__'){ typeSel.value=typeSet[0]||''; uiPrompt({ title:'New tag', label:'Tag name', placeholder:'e.g. Optional, Mains, Map, Editorial', okText:'Add tag', onOk:(t)=>{ const nm=(t||'').trim(); if(nm){ if(S.resTypes.indexOf(nm)<0) S.resTypes.push(nm); persist(); resFilter='All'; renderResource(); const sel=document.getElementById('res-type'); if(sel) sel.value=nm; } } }); } };
    document.getElementById('res-managetypes').onclick=()=>{ uiPrompt({ title:'Edit tags', lead:'One tag per line. These appear in the Type dropdown.', multiline:true, value:S.resTypes.join('\n'), okText:'Save tags', onOk:(v)=>{ const list=v.split('\n').map(s=>s.trim()).filter(Boolean); S.resTypes=list.length?list:DEFAULT_RES_TYPES.slice(); persist(); renderResource(); toast('Tags updated'); } }); };
    document.getElementById('res-add').onclick=()=>{
      const lab=document.getElementById('res-label').value.trim();
      const url=normUrl(document.getElementById('res-url').value);
      let type=document.getElementById('res-type').value;
      if(type==='__new__'||!type) type=(typeSet[0]||'Notes');
      if(!url){ document.getElementById('res-url').focus(); toast('Paste a link first'); return; }
      tab.items.unshift({id:uid(),label:lab||url,url,type});
      persist(); renderResource(); toast('Link added');
    };
    document.getElementById('res-rename').onclick=()=>{ uiPrompt({ title:'Rename tab', label:'Tab name', value:tab.name, onOk:(n)=>{ const nm=(n||'').trim(); if(nm){ tab.name=nm; persist(); render(); } } }); };
    const delT=document.getElementById('res-deltab'); if(delT) delT.onclick=()=>{ uiConfirm({ title:'Delete tab?', message:`Delete the "${tab.name}" tab and all its links?`, okText:'Delete', danger:true, onOk:()=>{ S.resourceTabs=S.resourceTabs.filter(t=>t.id!==tab.id); activeTab='dashboard'; persist(); render(); } }); };
    el.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{ resFilter=b.dataset.filter; renderResource(); });
    el.querySelectorAll('.target-row').forEach(row=>{ const id=row.dataset.id; row.querySelector('.res-del').onclick=(e)=>{ e.preventDefault(); e.stopPropagation(); tab.items=tab.items.filter(x=>x.id!==id); persist(); renderResource(); }; });
  }

  /* ===================== CUSTOM TABS ===================== */
  function openUiModal(html){ const b=document.getElementById('ui-modal-body'); b.innerHTML=html; document.getElementById('ui-modal').classList.add('show'); }
  function closeUiModal(){ document.getElementById('ui-modal').classList.remove('show'); }

  /* In-page replacements for window.prompt / window.confirm (those are blocked in sandboxed frames) */
  function uiPrompt(opts){
    opts=opts||{}; const v=opts.value==null?'':String(opts.value);
    const inputHtml=opts.multiline
      ? `<textarea id="uip-input" style="min-height:140px;" placeholder="${esc(opts.placeholder||'')}">${esc(v)}</textarea>`
      : `<input type="text" id="uip-input" value="${esc(v)}" placeholder="${esc(opts.placeholder||'')}">`;
    openUiModal(`<button class="icon-btn modal-close" id="uip-x">✕</button>
      <h3>${esc(opts.title||'')}</h3>${opts.lead?`<p class="lead">${esc(opts.lead)}</p>`:''}
      <div class="field" style="margin:6px 0 18px;">${opts.label?`<label>${esc(opts.label)}</label>`:''}${inputHtml}</div>
      <div class="row-flex" style="justify-content:flex-end;gap:8px;"><button class="btn ghost" id="uip-cancel">Cancel</button><button class="btn" id="uip-ok">${esc(opts.okText||'Save')}</button></div>`);
    const inp=document.getElementById('uip-input');
    setTimeout(()=>{ try{ inp.focus(); }catch(e){} },40);
    const submit=()=>{ const val=inp.value; closeUiModal(); if(opts.onOk) opts.onOk(val); };
    document.getElementById('uip-ok').onclick=submit;
    document.getElementById('uip-x').onclick=closeUiModal;
    document.getElementById('uip-cancel').onclick=closeUiModal;
    if(!opts.multiline) inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } };
  }
  function uiConfirm(opts){
    opts=opts||{};
    openUiModal(`<button class="icon-btn modal-close" id="uic-x">✕</button>
      <h3>${esc(opts.title||'Are you sure?')}</h3><p class="lead">${esc(opts.message||'')}</p>
      <div class="row-flex" style="justify-content:flex-end;gap:8px;"><button class="btn ghost" id="uic-cancel">Cancel</button><button class="btn" id="uic-ok"${opts.danger?' style="background:var(--red);box-shadow:none;"':''}>${esc(opts.okText||'Confirm')}</button></div>`);
    document.getElementById('uic-ok').onclick=()=>{ closeUiModal(); if(opts.onOk) opts.onOk(); };
    document.getElementById('uic-x').onclick=closeUiModal;
    document.getElementById('uic-cancel').onclick=closeUiModal;
  }

    openUiModal(`<button class="icon-btn modal-close" id="set-x">✕</button>
      <h3>Master Settings</h3>
      <div class="set-sec"><div class="set-h">General</div>
        <div class="field"><label>Tracker name</label><input type="text" id="set-name" value="${esc(S.appName||'')}" placeholder="Track your day" maxlength="40"></div>

      </div>

        <div class="seg"><button class="seg-btn ${t.mode!=='dark'?'on':''}" data-mode="light">☀ Light</button><button class="seg-btn ${t.mode==='dark'?'on':''}" data-mode="dark">🌙 Dark</button></div>
        <label class="set-lab" style="margin-top:16px;">Theme colour</label>

      </div>

      </div>`);
    document.getElementById('set-x').onclick=closeUiModal;

    document.getElementById('set-name').onkeydown=e=>{ if(e.key==='Enter') document.getElementById('set-name-save').click(); };
    document.querySelectorAll('#ui-modal .seg-btn').forEach(b=>b.onclick=()=>{ S.theme.mode=b.dataset.mode; persist(); applyTheme(); openSettings(); });
    document.querySelectorAll('#ui-modal .theme-swatch').forEach(b=>b.onclick=()=>{ S.theme.accent=b.dataset.accent; persist(); applyTheme(); openSettings(); });
    document.getElementById('set-customize').onclick=()=>{ closeUiModal(); menuOpen=false; activeTab='dashboard'; dashCustomize=true; dashArrange=false; render(); };
    document.getElementById('set-arrange').onclick=()=>{ closeUiModal(); menuOpen=false; activeTab='dashboard'; dashArrange=true; dashCustomize=false; render(); };
