  function openTabPicker(){
    openUiModal(`<button class="icon-btn modal-close" id="tp-x">✕</button>
      <h3>Add a tab</h3><p class="lead">Pick what this tab should do. Add as many as you like — rename or delete them any time.</p>
      <div class="picker-grid">${TAB_TYPES.map(t=>`<button class="pick" data-type="${t.type}"><span class="ic">${t.icon}</span><span><span class="nm">${esc(t.name)}</span><span class="ds">${esc(t.desc)}</span></span></button>`).join('')}</div>`);
    document.getElementById('tp-x').onclick=closeUiModal;
    document.querySelectorAll('#ui-modal .pick').forEach(b=>b.onclick=()=>pickTab(b.dataset.type));
  }
  function pickTab(type){
    const meta=TAB_TYPES.find(t=>t.type===type)||{name:'Tab',desc:''};
    uiPrompt({ title:'Name your tab', lead:meta.name+' — '+meta.desc, label:'Tab name', value:meta.name, okText:'Create tab',
      onOk:(name)=>{ const nm=(name||'').trim()||meta.name; createTabOfType(type,nm); } });
  }
  function createTabOfType(type,nm){
    if(type==='resource'){ const t={id:uid(),name:nm,fixed:false,items:[]}; S.resourceTabs.push(t); persist(); activeTab='res:'+t.id; resFilter='All'; render(); toast('Tab added'); return; }
    const normd=normCustomTabs([{id:uid(),type,name:nm}])[0];
    if(!normd){ toast('Could not create tab'); return; }
    S.customTabs.push(normd); persist(); activeTab='custom:'+normd.id; render(); toast('Tab added');
  }
  function addCustomTab(type){ pickTab(type); }
  function addResourceTab(){ pickTab('resource'); }
  function activeCustomTab(){ const id=activeTab.slice(7); return S.customTabs.find(t=>t.id===id); }

  function ctabHead(tab, subtitle, rightExtra){
    return `<div class="section-head ctab-head"><div><h2>${tabIcon(tab.type)} ${esc(tab.name)}</h2><p>${subtitle}</p></div>
      <div class="row-flex">${rightExtra||''}<button class="btn ghost sm" data-ctab-rename>Rename</button><button class="btn ghost sm" data-ctab-del>Delete tab</button></div></div>`;
  }
  function wireCtabHead(tab){
    const el=document.getElementById('v-custom');
    const rn=el.querySelector('[data-ctab-rename]'); if(rn) rn.onclick=()=>{ uiPrompt({ title:'Rename tab', label:'Tab name', value:tab.name, onOk:(n)=>{ const nm=(n||'').trim(); if(nm){ tab.name=nm; persist(); render(); } } }); };
    const dl=el.querySelector('[data-ctab-del]'); if(dl) dl.onclick=()=>{ uiConfirm({ title:'Delete tab?', message:`Delete the "${tab.name}" tab and everything in it?`, okText:'Delete', danger:true, onOk:()=>{ stopRuntime(tab.id); S.customTabs=S.customTabs.filter(t=>t.id!==tab.id); activeTab='dashboard'; persist(); render(); } }); };
  }

  function renderCustom(){
    const el=document.getElementById('v-custom'); if(!el) return;
    if(activeTab.indexOf('custom:')!==0) return;
    const tab=activeCustomTab();
    if(!tab){ activeTab='dashboard'; render(); return; }
    ({checklist:renderChecklist,crosscheck:renderCrosscheck,targets:renderCTargets,progress:renderCProgress,counter:renderCounter,timer:renderTimer,pomodoro:renderPomodoro,notes:renderNotes}[tab.type]||(()=>{el.innerHTML=ctabHead(tab,'Unknown tab type.','');}))(tab,el);
    wireCtabHead(tab);
  }

  /* ---- Checklist ---- */
  function renderChecklist(tab,el){
    const items=tab.items; const done=items.filter(i=>i.done).length; const pct=items.length?Math.round(done/items.length*100):0;
    el.innerHTML=ctabHead(tab,'Tick things off — a to-do or crosscheck list.',`<span class="pill ${pct===100&&items.length?'green':'gold'}">${done}/${items.length} · ${pct}%</span>`)
      +`<div class="card" style="margin-bottom:16px;"><div class="progress big-progress" style="margin-bottom:16px;"><span style="width:${pct}%"></span></div>
         <div class="add-bar"><div class="field" style="flex:2;"><label>Add item</label><input type="text" id="cl-new" placeholder="e.g. Revise Polity Ch. 5"></div><button class="btn" id="cl-add">Add</button>${items.length?'<button class="btn ghost" id="cl-reset">Uncheck all</button>':''}</div></div>
       <div class="card">${items.length?items.map(i=>`<div class="task-row ${i.done?'done':''}" data-id="${i.id}"><div class="chk ${i.done?'on':''}"></div><div class="name">${esc(i.text)}</div><button class="del cl-del">×</button></div>`).join(''):'<div class="empty">Nothing here yet — add your first item above.</div>'}</div>`;
    const add=()=>{ const n=document.getElementById('cl-new'); const t=n.value.trim(); if(!t){n.focus();return;} tab.items.push({id:uid(),text:t,done:false}); persist(); renderCustom(); };
    document.getElementById('cl-add').onclick=add;
    document.getElementById('cl-new').onkeydown=e=>{ if(e.key==='Enter') add(); };
    const rs=document.getElementById('cl-reset'); if(rs) rs.onclick=()=>{ tab.items.forEach(i=>i.done=false); persist(); renderCustom(); };
    el.querySelectorAll('.task-row').forEach(row=>{ const id=row.dataset.id; const it=items.find(x=>x.id===id);
      row.querySelector('.chk').onclick=()=>{ it.done=!it.done; persist(); renderCustom(); };
      row.querySelector('.cl-del').onclick=()=>{ tab.items=items.filter(x=>x.id!==id); persist(); renderCustom(); };
    });
  }

  /* ---- Crosscheck grid ---- */
  function renderCrosscheck(tab,el){
    const cols=tab.cols, rows=tab.rows;
    el.innerHTML=ctabHead(tab,'A matrix to crosscheck progress across stages.',`<button class="btn ghost sm" id="xc-addcol">+ Column</button>`)
     +`<div class="card" style="margin-bottom:16px;"><div class="add-bar"><div class="field" style="flex:2;"><label>Add row</label><input type="text" id="xc-newrow" placeholder="e.g. Modern History"></div><button class="btn" id="xc-addrow">Add row</button></div></div>
       <div class="card"><div class="xgrid-wrap"><table class="xgrid"><thead><tr><th>Item</th>${cols.map(c=>`<th>${esc(c.name)} <button class="del xc-delcol" data-col="${c.id}">×</button></th>`).join('')}<th></th></tr></thead>
       <tbody>${rows.length?rows.map(r=>`<tr><td>${esc(r.name)}</td>${cols.map(c=>`<td><span class="xcell ${r.cells[c.id]?'on':''}" data-row="${r.id}" data-col="${c.id}"></span></td>`).join('')}<td><button class="del xc-delrow" data-row="${r.id}">×</button></td></tr>`).join(''):`<tr><td colspan="${cols.length+2}"><div class="empty">No rows yet — add one above.</div></td></tr>`}</tbody></table></div></div>`;
    const addRow=()=>{ const n=document.getElementById('xc-newrow'); const t=n.value.trim(); if(!t){n.focus();return;} tab.rows.push({id:uid(),name:t,cells:{}}); persist(); renderCustom(); };
    document.getElementById('xc-addrow').onclick=addRow;
    document.getElementById('xc-newrow').onkeydown=e=>{ if(e.key==='Enter') addRow(); };
    document.getElementById('xc-addcol').onclick=()=>{ uiPrompt({ title:'New column', label:'Column name', placeholder:'e.g. Read, Revised, Tested', okText:'Add column', onOk:(nm)=>{ const t=(nm||'').trim(); if(t){ tab.cols.push({id:uid(),name:t}); persist(); renderCustom(); } } }); };
    el.querySelectorAll('.xcell').forEach(c=>c.onclick=()=>{ const r=rows.find(x=>x.id===c.dataset.row); if(!r)return; r.cells[c.dataset.col]=!r.cells[c.dataset.col]; persist(); c.classList.toggle('on'); });
    el.querySelectorAll('.xc-delcol').forEach(b=>b.onclick=()=>{ if(cols.length<=1){toast('Keep at least one column');return;} uiConfirm({ title:'Delete column?', message:'This removes the column and its ticks.', okText:'Delete', danger:true, onOk:()=>{ tab.cols=cols.filter(x=>x.id!==b.dataset.col); tab.rows.forEach(r=>delete r.cells[b.dataset.col]); persist(); renderCustom(); } }); });
    el.querySelectorAll('.xc-delrow').forEach(b=>b.onclick=()=>{ tab.rows=rows.filter(x=>x.id!==b.dataset.row); persist(); renderCustom(); });
  }

  /* ---- Targets ---- */
  function renderCTargets(tab,el){
    const list=tab.items; const today=todayStr(); const done=list.filter(x=>x.done).length,tot=list.length,pct=tot?Math.round(done/tot*100):0;
    el.innerHTML=ctabHead(tab,'Goals with deadlines and completion tracking.',`<span class="pill ${pct===100&&tot?'green':'gold'}">${done}/${tot} · ${pct}%</span>`)
     +`<div class="card" style="margin-bottom:16px;"><div class="progress" style="margin-bottom:16px;"><span style="width:${pct}%"></span></div>
        <div class="add-bar"><div class="field" style="flex:2;"><label>New target</label><input type="text" id="ct-title" placeholder="e.g. Finish Modern History – Spectrum"></div><div class="field"><label>Deadline</label><input type="date" id="ct-date"></div><button class="btn" id="ct-add">Add target</button></div></div>
       <div class="card">${tot?list.map(x=>{const overdue=!x.done&&x.deadline&&x.deadline<today;return `<div class="target-row ${x.done?'done':''}" data-id="${x.id}"><div class="chk ${x.done?'on':''}"></div><div class="meta"><div class="t-title">${esc(x.title)}</div><div class="t-sub">${x.deadline?`<span class="pill ${overdue?'red':''}">${overdue?'Overdue · ':'Due '}${fmtDate(x.deadline)}</span>`:'<span class="pill">No deadline</span>'}${x.done?'<span class="pill green">Completed</span>':''}</div></div><button class="del t-del">×</button></div>`;}).join(''):'<div class="empty">No targets yet — add your first above.</div>'}</div>`;
    document.getElementById('ct-add').onclick=()=>{ const ti=document.getElementById('ct-title'); const da=document.getElementById('ct-date'); const title=ti.value.trim(); if(!title){ti.focus();return;} list.unshift({id:uid(),title,deadline:da.value||'',done:false,created:today}); persist(); renderCustom(); toast('Target added'); };
    el.querySelectorAll('.target-row').forEach(row=>{ const id=row.dataset.id; const it=list.find(x=>x.id===id);
      row.querySelector('.chk').onclick=()=>{ it.done=!it.done; persist(); renderCustom(); };
      row.querySelector('.t-del').onclick=()=>{ tab.items=list.filter(x=>x.id!==id); persist(); renderCustom(); };
    });
  }

  /* ---- Progress sliders ---- */
  function renderCProgress(tab,el){
    const list=tab.items; const overall=list.length?Math.round(list.reduce((a,b)=>a+(+b.pct||0),0)/list.length):0;
    el.innerHTML=ctabHead(tab,'Percent sliders — your own progress check sheet.',`<span class="pill gold">Overall ${overall}%</span>`)
     +`<div class="card" style="margin-bottom:16px;"><div class="add-bar"><div class="field" style="flex:2;"><label>Add item</label><input type="text" id="cp-name" placeholder="e.g. Optional Paper 1"></div><button class="btn" id="cp-add">Add</button></div></div>
       <div class="card">${list.length?list.map(x=>`<div style="padding:14px 4px;border-bottom:1px solid var(--line-soft);" data-id="${x.id}"><div class="row-flex" style="justify-content:space-between;margin-bottom:8px;"><span style="font-weight:600;font-size:15px;">${esc(x.name)}</span><div class="row-flex"><span class="pill ${x.pct>=100?'green':x.pct>=50?'gold':''}">${x.pct}%</span><button class="del cp-del">×</button></div></div><input type="range" min="0" max="100" step="5" value="${x.pct}" class="cp-range" style="width:100%;accent-color:var(--accent);"></div>`).join(''):'<div class="empty">No items yet — add one above.</div>'}</div>`;
    const add=()=>{ const n=document.getElementById('cp-name'); const name=n.value.trim(); if(!name){n.focus();return;} list.push({id:uid(),name,pct:0}); persist(); renderCustom(); };
    document.getElementById('cp-add').onclick=add;
    document.getElementById('cp-name').onkeydown=e=>{ if(e.key==='Enter') add(); };
    el.querySelectorAll('[data-id]').forEach(row=>{ const id=row.dataset.id; const it=list.find(x=>x.id===id); if(!it)return; const rng=row.querySelector('.cp-range'); if(!rng)return;
      rng.oninput=e=>{ it.pct=+e.target.value; row.querySelector('.pill').textContent=it.pct+'%'; };
      rng.onchange=()=>{ persist(); renderCustom(); };
      const d=row.querySelector('.cp-del'); if(d) d.onclick=()=>{ tab.items=list.filter(x=>x.id!==id); persist(); renderCustom(); };
    });
  }

  /* ---- Counters / Habits ---- */
  function renderCounter(tab,el){
    const list=tab.items;
    el.innerHTML=ctabHead(tab,'Tally counters — track questions, days, anything.','')
     +`<div class="card" style="margin-bottom:16px;"><div class="add-bar"><div class="field" style="flex:2;"><label>Counter name</label><input type="text" id="cn-name" placeholder="e.g. MCQs solved"></div><div class="field" style="max-width:120px;"><label>Goal (optional)</label><input type="number" id="cn-goal" min="0" placeholder="—"></div><button class="btn" id="cn-add">Add</button></div></div>
       <div class="card">${list.length?list.map(i=>{const hasGoal=i.goal!==''&&i.goal!=null; const pct=hasGoal&&i.goal>0?Math.min(100,Math.round(i.count/i.goal*100)):null; return `<div class="counter-card" data-id="${i.id}"><div style="flex:1;min-width:0;"><div style="font-weight:600;font-size:15px;">${esc(i.name)}</div>${hasGoal?`<div style="margin-top:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;"><div class="progress" style="flex:1;min-width:120px;max-width:240px;"><span style="width:${pct}%"></span></div><span class="pill ${pct>=100?'green':''}">${i.count}/${i.goal} · ${pct}%</span></div>`:''}</div><div class="stepper"><button class="cn-dec">−</button><div class="cval">${i.count}</div><button class="cn-inc">+</button></div><button class="del cn-del">×</button></div>`;}).join(''):'<div class="empty">No counters yet — add one above.</div>'}</div>`;
    document.getElementById('cn-add').onclick=()=>{ const n=document.getElementById('cn-name'); const g=document.getElementById('cn-goal'); const name=n.value.trim(); if(!name){n.focus();return;} const goal=g.value.trim()===''?'':Math.max(0,+g.value||0); list.push({id:uid(),name,count:0,step:1,goal}); persist(); renderCustom(); };
    el.querySelectorAll('.counter-card').forEach(row=>{ const id=row.dataset.id; const it=list.find(x=>x.id===id);
      row.querySelector('.cn-inc').onclick=()=>{ it.count+=it.step||1; persist(); renderCustom(); };
      row.querySelector('.cn-dec').onclick=()=>{ it.count=Math.max(0,it.count-(it.step||1)); persist(); renderCustom(); };
      row.querySelector('.cn-del').onclick=()=>{ tab.items=list.filter(x=>x.id!==id); persist(); renderCustom(); };
    });
  }

  /* ---- Notes ---- */
  function renderNotes(tab,el){
    const notes=tab.notes;
    el.innerHTML=ctabHead(tab,'Free-form note cards for anything.','<button class="btn sm" id="nt-add">+ Note</button>')
     +`<div class="grid g-2">${notes.length?notes.map(n=>`<div class="card note-card" data-id="${n.id}"><div class="row-flex" style="justify-content:space-between;align-items:center;"><input class="note-title" value="${esc(n.title)}" placeholder="Title"><button class="del nt-del">×</button></div><textarea class="nt-body" placeholder="Write here…" style="min-height:120px;margin-top:8px;">${esc(n.body)}</textarea></div>`).join(''):'<div class="card" style="grid-column:1/-1;"><div class="empty">No notes yet — tap “+ Note”.</div></div>'}</div>`;
    document.getElementById('nt-add').onclick=()=>{ notes.unshift({id:uid(),title:'',body:'',ts:Date.now()}); persist(); renderCustom(); };
    el.querySelectorAll('.note-card').forEach(row=>{ const id=row.dataset.id; const n=notes.find(x=>x.id===id);
      const ti=row.querySelector('.note-title'); ti.oninput=e=>{ n.title=e.target.value; }; ti.onblur=()=>persist();
      const bd=row.querySelector('.nt-body'); bd.oninput=e=>{ n.body=e.target.value; }; bd.onblur=()=>persist();
      row.querySelector('.nt-del').onclick=()=>{ tab.notes=notes.filter(x=>x.id!==id); persist(); renderCustom(); };
    });
  }

  /* ---- Timer runtime helpers ---- */
  let audioCtx;
  function beep(times){ try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); times=times||2; for(let i=0;i<times;i++){ const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.type='sine'; o.frequency.value=780; const t=audioCtx.currentTime+i*0.34; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.3); o.start(t); o.stop(t+0.32);} }catch(e){} }
  function fmtClock(sec){ sec=Math.max(0,Math.round(sec)); const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60; const p=n=>String(n).padStart(2,'0'); return h>0?`${h}:${p(m)}:${p(s)}`:`${p(m)}:${p(s)}`; }
  function ringSVG(id,frac){ const r=54,c=2*Math.PI*r,off=c*(1-Math.max(0,Math.min(1,frac))); return `<svg width="160" height="160" viewBox="0 0 130 130" style="max-width:48vw;"><circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--line)" stroke-width="8"/><circle id="${id}" cx="65" cy="65" r="${r}" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 65 65)" style="transition:stroke-dashoffset .25s linear;"/></svg>`; }
  function setRing(c,frac){ if(!c)return; const r=54,cir=2*Math.PI*r; c.style.strokeDashoffset=(cir*(1-Math.max(0,Math.min(1,frac)))).toFixed(1); }
  function stopRuntime(id){ const rt=runtime[id]; if(rt&&rt.iv){ clearInterval(rt.iv); } delete runtime[id]; }

  /* ---- Timer & Stopwatch ---- */
  function renderTimer(tab,el){
    let rt=runtime[tab.id];
    if(!rt){ const tot=tab.minutes*60+tab.seconds; rt=runtime[tab.id]={mode:'cd',cdTotal:tot,cdRemaining:tot,cdRunning:false,cdEndTs:0,swAccum:0,swRunning:false,swStartTs:0,iv:null}; }
    const isCd=rt.mode==='cd';
    const running=isCd?rt.cdRunning:rt.swRunning;
    el.innerHTML=ctabHead(tab,'Countdown timer and a stopwatch in one tab.','')
     +`<div class="card"><div class="row-flex" style="justify-content:center;margin-bottom:4px;gap:6px;">
          <button class="pill ${isCd?'gold':''}" data-mode="cd" style="cursor:pointer;">Countdown</button>
          <button class="pill ${!isCd?'gold':''}" data-mode="sw" style="cursor:pointer;">Stopwatch</button>
        </div>
        <div class="timer-display"><div class="ring-wrap">${ringSVG('tmr-ring-'+tab.id,1)}<div class="ring-label"><div class="mode">${isCd?'Time left':'Elapsed'}</div><div class="clock mono-time" id="tmr-clock-${tab.id}">00:00</div></div></div></div>
        ${isCd?`<div class="add-bar" style="justify-content:center;"><div class="field" style="max-width:90px;"><label>Min</label><input type="number" id="tmr-min" min="0" value="${tab.minutes}" ${running?'disabled':''}></div><div class="field" style="max-width:90px;"><label>Sec</label><input type="number" id="tmr-sec" min="0" max="59" value="${tab.seconds}" ${running?'disabled':''}></div></div>`:''}
        <div class="timer-ctrls"><button class="btn" id="tmr-start">${running?'Pause':'Start'}</button><button class="btn ghost" id="tmr-reset">Reset</button></div></div>`;
    el.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{ rt.mode=b.dataset.mode; renderCustom(); });
    if(isCd){
      const mi=document.getElementById('tmr-min'), se=document.getElementById('tmr-sec');
      const applySet=()=>{ tab.minutes=Math.max(0,+mi.value||0); tab.seconds=Math.max(0,Math.min(59,+se.value||0)); rt.cdRunning=false; if(rt.iv){clearInterval(rt.iv);rt.iv=null;} rt.cdTotal=rt.cdRemaining=tab.minutes*60+tab.seconds; persist(); renderCustom(); };
      mi.onchange=applySet; se.onchange=applySet;
    }
    document.getElementById('tmr-start').onclick=()=>{
      if(isCd){
        if(rt.cdRunning){ rt.cdRunning=false; if(rt.iv){clearInterval(rt.iv);rt.iv=null;} renderCustom(); }
        else { if(rt.cdRemaining<=0) rt.cdRemaining=rt.cdTotal=tab.minutes*60+tab.seconds; if(rt.cdRemaining<=0){toast('Set a duration first');return;} rt.cdRunning=true; rt.cdEndTs=Date.now()+rt.cdRemaining*1000; if(!rt.iv) rt.iv=setInterval(()=>timerTick(tab),250); renderCustom(); }
      } else {
        if(rt.swRunning){ rt.swAccum=rt.swAccum+(Date.now()-rt.swStartTs)/1000; rt.swRunning=false; if(rt.iv){clearInterval(rt.iv);rt.iv=null;} renderCustom(); }
        else { rt.swRunning=true; rt.swStartTs=Date.now(); if(!rt.iv) rt.iv=setInterval(()=>timerTick(tab),250); renderCustom(); }
      }
    };
    document.getElementById('tmr-reset').onclick=()=>{ if(rt.iv){clearInterval(rt.iv);rt.iv=null;} if(isCd){ rt.cdRunning=false; rt.cdTotal=rt.cdRemaining=tab.minutes*60+tab.seconds; } else { rt.swRunning=false; rt.swAccum=0; } renderCustom(); };
    timerTick(tab);
    if((isCd&&rt.cdRunning)||(!isCd&&rt.swRunning)){ if(!rt.iv) rt.iv=setInterval(()=>timerTick(tab),250); }
  }
  function timerTick(tab){
    const rt=runtime[tab.id]; if(!rt) return;
    const clock=document.getElementById('tmr-clock-'+tab.id);
    const ring=document.getElementById('tmr-ring-'+tab.id);
    if(rt.mode==='cd'){
      if(rt.cdRunning){ rt.cdRemaining=Math.max(0,(rt.cdEndTs-Date.now())/1000);
        if(rt.cdRemaining<=0){ rt.cdRemaining=0; rt.cdRunning=false; if(rt.iv){clearInterval(rt.iv);rt.iv=null;} beep(3); toast('⏰ Timer finished'); if(activeTab==='custom:'+tab.id) renderCustom(); return; } }
      if(clock) clock.textContent=fmtClock(rt.cdRemaining);
      setRing(ring, rt.cdTotal>0?rt.cdRemaining/rt.cdTotal:0);
    } else {
      const elapsed=rt.swAccum+(rt.swRunning?(Date.now()-rt.swStartTs)/1000:0);
      if(clock) clock.textContent=fmtClock(elapsed);
      setRing(ring, (elapsed%60)/60);
    }
  }

  /* ---- Pomodoro ---- */
  function pomoPhaseSecs(tab,phase){ return phase==='long'?tab.longBrk*60 : phase==='short'?tab.brk*60 : tab.focus*60; }
  function pomoLabel(p){ return p==='focus'?'Focus':p==='long'?'Long break':'Short break'; }
  function advancePomo(rt,tab){
    if(rt.phase==='focus'){ rt.focusCount++; rt.phase=(rt.focusCount%tab.rounds===0)?'long':'short'; }
    else { rt.phase='focus'; }
    rt.total=rt.remaining=pomoPhaseSecs(tab,rt.phase);
    if(rt.running) rt.endTs=Date.now()+rt.remaining*1000;
  }
  function renderPomodoro(tab,el){
    let rt=runtime[tab.id];
    if(!rt){ const t=tab.focus*60; rt=runtime[tab.id]={phase:'focus',focusCount:0,total:t,remaining:t,running:false,endTs:0,iv:null}; }
    const sessionNo=Math.min(tab.rounds, rt.focusCount+(rt.phase==='focus'?1:0));
    el.innerHTML=ctabHead(tab,'Focus / break cycles that advance automatically.',`<span class="pill ${rt.phase==='focus'?'red':'green'}">${pomoLabel(rt.phase)}</span>`)
     +`<div class="card"><div class="timer-display"><div class="mode">Round ${sessionNo} of ${tab.rounds}</div><div class="ring-wrap">${ringSVG('pom-ring-'+tab.id,1)}<div class="ring-label"><div class="mode">${pomoLabel(rt.phase)}</div><div class="clock mono-time" id="pom-clock-${tab.id}">00:00</div></div></div></div>
        <div class="timer-ctrls"><button class="btn" id="pom-start">${rt.running?'Pause':'Start'}</button><button class="btn ghost" id="pom-skip">Skip ▸</button><button class="btn ghost" id="pom-reset">Reset</button></div>
        <div class="add-bar" style="justify-content:center;margin-top:14px;">
          <div class="field" style="max-width:90px;"><label>Focus</label><input type="number" id="pom-focus" min="1" value="${tab.focus}"></div>
          <div class="field" style="max-width:90px;"><label>Break</label><input type="number" id="pom-brk" min="1" value="${tab.brk}"></div>
          <div class="field" style="max-width:100px;"><label>Long break</label><input type="number" id="pom-long" min="1" value="${tab.longBrk}"></div>
          <div class="field" style="max-width:90px;"><label>Rounds</label><input type="number" id="pom-rounds" min="1" value="${tab.rounds}"></div>
        </div></div>`;
    const applyCfg=()=>{ tab.focus=Math.max(1,+document.getElementById('pom-focus').value||25); tab.brk=Math.max(1,+document.getElementById('pom-brk').value||5); tab.longBrk=Math.max(1,+document.getElementById('pom-long').value||15); tab.rounds=Math.max(1,+document.getElementById('pom-rounds').value||4); if(rt.iv){clearInterval(rt.iv);rt.iv=null;} runtime[tab.id]={phase:'focus',focusCount:0,total:tab.focus*60,remaining:tab.focus*60,running:false,endTs:0,iv:null}; persist(); renderCustom(); };
    ['pom-focus','pom-brk','pom-long','pom-rounds'].forEach(id=>{ document.getElementById(id).onchange=applyCfg; });
    document.getElementById('pom-start').onclick=()=>{ if(rt.running){ rt.remaining=Math.max(0,(rt.endTs-Date.now())/1000); rt.running=false; if(rt.iv){clearInterval(rt.iv);rt.iv=null;} } else { rt.running=true; rt.endTs=Date.now()+rt.remaining*1000; if(!rt.iv) rt.iv=setInterval(()=>pomTick(tab),250); } renderCustom(); };
    document.getElementById('pom-skip').onclick=()=>{ advancePomo(rt,tab); renderCustom(); };
    document.getElementById('pom-reset').onclick=()=>{ if(rt.iv){clearInterval(rt.iv);rt.iv=null;} runtime[tab.id]={phase:'focus',focusCount:0,total:tab.focus*60,remaining:tab.focus*60,running:false,endTs:0,iv:null}; renderCustom(); };
    pomTick(tab);
    if(rt.running&&!rt.iv) rt.iv=setInterval(()=>pomTick(tab),250);
  }
  function pomTick(tab){
    const rt=runtime[tab.id]; if(!rt) return;
    if(rt.running){ rt.remaining=Math.max(0,(rt.endTs-Date.now())/1000);
      if(rt.remaining<=0){ beep(rt.phase==='focus'?3:2); toast(rt.phase==='focus'?'✅ Focus done — break time':'▶ Break over — back to focus'); advancePomo(rt,tab); if(activeTab==='custom:'+tab.id) renderCustom(); return; } }
    const clock=document.getElementById('pom-clock-'+tab.id); const ring=document.getElementById('pom-ring-'+tab.id);
    if(clock) clock.textContent=fmtClock(rt.remaining);
    setRing(ring, rt.total>0?rt.remaining/rt.total:0);
  }

  /* ===================== EXPORT / IMPORT ===================== */
  function doExport(){ const data=JSON.stringify({_app:'upsc-tracker',_v:1,state:S},null,2); const blob=new Blob([data],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='upsc-tracker-backup-'+todayStr()+'.json'; a.click(); URL.revokeObjectURL(a.href); toast('Backup downloaded'); }
  function doImport(e){ const file=e.target.files[0]; if(!file)return; const r=new FileReader(); r.onload=()=>{ try{ const parsed=JSON.parse(r.result); S=normalize(parsed.state||parsed); persist(); render(); toast('Backup restored'); }catch(err){ toast('Could not read that file'); } }; r.readAsText(file); e.target.value=''; }

  /* ===================== INIT ===================== */
  function init(){
    try{ const raw=localStorage.getItem(STATE_KEY); if(raw) S=normalize(JSON.parse(raw)); }catch(e){}
    cloud.clientId=localStorage.getItem(CLIENT_KEY)||'';
    render();
    if(cloud.clientId) tryAutoConnect();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
})();
</script>
