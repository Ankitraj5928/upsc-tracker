<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mission UPSC · Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --paper:#efe7d8; --card:#faf6ec; --card-2:#f3ecdd;
    --ink:#23201a; --ink-soft:#6f675a; --ink-faint:#a59c8b;
    --accent:#b4521f; --accent-deep:#8a3d15; --gold:#a9831f;
    --green:#3f7d3a; --green-soft:#e3efdc; --red:#a8331f; --red-soft:#f3ddd6;
    --line:rgba(35,32,26,.14); --line-soft:rgba(35,32,26,.08);
    --shadow:0 1px 2px rgba(35,32,26,.06), 0 8px 24px -12px rgba(35,32,26,.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Hanken Grotesk',sans-serif; color:var(--ink); line-height:1.45;
    background:
      radial-gradient(1200px 600px at 100% -10%, rgba(180,82,31,.06), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(169,131,31,.07), transparent 55%),
      var(--paper);
    min-height:100vh; padding-bottom:64px; -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}

  .topbar{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,rgba(239,231,216,.98),rgba(239,231,216,.86));backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
  .topbar-inner{max-width:1080px;margin:0 auto;padding:16px 20px 0;}
  .brand{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .brand h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(22px,3.4vw,30px);letter-spacing:-.01em;margin:0;line-height:1;}
  .brand h1 .dot{color:var(--accent);}
  .brand .sub{font-size:12.5px;color:var(--ink-soft);letter-spacing:.14em;text-transform:uppercase;margin-top:6px;}
  .brand .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
  .icon-btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px;transition:.18s;}
  .icon-btn:hover{color:var(--ink);border-color:var(--ink-soft);transform:translateY(-1px);}

  .cloud-chip{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);}
  .cloud-chip .dotled{width:8px;height:8px;border-radius:50%;background:var(--ink-faint);flex:0 0 auto;}
  .cloud-chip.synced{color:var(--green);border-color:transparent;background:var(--green-soft);}
  .cloud-chip.synced .dotled{background:var(--green);}
  .cloud-chip.saving .dotled{background:var(--gold);animation:pulse 1s infinite;}
  .cloud-chip.saving{color:var(--gold);}
  .cloud-chip.error{color:var(--red);background:var(--red-soft);border-color:transparent;}
  .cloud-chip.error .dotled{background:var(--red);}
  @keyframes pulse{50%{opacity:.25;}}

  .tabs{max-width:1080px;margin:0 auto;padding:14px 12px 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{border:none;background:transparent;white-space:nowrap;padding:10px 16px 14px;font-size:14.5px;font-weight:600;color:var(--ink-soft);border-bottom:2.5px solid transparent;transition:.16s;border-radius:6px 6px 0 0;}
  .tab:hover{color:var(--ink);background:rgba(35,32,26,.035);}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);}

  .wrap{max-width:1080px;margin:0 auto;padding:26px 20px 0;}
  .view{display:none;animation:rise .35s cubic-bezier(.2,.7,.3,1);}
  .view.active{display:block;}
  @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
  .section-head h2{font-family:'Fraunces',serif;font-weight:600;font-size:24px;margin:0;letter-spacing:-.01em;}
  .section-head p{margin:4px 0 0;color:var(--ink-soft);font-size:13.5px;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);}
  .grid{display:grid;gap:16px;}
  @media(min-width:760px){.g-2{grid-template-columns:1fr 1fr;}.g-3{grid-template-columns:repeat(3,1fr);}.g-4{grid-template-columns:repeat(4,1fr);}}

  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
  .stat .label{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;}
  .stat .value{font-family:'Fraunces',serif;font-size:34px;font-weight:600;line-height:1.1;margin-top:6px;}
  .stat .value small{font-size:15px;color:var(--ink-soft);font-family:'Hanken Grotesk';font-weight:600;}
  .stat .foot{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .stat.accent{background:linear-gradient(160deg,#b4521f,#8a3d15);color:#fbeede;border-color:transparent;}
  .stat.accent .label{color:rgba(251,238,222,.8);}
  .stat.accent .foot{color:rgba(251,238,222,.78);}

  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:12px;font-weight:600;color:var(--ink-soft);letter-spacing:.02em;}
  input[type=text],input[type=date],input[type=number],textarea,select{width:100%;border:1px solid var(--line);background:var(--card-2);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink);transition:.15s;}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(180,82,31,.12);}
  textarea{resize:vertical;min-height:46px;}

  .btn{border:none;background:var(--accent);color:#fff;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;transition:.16s;box-shadow:0 6px 16px -8px rgba(180,82,31,.7);}
  .btn:hover{background:var(--accent-deep);transform:translateY(-1px);}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none;}
  .btn.ghost:hover{border-color:var(--ink-soft);}
  .btn.sm{padding:7px 12px;font-size:13px;}
  .btn.block{width:100%;justify-content:center;}
  .del{background:none;border:none;color:var(--ink-faint);font-size:18px;line-height:1;padding:4px 6px;border-radius:8px;transition:.15s;}
  .del:hover{color:var(--red);background:var(--red-soft);}

  .date-nav{display:flex;align-items:center;gap:10px;}
  .date-nav .arrow{border:1px solid var(--line);background:var(--card);border-radius:10px;width:38px;height:38px;font-size:18px;color:var(--ink-soft);display:grid;place-items:center;}
  .date-nav .arrow:hover{color:var(--ink);border-color:var(--ink-soft);}

  .task-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line-soft);}
  .task-row:last-child{border-bottom:none;}
  .chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:0 0 auto;display:grid;place-items:center;transition:.16s;background:var(--card-2);}
  .chk.on{background:var(--green);border-color:var(--green);}
  .chk.on::after{content:"✓";color:#fff;font-size:14px;font-weight:700;}
  .task-row .name{flex:1;font-size:15px;font-weight:500;}
  .task-row.done .name{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--ink-faint);}

  .hour-row{display:flex;gap:10px;align-items:center;margin-bottom:10px;}
  .hour-row select{flex:1;}
  .hour-row input{width:96px;}

  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--card-2);border:1px solid var(--line);color:var(--ink-soft);}
  .pill.green{background:var(--green-soft);color:var(--green);border-color:transparent;}
  .pill.red{background:var(--red-soft);color:var(--red);border-color:transparent;}
  .pill.gold{background:#f6edcf;color:var(--gold);border-color:transparent;}

  .target-row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line-soft);}
  .target-row:last-child{border-bottom:none;}
  .target-row .meta{flex:1;}
  .target-row .meta .t-title{font-weight:600;font-size:15px;}
  .target-row.done .t-title{text-decoration:line-through;color:var(--ink-soft);}
  .target-row .meta .t-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

  .progress{height:9px;border-radius:999px;background:var(--card-2);overflow:hidden;border:1px solid var(--line-soft);}
  .progress > span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:999px;transition:width .5s cubic-bezier(.2,.7,.3,1);}

  .bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:8px;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;}
  .bar{width:100%;max-width:34px;background:linear-gradient(180deg,var(--accent),var(--gold));border-radius:6px 6px 3px 3px;min-height:3px;transition:height .5s cubic-bezier(.2,.7,.3,1);position:relative;}
  .bar .v{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--ink-soft);}
  .bar-col .d{font-size:11px;color:var(--ink-soft);font-weight:600;}
  .bar-col.today .d{color:var(--accent);}

  .series-card{margin-bottom:16px;}
  .series-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
  .series-head .name{font-family:'Fraunces',serif;font-size:19px;font-weight:600;}
  table{width:100%;border-collapse:collapse;margin-top:10px;}
  th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600;}
  td{padding:10px;border-bottom:1px solid var(--line-soft);font-size:13.5px;vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .score-tag{font-weight:700;font-family:'Fraunces',serif;}
  .empty{text-align:center;color:var(--ink-faint);font-size:14px;padding:26px 10px;font-style:italic;}
  .add-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:4px;}
  .add-bar .field{flex:1;min-width:140px;}
  .row-flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .mini-note{font-size:12px;color:var(--ink-soft);background:var(--card-2);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;}

  .modal-bg{position:fixed;inset:0;background:rgba(35,32,26,.45);backdrop-filter:blur(3px);display:none;place-items:center;z-index:80;padding:18px;}
  .modal-bg.show{display:grid;}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:26px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);}
  .modal h3{font-family:'Fraunces',serif;font-size:22px;margin:0 0 4px;}
  .modal .lead{color:var(--ink-soft);font-size:13.5px;margin:0 0 18px;}
  .steps{counter-reset:s;list-style:none;padding:0;margin:0 0 18px;}
  .steps li{counter-increment:s;position:relative;padding:0 0 14px 38px;font-size:13.5px;color:var(--ink);}
  .steps li::before{content:counter(s);position:absolute;left:0;top:-2px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;}
  .steps li b{font-weight:700;}
  .steps code{background:var(--card-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12.5px;word-break:break-all;}
  .uri-box{display:flex;gap:8px;align-items:center;background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 12px;font-size:12.5px;word-break:break-all;margin-top:6px;}
  .uri-box code{flex:1;background:none;border:none;padding:0;}
  .modal-close{position:relative;float:right;margin:-8px -8px 0 0;}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#f3ecdd;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);opacity:0;transition:.28s;z-index:90;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---- custom-tab additions ---- */
  .linkbtn{background:none;border:none;color:var(--accent);font-size:11px;font-weight:700;padding:0 0 0 4px;text-decoration:underline;letter-spacing:0;text-transform:none;}
  .picker-grid{display:grid;gap:12px;grid-template-columns:1fr;margin-top:6px;}
  @media(min-width:520px){.picker-grid{grid-template-columns:1fr 1fr;}}
  .pick{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--card-2);border-radius:14px;padding:13px 14px;transition:.16s;width:100%;}
  .pick:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow);background:#fff;}
  .pick .ic{font-size:22px;line-height:1.1;flex:0 0 auto;width:30px;text-align:center;}
  .pick .nm{font-weight:700;font-size:14.5px;}
  .pick .ds{font-size:12px;color:var(--ink-soft);margin-top:2px;}

  .ctab-head .row-flex{flex-wrap:wrap;}
  .big-progress{height:11px;}
  .mono-time{font-family:'Fraunces',serif;font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:.01em;}

  .timer-display{text-align:center;padding:14px 0 6px;}
  .timer-display .clock{font-size:clamp(54px,13vw,84px);line-height:1;}
  .timer-display .mode{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;margin-bottom:6px;}
  .timer-ctrls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px;}
  .ring-wrap{display:grid;place-items:center;position:relative;}
  .ring-wrap .ring-label{position:absolute;text-align:center;}

  .counter-card{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line-soft);}
  .counter-card:last-child{border-bottom:none;}
  .counter-card .cval{font-family:'Fraunces',serif;font-size:30px;font-weight:600;min-width:52px;text-align:center;}
  .stepper{display:flex;align-items:center;gap:8px;}
  .stepper button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card-2);font-size:20px;color:var(--ink);display:grid;place-items:center;transition:.14s;}
  .stepper button:hover{border-color:var(--accent);color:var(--accent);}

  .xgrid-wrap{overflow-x:auto;}
  table.xgrid{width:100%;border-collapse:collapse;min-width:420px;}
  table.xgrid th,table.xgrid td{padding:9px 10px;border-bottom:1px solid var(--line-soft);font-size:13.5px;}
  table.xgrid th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);text-align:center;}
  table.xgrid th:first-child,table.xgrid td:first-child{text-align:left;font-weight:600;}
  table.xgrid td{text-align:center;}
  .xcell{width:24px;height:24px;border-radius:6px;border:2px solid var(--line);display:inline-grid;place-items:center;background:var(--card-2);transition:.14s;cursor:pointer;}
  .xcell.on{background:var(--green);border-color:var(--green);}
  .xcell.on::after{content:"✓";color:#fff;font-size:13px;font-weight:700;}

  .note-card{background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;}
  .note-card input.note-title{font-weight:700;border:none;background:none;padding:4px 0;font-size:15px;}
  .note-card input.note-title:focus{box-shadow:none;border-bottom:1px solid var(--accent);}
  .note-card textarea{background:#fff;}
</style>
</head>
<body>
<div id="app-root"></div>
<div class="modal-bg" id="cloud-modal"><div class="modal" id="cloud-modal-body"></div></div>
<div class="modal-bg" id="ui-modal"><div class="modal" id="ui-modal-body"></div></div>

<script>
(function(){
  "use strict";

  /* ===================== CONFIG ===================== */
  const STATE_KEY="upsc-tracker-state";
  const CLIENT_KEY="upsc-gdrive-clientid";
  const CONNECTED_KEY="upsc-gdrive-connected";
  const SCOPE="https://www.googleapis.com/auth/drive.appdata";
  const FILE_NAME="upsc-tracker.json";
  const ORIGIN=window.location.origin;

  const DEFAULT_TASKS=["Read Newspaper","Current Affairs Notes","Monthly Magazine","Editorial Analysis","Answer Writing","Revision","PYQ Practice","Optional Subject"];
  const SUBJECTS=["Polity","History","Geography","Economy","Environment","Sci & Tech","Current Affairs","CSAT","Optional","Essay","Ethics (GS4)","Other"];
  const DEFAULT_RES_TYPES=["Notes","Handout","PYQ","Magazine"];

  /* Catalogue of custom tab types available from the "+ Tab" picker */
  const TAB_TYPES=[
    {type:'resource', name:'Resources / Links',   icon:'🔗', desc:'Save links to notes, PDFs, magazines — with your own tags.'},
    {type:'checklist',name:'Checklist',           icon:'✓',  desc:'A tickable to-do / crosscheck list with a progress bar.'},
    {type:'crosscheck',name:'Crosscheck Grid',    icon:'▦',  desc:'Rows × columns matrix, e.g. Read / Revised / Tested.'},
    {type:'targets',  name:'Targets & Deadlines', icon:'◎',  desc:'Goals with due dates and completion tracking.'},
    {type:'progress', name:'Progress Sliders',    icon:'▰',  desc:'Percent sliders — a progress check sheet for any list.'},
    {type:'counter',  name:'Counters / Habits',   icon:'＃', desc:'Tally counters with optional goals (questions, days…).'},
    {type:'timer',    name:'Timer & Stopwatch',   icon:'⏱', desc:'Countdown timer plus a stopwatch.'},
    {type:'pomodoro', name:'Pomodoro Focus',      icon:'🍅', desc:'Focus / break cycles with rounds and auto-advance.'},
    {type:'notes',    name:'Notes / Scratchpad',  icon:'✎',  desc:'Free-form note cards for anything.'}
  ];

  /* ===================== STATE ===================== */
  function defaultResourceTabs(){ return [{id:'default',name:'Resources',fixed:true,items:[]}]; }
  function normResourceTabs(rt){
    if(!Array.isArray(rt)||!rt.length) return defaultResourceTabs();
    const out=rt.map(t=>({ id:t.id||uid(), name:t.name||'Resources', fixed:!!t.fixed, items:Array.isArray(t.items)?t.items.map(it=>({id:it.id||uid(),label:it.label||'',url:it.url||'',type:(it.type&&String(it.type).trim())||'Notes'})):[] }));
    if(!out.some(t=>t.fixed)){ out[0].fixed=true; out[0].id='default'; }
    return out;
  }
  function blankState(){ return { settings:{tasks:DEFAULT_TASKS.slice()}, days:{}, weekly:[], monthly:[], series:[], syllabus:[], syllabusInit:false, resTypes:DEFAULT_RES_TYPES.slice(), resourceTabs:defaultResourceTabs(), customTabs:[] }; }
  function normCustomTabs(ct){
    if(!Array.isArray(ct)) return [];
    return ct.map(t=>{
      const base={ id:t.id||uid(), type:t.type, name:t.name||'Tab' };
      switch(t.type){
        case 'checklist': return {...base, items:Array.isArray(t.items)?t.items.map(i=>({id:i.id||uid(),text:i.text||'',done:!!i.done})):[]};
        case 'crosscheck': {
          const cols=Array.isArray(t.cols)&&t.cols.length?t.cols.map(c=>({id:c.id||uid(),name:c.name||'Col'})):[{id:uid(),name:'Read'},{id:uid(),name:'Revised'},{id:uid(),name:'Tested'}];
          return {...base, cols, rows:Array.isArray(t.rows)?t.rows.map(r=>({id:r.id||uid(),name:r.name||'',cells:r.cells&&typeof r.cells==='object'?r.cells:{}})):[]};
        }
        case 'targets': return {...base, items:Array.isArray(t.items)?t.items.map(i=>({id:i.id||uid(),title:i.title||'',deadline:i.deadline||'',done:!!i.done,created:i.created||todayStr()})):[]};
        case 'progress': return {...base, items:Array.isArray(t.items)?t.items.map(i=>({id:i.id||uid(),name:i.name||'',pct:Math.max(0,Math.min(100,+i.pct||0))})):[]};
        case 'counter': return {...base, items:Array.isArray(t.items)?t.items.map(i=>({id:i.id||uid(),name:i.name||'',count:+i.count||0,step:+i.step||1,goal:(i.goal===''||i.goal==null)?'':+i.goal})):[]};
        case 'timer': return {...base, minutes:+t.minutes||10, seconds:+t.seconds||0};
        case 'pomodoro': return {...base, focus:+t.focus||25, brk:+t.brk||5, longBrk:+t.longBrk||15, rounds:+t.rounds||4};
        case 'notes': return {...base, notes:Array.isArray(t.notes)?t.notes.map(n=>({id:n.id||uid(),title:n.title||'',body:n.body||'',ts:n.ts||Date.now()})):[]};
        default: return null;
      }
    }).filter(Boolean);
  }
  function normalize(o){ o=o||{}; return { settings:(o.settings&&Array.isArray(o.settings.tasks)&&o.settings.tasks.length)?o.settings:{tasks:DEFAULT_TASKS.slice()}, days:o.days||{}, weekly:o.weekly||[], monthly:o.monthly||[], series:o.series||[], syllabus:o.syllabus||[], syllabusInit:!!o.syllabusInit, resTypes:(Array.isArray(o.resTypes)&&o.resTypes.length)?o.resTypes.slice():DEFAULT_RES_TYPES.slice(), resourceTabs:normResourceTabs(o.resourceTabs), customTabs:normCustomTabs(o.customTabs) }; }
  let S=blankState();
  let curDate=todayStr();
  let activeTab='dashboard';
  let resFilter='All';
  const runtime={}; // live timer/pomodoro state keyed by tab id (not persisted)

  const cloud={ clientId:'', connected:false, status:'local', saveTimer:null };
  let tokenClient=null, accessToken=null, tokenExpiry=0, driveFileId=null;
  let pendingResolve=null, pendingReject=null;

  /* ===================== HELPERS ===================== */
  function todayStr(d){ d=d||new Date(); const tz=d.getTimezoneOffset()*60000; return new Date(d-tz).toISOString().slice(0,10); }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function fmtDate(str){ if(!str)return''; const d=new Date(str+'T00:00:00'); return d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}); }
  function fmtDateShort(str){ const d=new Date(str+'T00:00:00'); return d.toLocaleDateString(undefined,{day:'numeric',month:'short'}); }
  function weekday(str){ return new Date(str+'T00:00:00').toLocaleDateString(undefined,{weekday:'short'}); }
  function addDays(str,n){ const d=new Date(str+'T00:00:00'); d.setDate(d.getDate()+n); return todayStr(d); }
  function dayObj(date){ if(!S.days[date]) S.days[date]={checks:{},hours:[],note:''}; return S.days[date]; }
  function dayHours(date){ const o=S.days[date]; if(!o)return 0; return (o.hours||[]).reduce((a,b)=>a+(parseFloat(b.h)||0),0); }
  function dayActive(date){ const o=S.days[date]; if(!o)return false; return dayHours(date)>0||Object.values(o.checks||{}).some(Boolean); }
  let toastTimer;
  function toast(msg){ let t=document.querySelector('.toast'); if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t);} t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1900); }

  /* ===================== PERSISTENCE ===================== */
  function persistLocal(){ try{ localStorage.setItem(STATE_KEY,JSON.stringify(S)); }catch(e){} }
  function persist(){ persistLocal(); scheduleCloudSave(); }
  function scheduleCloudSave(){ if(!cloud.connected) return; clearTimeout(cloud.saveTimer); setSyncStatus('saving'); cloud.saveTimer=setTimeout(cloudSave,1100); }

  /* ===================== GOOGLE IDENTITY / DRIVE ===================== */
  function gisReady(){ return !!(window.google && google.accounts && google.accounts.oauth2); }
  function whenGisReady(timeout){ timeout=timeout||9000; return new Promise(res=>{ const t0=Date.now(); (function p(){ if(gisReady())return res(true); if(Date.now()-t0>timeout)return res(false); setTimeout(p,150); })(); }); }
  function initTokenClient(){
    if(tokenClient) return;
    tokenClient=google.accounts.oauth2.initTokenClient({
      client_id:cloud.clientId, scope:SCOPE,
      callback:(resp)=>{ if(resp&&resp.access_token){ accessToken=resp.access_token; tokenExpiry=Date.now()+(parseInt(resp.expires_in||3600,10)*1000)-60000; if(pendingResolve)pendingResolve(accessToken); } else { if(pendingReject)pendingReject(new Error('no token')); } pendingResolve=pendingReject=null; },
      error_callback:(err)=>{ if(pendingReject)pendingReject(err||new Error('token error')); pendingResolve=pendingReject=null; }
    });
  }
  function requestToken(interactive){ return new Promise((resolve,reject)=>{ pendingResolve=resolve; pendingReject=reject; try{ tokenClient.requestAccessToken({prompt:interactive?'consent':''}); }catch(e){ pendingResolve=pendingReject=null; reject(e); } }); }
  async function getToken(){ if(accessToken && Date.now()<tokenExpiry) return accessToken; return await requestToken(false); }

  async function findFile(token){
    const url='https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,name)&q='+encodeURIComponent("name='"+FILE_NAME+"'");
    const res=await fetch(url,{headers:{Authorization:'Bearer '+token}});
    if(!res.ok) throw new Error('list '+res.status);
    const j=await res.json(); return (j.files&&j.files[0])?j.files[0].id:null;
  }
  async function cloudLoad(){
    const token=await getToken();
    if(!driveFileId) driveFileId=await findFile(token);
    if(!driveFileId) return null;
    const res=await fetch('https://www.googleapis.com/drive/v3/files/'+driveFileId+'?alt=media',{headers:{Authorization:'Bearer '+token}});
    if(res.status===404){ driveFileId=null; return null; }
    if(!res.ok) throw new Error('get '+res.status);
    const data=await res.json(); return data.state||data;
  }
  async function cloudSave(){
    if(!cloud.connected) return;
    try{
      const token=await getToken();
      const body=JSON.stringify({_app:'upsc-tracker',_v:1,saved:new Date().toISOString(),state:S});
      if(!driveFileId) driveFileId=await findFile(token);
      if(!driveFileId){
        const boundary='upscbnd'+Date.now();
        const meta={name:FILE_NAME,parents:['appDataFolder']};
        const multipart='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+body+'\r\n--'+boundary+'--';
        const res=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'multipart/related; boundary='+boundary},body:multipart});
        if(!res.ok) throw new Error('create '+res.status);
        const j=await res.json(); driveFileId=j.id;
      } else {
        const res=await fetch('https://www.googleapis.com/upload/drive/v3/files/'+driveFileId+'?uploadType=media',{method:'PATCH',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body});
        if(!res.ok){ if(res.status===404){ driveFileId=null; return cloudSave(); } throw new Error('update '+res.status); }
      }
      setSyncStatus('synced');
    }catch(e){ console.warn('drive save',e); setSyncStatus('error'); }
  }

  async function connectDrive(){
    if(!cloud.clientId){ openCloudModal(); return; }
    const ready=gisReady()||await whenGisReady();
    if(!ready){ toast('Google sign-in didn’t load — check connection'); return; }
    try{
      setSyncStatus('saving');
      initTokenClient();
      await requestToken(false);
      cloud.connected=true; localStorage.setItem(CONNECTED_KEY,'1');
      await mergeWithCloud();
      closeCloudModal(); render(); toast('Google Drive connected');
    }catch(e){ console.warn(e); cloud.connected=false; setSyncStatus('error'); toast('Could not connect — check the setup steps'); }
  }
  async function mergeWithCloud(){
    let remote=null;
    try{ remote=await cloudLoad(); }catch(e){ setSyncStatus('error'); return; }
    const remoteHasData=remote&&(Object.keys(remote.days||{}).length||(remote.weekly||[]).length||(remote.monthly||[]).length||(remote.series||[]).length||(remote.syllabus||[]).length);
    const localHasData=(Object.keys(S.days).length||S.weekly.length||S.monthly.length||S.series.length);
    if(remoteHasData){
      const useCloud=!localHasData||confirm("A backup was found in your Google Drive.\n\nOK = Load it onto this device (replaces local data).\nCancel = Keep this device's data and overwrite the cloud copy.");
      if(useCloud){ S=normalize(remote); persistLocal(); setSyncStatus('synced'); } else { await cloudSave(); }
    } else { await cloudSave(); }
  }
  async function tryAutoConnect(){
    if(!cloud.clientId||localStorage.getItem(CONNECTED_KEY)!=='1') return;
    const ready=await whenGisReady(); if(!ready) return;
    try{
      initTokenClient();
      await requestToken(false);
      cloud.connected=true;
      const remote=await cloudLoad(); if(remote){ S=normalize(remote); persistLocal(); }
      setSyncStatus('synced'); render();
    }catch(e){ console.warn('auto-connect',e); cloud.connected=false; setSyncStatus('local'); }
  }
  function disconnectDrive(){
    try{ if(accessToken&&gisReady()) google.accounts.oauth2.revoke(accessToken,()=>{}); }catch(e){}
    accessToken=null; tokenExpiry=0; driveFileId=null; cloud.connected=false; localStorage.removeItem(CONNECTED_KEY);
    setSyncStatus('local'); render(); toast('Disconnected (local copy kept)');
  }
  function setSyncStatus(s){ cloud.status=s; const chip=document.getElementById('cloud-chip'); if(!chip)return; chip.className='cloud-chip '+(s==='synced'?'synced':s==='saving'?'saving':s==='error'?'error':''); const txt={local:'Local only',saving:'Syncing…',synced:'Drive synced',error:'Sync error'}[s]||'Local only'; chip.innerHTML='<span class="dotled"></span>'+txt; }

  /* ===================== CLOUD SETUP MODAL ===================== */
  function openCloudModal(){
    const body=document.getElementById('cloud-modal-body');
    const connected=cloud.connected;
    body.innerHTML=`
      <button class="icon-btn modal-close" id="cm-x">✕</button>
      <h3>Google Drive Sync</h3>
      <p class="lead">${connected?'Connected. Your data auto-saves to a hidden App Data folder in your Drive.':'One-time setup to sync your tracker across all devices.'}</p>
      ${connected?`
        <div class="mini-note" style="margin-bottom:16px;">Data lives in your Drive’s hidden <b>App Data</b> area — it won’t show up among your normal files, and only this app can read it.</div>
        <button class="btn ghost block" id="cm-disconnect">Disconnect</button>
      `:`
        <ol class="steps">
          <li>Go to <b>console.cloud.google.com</b> and create a project (top bar → <b>New Project</b>).</li>
          <li><b>APIs &amp; Services → Library</b>, search <b>Google Drive API</b>, open it and click <b>Enable</b>.</li>
          <li><b>APIs &amp; Services → OAuth consent screen</b>: choose <b>External</b>, fill app name + your email, save. Under <b>Audience / Test users</b>, click <b>Add users</b> and add your own Gmail address.</li>
          <li><b>APIs &amp; Services → Credentials → Create credentials → OAuth client ID</b>. Application type = <b>Web application</b>.</li>
          <li>Under <b>Authorized JavaScript origins</b>, click Add and paste this exact address:
            <div class="uri-box"><code id="cm-uri">${esc(ORIGIN)}</code><button class="btn sm" id="cm-copy">Copy</button></div>
          </li>
          <li>Click <b>Create</b>, copy the <b>Client ID</b>, paste it below and connect.</li>
        </ol>
        <div class="field" style="margin-bottom:12px;"><label>OAuth Client ID</label><input type="text" id="cm-client" placeholder="e.g. 12345-abcde.apps.googleusercontent.com" value="${esc(cloud.clientId)}"></div>
        <button class="btn block" id="cm-connect">Save &amp; Connect Google Drive</button>
        ${!gisReady()?'<div class="mini-note" style="margin-top:12px;">Tip: this needs the page served over https (Netlify / GitHub Pages). It won’t connect from a downloaded file.</div>':''}
      `}
    `;
    document.getElementById('cloud-modal').classList.add('show');

    }
  }
  function closeCloudModal(){ document.getElementById('cloud-modal').classList.remove('show'); }

  function tabBtn(id,label){ return `<button class="tab ${activeTab===id?'active':''}" data-tab="${id}">${label}</button>`; }

  /* ===================== DASHBOARD ===================== */
  function renderDashboard(){
    const el=document.getElementById('v-dashboard'); if(!el)return;
    const t=todayStr(); const tHours=dayHours(t); const tChecks=Object.values(dayObj(t).checks).filter(Boolean).length; const totalTasks=S.settings.tasks.length;
    let streak=0,cur=t; if(!dayActive(cur)) cur=addDays(cur,-1); while(dayActive(cur)){ streak++; cur=addDays(cur,-1); }
    const days=[]; let weekTotal=0; for(let i=6;i>=0;i--){ const d=addDays(t,-i); const h=dayHours(d); weekTotal+=h; days.push({d,h}); }
    const maxH=Math.max(2,...days.map(x=>x.h));
    const wDone=S.weekly.filter(x=>x.done).length,wTot=S.weekly.length,mDone=S.monthly.filter(x=>x.done).length,mTot=S.monthly.length;
    let latest=null; S.series.forEach(s=>s.tests.forEach(t2=>{ if(!latest||(t2.date||'')>(latest.date||'')) latest={...t2,series:s.name}; }));
    el.innerHTML=`
      <div class="grid g-4" style="margin-bottom:18px;">

      </div>

          <div class="bars">${days.map(x=>`<div class="bar-col ${x.d===t?'today':''}"><div class="bar" style="height:${Math.round((x.h/maxH)*100)}%">${x.h>0?`<span class="v">${x.h%1===0?x.h:x.h.toFixed(1)}</span>`:''}</div><div class="d">${weekday(x.d)}</div></div>`).join('')}</div>

      <div class="card" style="margin-bottom:16px;"><div class="progress" style="margin-bottom:16px;"><span style="width:${pct}%"></span></div>

      <div class="card">${tot?list.map(x=>{const overdue=!x.done&&x.deadline&&x.deadline<today;return `<div class="target-row ${x.done?'done':''}" data-id="${x.id}"><div class="chk ${x.done?'on':''}"></div><div class="meta"><div class="t-title">${esc(x.title)}</div><div class="t-sub">${x.deadline?`<span class="pill ${overdue?'red':''}">${overdue?'Overdue · ':'Due '}${fmtDate(x.deadline)}</span>`:'<span class="pill">No deadline</span>'}${x.done?'<span class="pill green">Completed</span>':''}</div></div><button class="del t-del">×</button></div>`;}).join(''):'<div class="empty">No targets yet — add your first one above.</div>'}</div>`;
    document.getElementById(kind+'-add').onclick=()=>{ const ti=document.getElementById(kind+'-title'); const da=document.getElementById(kind+'-date'); const title=ti.value.trim(); if(!title){ti.focus();return;} list.unshift({id:uid(),title,deadline:da.value||'',done:false,created:today}); persist(); renderTargets(kind); toast('Target added'); };
    el.querySelectorAll('.target-row').forEach(row=>{ const id=row.dataset.id; const item=list.find(x=>x.id===id);
      row.querySelector('.chk').onclick=()=>{item.done=!item.done;persist();renderTargets(kind);};
      row.querySelector('.t-del').onclick=()=>{S[kind]=list.filter(x=>x.id!==id);persist();renderTargets(kind);};
    });
  }
  function renderWeekly(){ renderTargets('weekly'); }
  function renderMonthly(){ renderTargets('monthly'); }

  /* ===================== TEST SERIES ===================== */
  function renderTests(){
    const el=document.getElementById('v-tests'); if(!el)return;
    el.innerHTML=`
      <div class="section-head"><div><h2>Test Series</h2><p>Add a series, then log each test with syllabus, marks and remarks.</p></div></div>
      <div class="card" style="margin-bottom:18px;"><div class="add-bar"><div class="field" style="flex:2;"><label>New test series</label><input type="text" id="series-name" placeholder="e.g. Vision IAS Prelims 2026 / Self-made mocks"></div><button class="btn" id="series-add">Add series</button></div></div>
      <div id="series-wrap">${S.series.length?S.series.map(renderSeriesCard).join(''):'<div class="card"><div class="empty">No test series yet. Add one above — you can create as many as you like.</div></div>'}</div>`;
    document.getElementById('series-add').onclick=()=>{ const n=document.getElementById('series-name'); const name=n.value.trim(); if(!name){n.focus();return;} S.series.unshift({id:uid(),name,tests:[]}); persist(); renderTests(); toast('Series added'); };
    S.series.forEach(s=>{ const root=document.querySelector(`[data-series="${s.id}"]`); if(!root)return;
      root.querySelector('.series-del').onclick=()=>{ if(confirm(`Delete series "${s.name}" and all its tests?`)){ S.series=S.series.filter(x=>x.id!==s.id); persist(); renderTests(); } };
      root.querySelector('.test-add').onclick=()=>{ const g=id=>root.querySelector('#'+id+'-'+s.id); const topic=g('t-topic').value.trim(); const scored=parseFloat(g('t-scored').value); const total=parseFloat(g('t-total').value); if(!topic){g('t-topic').focus();return;} if(isNaN(total)||total<=0){g('t-total').focus();return;} s.tests.push({id:uid(),topic,scored:isNaN(scored)?0:scored,total,date:g('t-date').value||todayStr(),remarks:g('t-rem').value.trim()}); persist(); renderTests(); toast('Test logged'); };
      root.querySelectorAll('.test-del').forEach(b=>{ b.onclick=()=>{ s.tests=s.tests.filter(x=>x.id!==b.dataset.id); persist(); renderTests(); }; });
    });
  }
  function renderSeriesCard(s){
    const valid=s.tests.filter(t=>t.total>0);
    const avg=valid.length?(valid.reduce((a,b)=>a+(b.scored/b.total),0)/valid.length*100):null;
    return `<div class="card series-card" data-series="${s.id}">
      <div class="series-head"><div class="name">${esc(s.name)}</div><div class="row-flex">${avg!=null?`<span class="pill ${avg>=50?'green':avg>=35?'gold':'red'}">Avg ${avg.toFixed(1)}%</span>`:''}<span class="pill">${s.tests.length} test${s.tests.length===1?'':'s'}</span><button class="del series-del">×</button></div></div>
      ${s.tests.length?`<table><thead><tr><th>Test / Syllabus</th><th>Date</th><th style="text-align:center;">Marks</th><th style="text-align:center;">%</th><th>Remarks</th><th></th></tr></thead><tbody>${s.tests.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(t=>{const p=t.total>0?(t.scored/t.total*100):0;const col=p>=50?'var(--green)':p>=35?'var(--gold)':'var(--red)';return `<tr><td style="font-weight:600;">${esc(t.topic)}</td><td style="color:var(--ink-soft);white-space:nowrap;">${fmtDateShort(t.date)}</td><td style="text-align:center;" class="score-tag">${t.scored}<span style="color:var(--ink-faint);">/${t.total}</span></td><td style="text-align:center;color:${col};font-weight:700;">${p.toFixed(0)}%</td><td style="color:var(--ink-soft);">${esc(t.remarks)||'—'}</td><td><button class="del test-del" data-id="${t.id}">×</button></td></tr>`;}).join('')}</tbody></table>`:'<div class="empty" style="padding:14px;">No tests logged in this series yet.</div>'}
      <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line-soft);"><div class="add-bar">
        <div class="field" style="flex:2;min-width:160px;"><label>Test / Syllabus topic</label><input type="text" id="t-topic-${s.id}" placeholder="e.g. Polity – Test 3"></div>
        <div class="field" style="min-width:90px;"><label>Scored</label><input type="number" id="t-scored-${s.id}" step="0.5" placeholder="0"></div>
        <div class="field" style="min-width:90px;"><label>Out of</label><input type="number" id="t-total-${s.id}" step="0.5" placeholder="200"></div>
        <div class="field"><label>Date</label><input type="date" id="t-date-${s.id}"></div>
        <div class="field" style="flex:2;min-width:160px;"><label>Remarks</label><input type="text" id="t-rem-${s.id}" placeholder="weak areas, time mgmt..."></div>
        <button class="btn sm test-add">+ Log test</button>
      </div></div></div>`;
  }

  /* ===================== SYLLABUS ===================== */
  function renderSyllabus(){
    const el=document.getElementById('v-syllabus'); if(!el)return;
    if(!S.syllabus.length&&!S.syllabusInit){ S.syllabusInit=true; S.syllabus=[['GS1 – History, Geography, Society'],['GS2 – Polity, Governance, IR'],['GS3 – Economy, Environment, Sci-Tech, Security'],['GS4 – Ethics'],['CSAT'],['Optional Subject'],['Essay']].map(n=>({id:uid(),name:n[0],pct:0})); persist(); }
    const list=S.syllabus; const overall=list.length?Math.round(list.reduce((a,b)=>a+(+b.pct||0),0)/list.length):0;
    el.innerHTML=`
      <div class="section-head"><div><h2>Syllabus Progress</h2><p>Track how far you've covered each part of the syllabus.</p></div><span class="pill gold">Overall ${overall}%</span></div>
      <div class="card" style="margin-bottom:16px;"><div class="add-bar"><div class="field" style="flex:2;"><label>Add a subject / paper</label><input type="text" id="syl-name" placeholder="e.g. PSIR Paper 1"></div><button class="btn" id="syl-add">Add</button></div></div>
      <div class="card">${list.map(x=>`<div style="padding:14px 4px;border-bottom:1px solid var(--line-soft);" data-syl="${x.id}"><div class="row-flex" style="justify-content:space-between;margin-bottom:8px;"><span style="font-weight:600;font-size:15px;">${esc(x.name)}</span><div class="row-flex"><span class="pill ${x.pct>=100?'green':x.pct>=50?'gold':''}">${x.pct}%</span><button class="del syl-del">×</button></div></div><input type="range" min="0" max="100" step="5" value="${x.pct}" class="syl-range" style="width:100%;accent-color:var(--accent);"></div>`).join('')}</div>`;
    document.getElementById('syl-add').onclick=()=>{ const n=document.getElementById('syl-name'); const name=n.value.trim(); if(!name){n.focus();return;} S.syllabus.push({id:uid(),name,pct:0}); persist(); renderSyllabus(); toast('Subject added'); };
    el.querySelectorAll('[data-syl]').forEach(row=>{ const id=row.dataset.syl; const item=list.find(x=>x.id===id);
      row.querySelector('.syl-range').oninput=e=>{ item.pct=+e.target.value; row.querySelector('.pill').textContent=item.pct+'%'; };
      row.querySelector('.syl-range').onchange=()=>{ persist(); renderSyllabus(); };
      row.querySelector('.syl-del').onclick=()=>{ S.syllabus=list.filter(x=>x.id!==id); persist(); renderSyllabus(); };

  /* ===================== RESOURCES (link tabs) ===================== */
  function typeColor(t){ if(t==='Notes')return'gold'; if(t==='Handout')return'green'; if(t==='PYQ')return'red'; if(t==='Magazine')return''; const pal=['gold','green','red','']; let h=0; const s=String(t||''); for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return pal[h%pal.length]; }
  function normUrl(u){ u=(u||'').trim(); if(!u) return ''; if(!/^https?:\/\//i.test(u)) u='https://'+u; return u; }
  function activeResTab(){ const id=activeTab.slice(4); return S.resourceTabs.find(t=>t.id===id); }
  function addResourceTab(){ const name=prompt("Name your new tab (e.g. Optional, Mains Answers, Maps):",""); if(name===null)return; const nm=name.trim(); if(!nm)return; const t={id:uid(),name:nm,fixed:false,items:[]}; S.resourceTabs.push(t); persist(); activeTab='res:'+t.id; resFilter='All'; render(); toast('Tab added'); }

  function renderResource(){
    const el=document.getElementById('v-resource'); if(!el) return;
    if(activeTab.indexOf('res:')!==0) return;
    const tab=activeResTab();
    if(!tab){ activeTab='dashboard'; render(); return; }
    const items=tab.items;
    const typeSet=[]; S.resTypes.forEach(t=>{ if(typeSet.indexOf(t)<0) typeSet.push(t); }); items.forEach(it=>{ if(it.type&&typeSet.indexOf(it.type)<0) typeSet.push(it.type); });
    const shown=items.filter(it=>resFilter==='All'||it.type===resFilter);
    const counts={}; typeSet.forEach(t=>counts[t]=items.filter(x=>x.type===t).length);
    el.innerHTML=`
      <div class="section-head">
        <div><h2>${esc(tab.name)}</h2><p>Paste links to your notes, handouts, PYQs or magazines — tapping one opens it in a new tab.</p></div>
        <div class="row-flex">
          <button class="btn ghost sm" id="res-rename">Rename</button>
          ${tab.fixed?'':'<button class="btn ghost sm" id="res-deltab">Delete tab</button>'}
        </div>
      </div>
      <div class="card" style="margin-bottom:16px;">
        <div class="add-bar">
          <div class="field" style="flex:2;min-width:160px;"><label>Label</label><input type="text" id="res-label" placeholder="e.g. Polity Notes – Laxmikanth Ch.5"></div>
          <div class="field" style="flex:3;min-width:200px;"><label>Link (OneDrive folder / PDF / Drive)</label><input type="text" id="res-url" placeholder="paste link here"></div>
          <div class="field" style="min-width:150px;"><label>Type <button type="button" id="res-managetypes" class="linkbtn">manage</button></label><select id="res-type">${typeSet.map(t=>`<option>${esc(t)}</option>`).join('')}<option value="__new__">＋ New tag…</option></select></div>
          <button class="btn" id="res-add">Add link</button>
        </div>
      </div>
      <div class="card">
        <div class="row-flex" style="margin-bottom:14px;gap:8px;">
          ${['All',...typeSet].map(f=>`<button class="pill ${f===resFilter?(f==='All'?'gold':typeColor(f)||'gold'):''}" data-filter="${esc(f)}" style="cursor:pointer;">${esc(f)}${f!=='All'?` · ${counts[f]||0}`:` · ${items.length}`}</button>`).join('')}
        </div>
        ${shown.length? shown.map(it=>`
          <div class="target-row" data-id="${it.id}">
            <span class="pill ${typeColor(it.type)}" style="min-width:74px;justify-content:center;">${esc(it.type)}</span>
            <div class="meta" style="min-width:0;">
              <a class="t-title res-open" href="${esc(normUrl(it.url))}" target="_blank" rel="noopener noreferrer" style="color:var(--ink);text-decoration:none;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(it.label||it.url)} ↗</a>
              <div class="t-sub"><span style="color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;display:block;">${esc(it.url)}</span></div>
            </div>
            <button class="del res-del">×</button>
          </div>`).join('') : `<div class="empty">No links here yet${resFilter!=='All'?' for '+esc(resFilter):''} — add one above.</div>`}
      </div>`;

    const typeSel=document.getElementById('res-type');
    typeSel.onchange=()=>{ if(typeSel.value==='__new__'){ const t=prompt("New tag name (e.g. Optional, Mains, Map, Editorial):",""); const nm=t&&t.trim(); if(nm){ if(S.resTypes.indexOf(nm)<0) S.resTypes.push(nm); persist(); resFilter='All'; renderResource(); document.getElementById('res-type').value=nm; } else { typeSel.value=typeSet[0]||''; } } };
    document.getElementById('res-managetypes').onclick=()=>{ const cur=S.resTypes.join('\n'); const v=prompt("Edit your tag list (one per line). These appear in the Type dropdown:",cur); if(v===null)return; const list=v.split('\n').map(s=>s.trim()).filter(Boolean); S.resTypes=list.length?list:DEFAULT_RES_TYPES.slice(); persist(); renderResource(); toast('Tags updated'); };
    document.getElementById('res-add').onclick=()=>{
      const lab=document.getElementById('res-label').value.trim();
      const url=normUrl(document.getElementById('res-url').value);
      let type=document.getElementById('res-type').value;
      if(type==='__new__'||!type) type=(typeSet[0]||'Notes');
      if(!url){ document.getElementById('res-url').focus(); toast('Paste a link first'); return; }
      tab.items.unshift({id:uid(),label:lab||url,url,type});
      persist(); renderResource(); toast('Link added');
    };
    document.getElementById('res-rename').onclick=()=>{ const n=prompt("Rename this tab:",tab.name); if(n===null)return; const nm=n.trim(); if(nm){ tab.name=nm; persist(); render(); } };
    const delT=document.getElementById('res-deltab'); if(delT) delT.onclick=()=>{ if(confirm(`Delete the "${tab.name}" tab and all its links?`)){ S.resourceTabs=S.resourceTabs.filter(t=>t.id!==tab.id); activeTab='res:'+(S.resourceTabs[0]&&S.resourceTabs[0].id||'default'); persist(); render(); } };
    el.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{ resFilter=b.dataset.filter; renderResource(); });
    el.querySelectorAll('.target-row').forEach(row=>{ const id=row.dataset.id; row.querySelector('.res-del').onclick=(e)=>{ e.preventDefault(); e.stopPropagation(); tab.items=tab.items.filter(x=>x.id!==id); persist(); renderResource(); }; });
  }

  /* ===================== CUSTOM TABS ===================== */
  function openUiModal(html){ const b=document.getElementById('ui-modal-body'); b.innerHTML=html; document.getElementById('ui-modal').classList.add('show'); }
  function closeUiModal(){ document.getElementById('ui-modal').classList.remove('show'); }

  function openTabPicker(){
    openUiModal(`<button class="icon-btn modal-close" id="tp-x">✕</button>
      <h3>Add a tab</h3><p class="lead">Pick what this tab should do. Add as many as you like — rename or delete them any time.</p>
      <div class="picker-grid">${TAB_TYPES.map(t=>`<button class="pick" data-type="${t.type}"><span class="ic">${t.icon}</span><span><span class="nm">${esc(t.name)}</span><span class="ds">${esc(t.desc)}</span></span></button>`).join('')}</div>`);
    document.getElementById('tp-x').onclick=closeUiModal;
    document.querySelectorAll('#ui-modal .pick').forEach(b=>b.onclick=()=>{ closeUiModal(); addCustomTab(b.dataset.type); });
  }
  function addCustomTab(type){
    if(type==='resource'){ addResourceTab(); return; }
    const meta=TAB_TYPES.find(t=>t.type===type)||{name:'Tab'};
    const name=prompt(`Name your ${meta.name} tab:`, meta.name); if(name===null) return;
    const nm=name.trim()||meta.name;
    const normd=normCustomTabs([{id:uid(),type,name:nm}])[0];
    if(!normd){ toast('Could not create tab'); return; }
    S.customTabs.push(normd); persist(); activeTab='custom:'+normd.id; render(); toast('Tab added');
  }
  function activeCustomTab(){ const id=activeTab.slice(7); return S.customTabs.find(t=>t.id===id); }

  function ctabHead(tab, subtitle, rightExtra){
    return `<div class="section-head ctab-head"><div><h2>${tabIcon(tab.type)} ${esc(tab.name)}</h2><p>${subtitle}</p></div>
      <div class="row-flex">${rightExtra||''}<button class="btn ghost sm" data-ctab-rename>Rename</button><button class="btn ghost sm" data-ctab-del>Delete tab</button></div></div>`;
  }
  function wireCtabHead(tab){
    const el=document.getElementById('v-custom');
    const rn=el.querySelector('[data-ctab-rename]'); if(rn) rn.onclick=()=>{ const n=prompt("Rename this tab:",tab.name); if(n===null)return; const nm=n.trim(); if(nm){ tab.name=nm; persist(); render(); } };
    const dl=el.querySelector('[data-ctab-del]'); if(dl) dl.onclick=()=>{ if(confirm(`Delete the "${tab.name}" tab and everything in it?`)){ stopRuntime(tab.id); S.customTabs=S.customTabs.filter(t=>t.id!==tab.id); activeTab='dashboard'; persist(); render(); } };
  }

  function renderCustom(){
    const el=document.getElementById('v-custom'); if(!el) return;
    if(activeTab.indexOf('custom:')!==0) return;
    const tab=activeCustomTab();
    if(!tab){ activeTab='dashboard'; render(); return; }
    ({checklist:renderChecklist,crosscheck:renderCrosscheck,targets:renderCTargets,progress:renderCProgress,counter:renderCounter,timer:renderTimer,pomodoro:renderPomodoro,notes:renderNotes}[tab.type]||(()=>{el.innerHTML=ctabHead(tab,'Unknown tab type.','');}))(tab,el);
    wireCtabHead(tab);
  }

  /* ---- Checklist ---- */
  function renderChecklist(tab,el){
    const items=tab.items; const done=items.filter(i=>i.done).length; const pct=items.length?Math.round(done/items.length*100):0;
    el.innerHTML=ctabHead(tab,'Tick things off — a to-do or crosscheck list.',`<span class="pill ${pct===100&&items.length?'green':'gold'}">${done}/${items.length} · ${pct}%</span>`)
      +`<div class="card" style="margin-bottom:16px;"><div class="progress big-progress" style="margin-bottom:16px;"><span style="width:${pct}%"></span></div>
         <div class="add-bar"><div class="field" style="flex:2;"><label>Add item</label><input type="text" id="cl-new" placeholder="e.g. Revise Polity Ch. 5"></div><button class="btn" id="cl-add">Add</button>${items.length?'<button class="btn ghost" id="cl-reset">Uncheck all</button>':''}</div></div>
       <div class="card">${items.length?items.map(i=>`<div class="task-row ${i.done?'done':''}" data-id="${i.id}"><div class="chk ${i.done?'on':''}"></div><div class="name">${esc(i.text)}</div><button class="del cl-del">×</button></div>`).join(''):'<div class="empty">Nothing here yet — add your first item above.</div>'}</div>`;
    const add=()=>{ const n=document.getElementById('cl-new'); const t=n.value.trim(); if(!t){n.focus();return;} tab.items.push({id:uid(),text:t,done:false}); persist(); renderCustom(); };
    document.getElementById('cl-add').onclick=add;
    document.getElementById('cl-new').onkeydown=e=>{ if(e.key==='Enter') add(); };
    const rs=document.getElementById('cl-reset'); if(rs) rs.onclick=()=>{ tab.items.forEach(i=>i.done=false); persist(); renderCustom(); };
    el.querySelectorAll('.task-row').forEach(row=>{ const id=row.dataset.id; const it=items.find(x=>x.id===id);
      row.querySelector('.chk').onclick=()=>{ it.done=!it.done; persist(); renderCustom(); };
      row.querySelector('.cl-del').onclick=()=>{ tab.items=items.filter(x=>x.id!==id); persist(); renderCustom(); };
    });
  }

  /* ---- Crosscheck grid ---- */
  function renderCrosscheck(tab,el){
    const cols=tab.cols, rows=tab.rows;
    el.innerHTML=ctabHead(tab,'A matrix to crosscheck progress across stages.',`<button class="btn ghost sm" id="xc-addcol">+ Column</button>`)
     +`<div class="card" style="margin-bottom:16px;"><div class="add-bar"><div class="field" style="flex:2;"><label>Add row</label><input type="text" id="xc-newrow" placeholder="e.g. Modern History"></div><button class="btn" id="xc-addrow">Add row</button></div></div>
       <div class="card"><div class="xgrid-wrap"><table class="xgrid"><thead><tr><th>Item</th>${cols.map(c=>`<th>${esc(c.name)} <button class="del xc-delcol" data-col="${c.id}">×</button></th>`).join('')}<th></th></tr></thead>
       <tbody>${rows.length?rows.map(r=>`<tr><td>${esc(r.name)}</td>${cols.map(c=>`<td><span class="xcell ${r.cells[c.id]?'on':''}" data-row="${r.id}" data-col="${c.id}"></span></td>`).join('')}<td><button class="del xc-delrow" data-row="${r.id}">×</button></td></tr>`).join(''):`<tr><td colspan="${cols.length+2}"><div class="empty">No rows yet — add one above.</div></td></tr>`}</tbody></table></div></div>`;
    const addRow=()=>{ const n=document.getElementById('xc-newrow'); const t=n.value.trim(); if(!t){n.focus();return;} tab.rows.push({id:uid(),name:t,cells:{}}); persist(); renderCustom(); };
    document.getElementById('xc-addrow').onclick=addRow;
    document.getElementById('xc-newrow').onkeydown=e=>{ if(e.key==='Enter') addRow(); };
    document.getElementById('xc-addcol').onclick=()=>{ const nm=prompt("New column name (e.g. Read, Revised, Tested):",""); const t=nm&&nm.trim(); if(t){ tab.cols.push({id:uid(),name:t}); persist(); renderCustom(); } };
    el.querySelectorAll('.xcell').forEach(c=>c.onclick=()=>{ const r=rows.find(x=>x.id===c.dataset.row); if(!r)return; r.cells[c.dataset.col]=!r.cells[c.dataset.col]; persist(); c.classList.toggle('on'); });
    el.querySelectorAll('.xc-delcol').forEach(b=>b.onclick=()=>{ if(cols.length<=1){toast('Keep at least one column');return;} if(confirm('Delete this column?')){ tab.cols=cols.filter(x=>x.id!==b.dataset.col); tab.rows.forEach(r=>delete r.cells[b.dataset.col]); persist(); renderCustom(); } });
    el.querySelectorAll('.xc-delrow').forEach(b=>b.onclick=()=>{ tab.rows=rows.filter(x=>x.id!==b.dataset.row); persist(); renderCustom(); });
  }

  /* ---- Targets ---- */
  function renderCTargets(tab,el){
    const list=tab.items; const today=todayStr(); const done=list.filter(x=>x.done).length,tot=list.length,pct=tot?Math.round(done/tot*100):0;
    el.innerHTML=ctabHead(tab,'Goals with deadlines and completion tracking.',`<span class="pill ${pct===100&&tot?'green':'gold'}">${done}/${tot} · ${pct}%</span>`)
     +`<div class="card" style="margin-bottom:16px;"><div class="progress" style="margin-bottom:16px;"><span style="width:${pct}%"></span></div>
        <div class="add-bar"><div class="field" style="flex:2;"><label>New target</label><input type="text" id="ct-title" placeholder="e.g. Finish Modern History – Spectrum"></div><div class="field"><label>Deadline</label><input type="date" id="ct-date"></div><button class="btn" id="ct-add">Add target</button></div></div>
       <div class="card">${tot?list.map(x=>{const overdue=!x.done&&x.deadline&&x.deadline<today;return `<div class="target-row ${x.done?'done':''}" data-id="${x.id}"><div class="chk ${x.done?'on':''}"></div><div class="meta"><div class="t-title">${esc(x.title)}</div><div class="t-sub">${x.deadline?`<span class="pill ${overdue?'red':''}">${overdue?'Overdue · ':'Due '}${fmtDate(x.deadline)}</span>`:'<span class="pill">No deadline</span>'}${x.done?'<span class="pill green">Completed</span>':''}</div></div><button class="del t-del">×</button></div>`;}).join(''):'<div class="empty">No targets yet — add your first above.</div>'}</div>`;
    document.getElementById('ct-add').onclick=()=>{ const ti=document.getElementById('ct-title'); const da=document.getElementById('ct-date'); const title=ti.value.trim(); if(!title){ti.focus();return;} list.unshift({id:uid(),title,deadline:da.value||'',done:false,created:today}); persist(); renderCustom(); toast('Target added'); };
    el.querySelectorAll('.target-row').forEach(row=>{ const id=row.dataset.id; const it=list.find(x=>x.id===id);
      row.querySelector('.chk').onclick=()=>{ it.done=!it.done; persist(); renderCustom(); };
      row.querySelector('.t-del').onclick=()=>{ tab.items=list.filter(x=>x.id!==id); persist(); renderCustom(); };
    });
  }

  /* ---- Progress sliders ---- */
  function renderCProgress(tab,el){
    const list=tab.items; const overall=list.length?Math.round(list.reduce((a,b)=>a+(+b.pct||0),0)/list.length):0;
    el.innerHTML=ctabHead(tab,'Percent sliders — your own progress check sheet.',`<span class="pill gold">Overall ${overall}%</span>`)
     +`<div class="card" style="margin-bottom:16px;"><div class="add-bar"><div class="field" style="flex:2;"><label>Add item</label><input type="text" id="cp-name" placeholder="e.g. Optional Paper 1"></div><button class="btn" id="cp-add">Add</button></div></div>
       <div class="card">${list.length?list.map(x=>`<div style="padding:14px 4px;border-bottom:1px solid var(--line-soft);" data-id="${x.id}"><div class="row-flex" style="justify-content:space-between;margin-bottom:8px;"><span style="font-weight:600;font-size:15px;">${esc(x.name)}</span><div class="row-flex"><span class="pill ${x.pct>=100?'green':x.pct>=50?'gold':''}">${x.pct}%</span><button class="del cp-del">×</button></div></div><input type="range" min="0" max="100" step="5" value="${x.pct}" class="cp-range" style="width:100%;accent-color:var(--accent);"></div>`).join(''):'<div class="empty">No items yet — add one above.</div>'}</div>`;
    const add=()=>{ const n=document.getElementById('cp-name'); const name=n.value.trim(); if(!name){n.focus();return;} list.push({id:uid(),name,pct:0}); persist(); renderCustom(); };
    document.getElementById('cp-add').onclick=add;
    document.getElementById('cp-name').onkeydown=e=>{ if(e.key==='Enter') add(); };
    el.querySelectorAll('[data-id]').forEach(row=>{ const id=row.dataset.id; const it=list.find(x=>x.id===id); if(!it)return; const rng=row.querySelector('.cp-range'); if(!rng)return;
      rng.oninput=e=>{ it.pct=+e.target.value; row.querySelector('.pill').textContent=it.pct+'%'; };
      rng.onchange=()=>{ persist(); renderCustom(); };
      const d=row.querySelector('.cp-del'); if(d) d.onclick=()=>{ tab.items=list.filter(x=>x.id!==id); persist(); renderCustom(); };
    });
  }

  /* ---- Counters / Habits ---- */
  function renderCounter(tab,el){
    const list=tab.items;
    el.innerHTML=ctabHead(tab,'Tally counters — track questions, days, anything.','')
     +`<div class="card" style="margin-bottom:16px;"><div class="add-bar"><div class="field" style="flex:2;"><label>Counter name</label><input type="text" id="cn-name" placeholder="e.g. MCQs solved"></div><div class="field" style="max-width:120px;"><label>Goal (optional)</label><input type="number" id="cn-goal" min="0" placeholder="—"></div><button class="btn" id="cn-add">Add</button></div></div>
       <div class="card">${list.length?list.map(i=>{const hasGoal=i.goal!==''&&i.goal!=null; const pct=hasGoal&&i.goal>0?Math.min(100,Math.round(i.count/i.goal*100)):null; return `<div class="counter-card" data-id="${i.id}"><div style="flex:1;min-width:0;"><div style="font-weight:600;font-size:15px;">${esc(i.name)}</div>${hasGoal?`<div style="margin-top:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;"><div class="progress" style="flex:1;min-width:120px;max-width:240px;"><span style="width:${pct}%"></span></div><span class="pill ${pct>=100?'green':''}">${i.count}/${i.goal} · ${pct}%</span></div>`:''}</div><div class="stepper"><button class="cn-dec">−</button><div class="cval">${i.count}</div><button class="cn-inc">+</button></div><button class="del cn-del">×</button></div>`;}).join(''):'<div class="empty">No counters yet — add one above.</div>'}</div>`;
    document.getElementById('cn-add').onclick=()=>{ const n=document.getElementById('cn-name'); const g=document.getElementById('cn-goal'); const name=n.value.trim(); if(!name){n.focus();return;} const goal=g.value.trim()===''?'':Math.max(0,+g.value||0); list.push({id:uid(),name,count:0,step:1,goal}); persist(); renderCustom(); };
    el.querySelectorAll('.counter-card').forEach(row=>{ const id=row.dataset.id; const it=list.find(x=>x.id===id);
      row.querySelector('.cn-inc').onclick=()=>{ it.count+=it.step||1; persist(); renderCustom(); };
      row.querySelector('.cn-dec').onclick=()=>{ it.count=Math.max(0,it.count-(it.step||1)); persist(); renderCustom(); };
      row.querySelector('.cn-del').onclick=()=>{ tab.items=list.filter(x=>x.id!==id); persist(); renderCustom(); };
    });
  }

  /* ---- Notes ---- */
  function renderNotes(tab,el){
    const notes=tab.notes;
    el.innerHTML=ctabHead(tab,'Free-form note cards for anything.','<button class="btn sm" id="nt-add">+ Note</button>')
     +`<div class="grid g-2">${notes.length?notes.map(n=>`<div class="card note-card" data-id="${n.id}"><div class="row-flex" style="justify-content:space-between;align-items:center;"><input class="note-title" value="${esc(n.title)}" placeholder="Title"><button class="del nt-del">×</button></div><textarea class="nt-body" placeholder="Write here…" style="min-height:120px;margin-top:8px;">${esc(n.body)}</textarea></div>`).join(''):'<div class="card" style="grid-column:1/-1;"><div class="empty">No notes yet — tap “+ Note”.</div></div>'}</div>`;
    document.getElementById('nt-add').onclick=()=>{ notes.unshift({id:uid(),title:'',body:'',ts:Date.now()}); persist(); renderCustom(); };
    el.querySelectorAll('.note-card').forEach(row=>{ const id=row.dataset.id; const n=notes.find(x=>x.id===id);
      const ti=row.querySelector('.note-title'); ti.oninput=e=>{ n.title=e.target.value; }; ti.onblur=()=>persist();
      const bd=row.querySelector('.nt-body'); bd.oninput=e=>{ n.body=e.target.value; }; bd.onblur=()=>persist();
      row.querySelector('.nt-del').onclick=()=>{ tab.notes=notes.filter(x=>x.id!==id); persist(); renderCustom(); };
    });
  }

  /* ---- Timer runtime helpers ---- */
  let audioCtx;
  function beep(times){ try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); times=times||2; for(let i=0;i<times;i++){ const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.type='sine'; o.frequency.value=780; const t=audioCtx.currentTime+i*0.34; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.3); o.start(t); o.stop(t+0.32);} }catch(e){} }
  function fmtClock(sec){ sec=Math.max(0,Math.round(sec)); const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60; const p=n=>String(n).padStart(2,'0'); return h>0?`${h}:${p(m)}:${p(s)}`:`${p(m)}:${p(s)}`; }
  function ringSVG(id,frac){ const r=54,c=2*Math.PI*r,off=c*(1-Math.max(0,Math.min(1,frac))); return `<svg width="160" height="160" viewBox="0 0 130 130" style="max-width:48vw;"><circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--line)" stroke-width="8"/><circle id="${id}" cx="65" cy="65" r="${r}" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 65 65)" style="transition:stroke-dashoffset .25s linear;"/></svg>`; }
  function setRing(c,frac){ if(!c)return; const r=54,cir=2*Math.PI*r; c.style.strokeDashoffset=(cir*(1-Math.max(0,Math.min(1,frac)))).toFixed(1); }
  function stopRuntime(id){ const rt=runtime[id]; if(rt&&rt.iv){ clearInterval(rt.iv); } delete runtime[id]; }

  /* ---- Timer & Stopwatch ---- */
  function renderTimer(tab,el){
    let rt=runtime[tab.id];
    if(!rt){ const tot=tab.minutes*60+tab.seconds; rt=runtime[tab.id]={mode:'cd',cdTotal:tot,cdRemaining:tot,cdRunning:false,cdEndTs:0,swAccum:0,swRunning:false,swStartTs:0,iv:null}; }
    const isCd=rt.mode==='cd';
    const running=isCd?rt.cdRunning:rt.swRunning;
    el.innerHTML=ctabHead(tab,'Countdown timer and a stopwatch in one tab.','')
     +`<div class="card"><div class="row-flex" style="justify-content:center;margin-bottom:4px;gap:6px;">
          <button class="pill ${isCd?'gold':''}" data-mode="cd" style="cursor:pointer;">Countdown</button>
          <button class="pill ${!isCd?'gold':''}" data-mode="sw" style="cursor:pointer;">Stopwatch</button>
        </div>
        <div class="timer-display"><div class="ring-wrap">${ringSVG('tmr-ring-'+tab.id,1)}<div class="ring-label"><div class="mode">${isCd?'Time left':'Elapsed'}</div><div class="clock mono-time" id="tmr-clock-${tab.id}">00:00</div></div></div></div>
        ${isCd?`<div class="add-bar" style="justify-content:center;"><div class="field" style="max-width:90px;"><label>Min</label><input type="number" id="tmr-min" min="0" value="${tab.minutes}" ${running?'disabled':''}></div><div class="field" style="max-width:90px;"><label>Sec</label><input type="number" id="tmr-sec" min="0" max="59" value="${tab.seconds}" ${running?'disabled':''}></div></div>`:''}
        <div class="timer-ctrls"><button class="btn" id="tmr-start">${running?'Pause':'Start'}</button><button class="btn ghost" id="tmr-reset">Reset</button></div></div>`;
    el.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{ rt.mode=b.dataset.mode; renderCustom(); });
    if(isCd){
      const mi=document.getElementById('tmr-min'), se=document.getElementById('tmr-sec');
      const applySet=()=>{ tab.minutes=Math.max(0,+mi.value||0); tab.seconds=Math.max(0,Math.min(59,+se.value||0)); rt.cdRunning=false; if(rt.iv){clearInterval(rt.iv);rt.iv=null;} rt.cdTotal=rt.cdRemaining=tab.minutes*60+tab.seconds; persist(); renderCustom(); };
      mi.onchange=applySet; se.onchange=applySet;
    }
    document.getElementById('tmr-start').onclick=()=>{
      if(isCd){
        if(rt.cdRunning){ rt.cdRunning=false; if(rt.iv){clearInterval(rt.iv);rt.iv=null;} renderCustom(); }
        else { if(rt.cdRemaining<=0) rt.cdRemaining=rt.cdTotal=tab.minutes*60+tab.seconds; if(rt.cdRemaining<=0){toast('Set a duration first');return;} rt.cdRunning=true; rt.cdEndTs=Date.now()+rt.cdRemaining*1000; if(!rt.iv) rt.iv=setInterval(()=>timerTick(tab),250); renderCustom(); }
      } else {
        if(rt.swRunning){ rt.swAccum=rt.swAccum+(Date.now()-rt.swStartTs)/1000; rt.swRunning=false; if(rt.iv){clearInterval(rt.iv);rt.iv=null;} renderCustom(); }
        else { rt.swRunning=true; rt.swStartTs=Date.now(); if(!rt.iv) rt.iv=setInterval(()=>timerTick(tab),250); renderCustom(); }
      }
    };
    document.getElementById('tmr-reset').onclick=()=>{ if(rt.iv){clearInterval(rt.iv);rt.iv=null;} if(isCd){ rt.cdRunning=false; rt.cdTotal=rt.cdRemaining=tab.minutes*60+tab.seconds; } else { rt.swRunning=false; rt.swAccum=0; } renderCustom(); };
    timerTick(tab);
    if((isCd&&rt.cdRunning)||(!isCd&&rt.swRunning)){ if(!rt.iv) rt.iv=setInterval(()=>timerTick(tab),250); }
  }
  function timerTick(tab){
    const rt=runtime[tab.id]; if(!rt) return;
    const clock=document.getElementById('tmr-clock-'+tab.id);
    const ring=document.getElementById('tmr-ring-'+tab.id);
    if(rt.mode==='cd'){
      if(rt.cdRunning){ rt.cdRemaining=Math.max(0,(rt.cdEndTs-Date.now())/1000);
        if(rt.cdRemaining<=0){ rt.cdRemaining=0; rt.cdRunning=false; if(rt.iv){clearInterval(rt.iv);rt.iv=null;} beep(3); toast('⏰ Timer finished'); if(activeTab==='custom:'+tab.id) renderCustom(); return; } }
      if(clock) clock.textContent=fmtClock(rt.cdRemaining);
      setRing(ring, rt.cdTotal>0?rt.cdRemaining/rt.cdTotal:0);
    } else {
      const elapsed=rt.swAccum+(rt.swRunning?(Date.now()-rt.swStartTs)/1000:0);
      if(clock) clock.textContent=fmtClock(elapsed);
      setRing(ring, (elapsed%60)/60);
    }
  }

  /* ---- Pomodoro ---- */
  function pomoPhaseSecs(tab,phase){ return phase==='long'?tab.longBrk*60 : phase==='short'?tab.brk*60 : tab.focus*60; }
  function pomoLabel(p){ return p==='focus'?'Focus':p==='long'?'Long break':'Short break'; }
  function advancePomo(rt,tab){
    if(rt.phase==='focus'){ rt.focusCount++; rt.phase=(rt.focusCount%tab.rounds===0)?'long':'short'; }
    else { rt.phase='focus'; }
    rt.total=rt.remaining=pomoPhaseSecs(tab,rt.phase);
    if(rt.running) rt.endTs=Date.now()+rt.remaining*1000;
  }
  function renderPomodoro(tab,el){
    let rt=runtime[tab.id];
    if(!rt){ const t=tab.focus*60; rt=runtime[tab.id]={phase:'focus',focusCount:0,total:t,remaining:t,running:false,endTs:0,iv:null}; }
    const sessionNo=Math.min(tab.rounds, rt.focusCount+(rt.phase==='focus'?1:0));
    el.innerHTML=ctabHead(tab,'Focus / break cycles that advance automatically.',`<span class="pill ${rt.phase==='focus'?'red':'green'}">${pomoLabel(rt.phase)}</span>`)
     +`<div class="card"><div class="timer-display"><div class="mode">Round ${sessionNo} of ${tab.rounds}</div><div class="ring-wrap">${ringSVG('pom-ring-'+tab.id,1)}<div class="ring-label"><div class="mode">${pomoLabel(rt.phase)}</div><div class="clock mono-time" id="pom-clock-${tab.id}">00:00</div></div></div></div>
        <div class="timer-ctrls"><button class="btn" id="pom-start">${rt.running?'Pause':'Start'}</button><button class="btn ghost" id="pom-skip">Skip ▸</button><button class="btn ghost" id="pom-reset">Reset</button></div>
        <div class="add-bar" style="justify-content:center;margin-top:14px;">
          <div class="field" style="max-width:90px;"><label>Focus</label><input type="number" id="pom-focus" min="1" value="${tab.focus}"></div>
          <div class="field" style="max-width:90px;"><label>Break</label><input type="number" id="pom-brk" min="1" value="${tab.brk}"></div>
          <div class="field" style="max-width:100px;"><label>Long break</label><input type="number" id="pom-long" min="1" value="${tab.longBrk}"></div>
          <div class="field" style="max-width:90px;"><label>Rounds</label><input type="number" id="pom-rounds" min="1" value="${tab.rounds}"></div>
        </div></div>`;
    const applyCfg=()=>{ tab.focus=Math.max(1,+document.getElementById('pom-focus').value||25); tab.brk=Math.max(1,+document.getElementById('pom-brk').value||5); tab.longBrk=Math.max(1,+document.getElementById('pom-long').value||15); tab.rounds=Math.max(1,+document.getElementById('pom-rounds').value||4); if(rt.iv){clearInterval(rt.iv);rt.iv=null;} runtime[tab.id]={phase:'focus',focusCount:0,total:tab.focus*60,remaining:tab.focus*60,running:false,endTs:0,iv:null}; persist(); renderCustom(); };
    ['pom-focus','pom-brk','pom-long','pom-rounds'].forEach(id=>{ document.getElementById(id).onchange=applyCfg; });
    document.getElementById('pom-start').onclick=()=>{ if(rt.running){ rt.remaining=Math.max(0,(rt.endTs-Date.now())/1000); rt.running=false; if(rt.iv){clearInterval(rt.iv);rt.iv=null;} } else { rt.running=true; rt.endTs=Date.now()+rt.remaining*1000; if(!rt.iv) rt.iv=setInterval(()=>pomTick(tab),250); } renderCustom(); };
    document.getElementById('pom-skip').onclick=()=>{ advancePomo(rt,tab); renderCustom(); };
    document.getElementById('pom-reset').onclick=()=>{ if(rt.iv){clearInterval(rt.iv);rt.iv=null;} runtime[tab.id]={phase:'focus',focusCount:0,total:tab.focus*60,remaining:tab.focus*60,running:false,endTs:0,iv:null}; renderCustom(); };
    pomTick(tab);
    if(rt.running&&!rt.iv) rt.iv=setInterval(()=>pomTick(tab),250);
  }
  function pomTick(tab){
    const rt=runtime[tab.id]; if(!rt) return;
    if(rt.running){ rt.remaining=Math.max(0,(rt.endTs-Date.now())/1000);
      if(rt.remaining<=0){ beep(rt.phase==='focus'?3:2); toast(rt.phase==='focus'?'✅ Focus done — break time':'▶ Break over — back to focus'); advancePomo(rt,tab); if(activeTab==='custom:'+tab.id) renderCustom(); return; } }
    const clock=document.getElementById('pom-clock-'+tab.id); const ring=document.getElementById('pom-ring-'+tab.id);
    if(clock) clock.textContent=fmtClock(rt.remaining);
    setRing(ring, rt.total>0?rt.remaining/rt.total:0);
  }

  /* ===================== EXPORT / IMPORT ===================== */
  function doExport(){ const data=JSON.stringify({_app:'upsc-tracker',_v:1,state:S},null,2); const blob=new Blob([data],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='upsc-tracker-backup-'+todayStr()+'.json'; a.click(); URL.revokeObjectURL(a.href); toast('Backup downloaded'); }
  function doImport(e){ const file=e.target.files[0]; if(!file)return; const r=new FileReader(); r.onload=()=>{ try{ const parsed=JSON.parse(r.result); S=normalize(parsed.state||parsed); persist(); render(); toast('Backup restored'); }catch(err){ toast('Could not read that file'); } }; r.readAsText(file); e.target.value=''; }

  /* ===================== INIT ===================== */
  function init(){
    try{ const raw=localStorage.getItem(STATE_KEY); if(raw) S=normalize(JSON.parse(raw)); }catch(e){}
    cloud.clientId=localStorage.getItem(CLIENT_KEY)||'';
    render();
    if(cloud.clientId) tryAutoConnect();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
})();
</script>
</body>
